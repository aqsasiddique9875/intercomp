        .input-glass:focus-within {
            background: rgba(255, 255, 255, 0.95);

        .floating-label-input:focus ~ label,
        .floating-label-input:not(:placeholder-shown) ~ label {
            transform: translateY(-24px) scale(0.85);

        @keyframes shimmer {

        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

    <script>
        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.material-symbols-outlined');
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
            }
        }

        // DOM Elements
        const form = document.getElementById('signUpForm');
        const passInput = document.getElementById('password');
        const confirmInput = document.getElementById('confirmPassword');
        const passError = document.getElementById('passwordMatchError');
        const submitBtn = document.getElementById('submitBtn');
        const toast = document.getElementById('toast');
        const toastMsg = document.getElementById('toastMsg');
        const toastIcon = document.getElementById('toastIcon');

        // Password Strength Checker
        passInput.addEventListener('input', () => {
            const val = passInput.value;
            let score = 0;
            if (val.length >= 6) score++;
            if (/[A-Z]/.test(val) && /[0-9]/.test(val)) score++;
            if (/[^A-Za-z0-9]/.test(val)) score++;

            const bars = [document.getElementById('strengthBar1'), document.getElementById('strengthBar2'), document.getElementById('strengthBar3')];
            const text = document.getElementById('strengthText');

            bars.forEach(b => b.className = 'h-1 flex-1 rounded bg-black/10 transition-colors');

            if (val.length === 0) {
                text.textContent = 'Weak';
            } else if (score === 1) {
                bars[0].classList.replace('bg-black/10', 'bg-error');
                text.textContent = 'Weak';
                text.className = 'text-[11px] text-error ml-2 font-bold';
            } else if (score === 2) {
                bars[0].classList.replace('bg-black/10', 'bg-orange');
                bars[1].classList.replace('bg-black/10', 'bg-orange');
                text.textContent = 'Medium';
                text.className = 'text-[11px] text-orange ml-2 font-bold';
            } else if (score === 3) {
                bars[0].classList.replace('bg-black/10', 'bg-green-500');
                bars[1].classList.replace('bg-black/10', 'bg-green-500');
                bars[2].classList.replace('bg-black/10', 'bg-green-500');
                text.textContent = 'Strong';
                text.className = 'text-[11px] text-green-500 ml-2 font-bold';
            }
        });

        // Validate confirm password
        confirmInput.addEventListener('input', () => {
            if (confirmInput.value === passInput.value) {
                passError.classList.add('hidden');
            } else {
                passError.classList.remove('hidden');
            }
        });

        // Sign Up submission simulation
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const userVal = document.getElementById('username').value;
            const emailVal = document.getElementById('email').value;
            const passVal = document.getElementById('password').value;

            if (passInput.value !== confirmInput.value) {
                passError.classList.remove('hidden');
                return;
            }

            // Visual feedback
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>';
            submitBtn.disabled = true;

            fetch('http://localhost:8080/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: userVal, email: emailVal, password: passVal, role: 'student' })
            })
            .then(res => {
                if (!res.ok) throw new Error('Username or email already registered');
                return res.json();
            })
            .then(data => {
                localStorage.setItem('currentUser', JSON.stringify(data.user));
                
                submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px]">check_circle</span>';
                submitBtn.classList.replace('bg-primary', 'bg-green-500');

                showToast('Account created successfully!', 'check_circle', 'text-green-400');

                // Redirect after success
                setTimeout(() => {
                    const fallbackPath = 'mobile_73c01c0c980a45af8f3fe8eac02040d2_Login_Screen_COM-04.html';
                    if (window.parent && typeof window.parent.App !== 'undefined') {
                        window.parent.App.navigate('login');
                    } else {
                        window.location.href = fallbackPath;
                    }
                }, 1500);
            })
            .catch(err => {
                alert(err.message);
                submitBtn.innerHTML = 'Sign Up';
                submitBtn.disabled = false;
                submitBtn.classList.replace('bg-green-500', 'bg-primary');
            });
        });

        // Toast Helper
        function showToast(msg, iconName, iconColorClass) {
            toastMsg.textContent = msg;
            toastIcon.textContent = iconName;
            toastIcon.className = `material-symbols-outlined ${iconColorClass}`;
            toast.classList.remove('translate-y-20', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            setTimeout(() => {
                toast.classList.replace('translate-y-0', 'translate-y-20');
                toast.classList.replace('opacity-100', 'opacity-0');
            }, 3000);
        }

        // OAuth Handling
        const oauthModal = document.getElementById('oauthModal');
        const oauthCard = document.getElementById('oauthCard');
        const googleBtn = document.getElementById('googleBtn');
        const appleBtn = document.getElementById('appleBtn');

        googleBtn.addEventListener('click', () => {
            openOAuth('Google', `<svg class="w-6 h-6" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>`);
        });

        appleBtn.addEventListener('click', () => {
            openOAuth('Apple', `<svg class="w-6 h-6 fill-on-surface" viewBox="0 0 24 24"><path d="M17.05 20.28c-.98.95-2.05 1.74-3.15 1.74-1.07 0-1.39-.64-2.61-.64-1.23 0-1.6.63-2.6.63-1.08 0-2.12-.76-3.13-1.74-2.05-2.01-3.64-5.67-3.64-8.8 0-3.11 1.63-4.75 3.19-4.75 1.15 0 1.93.63 2.76.63.82 0 1.55-.63 2.7-.63 1.19 0 2.25.54 2.94 1.43-2.39 1.4-1.99 4.39.42 5.37-.89 2.14-1.76 4.37-3.08 6.76M12.03 7.25c-.15-2.23 1.66-4.07 3.27-4.25.21 2.24-1.78 4.21-3.27 4.25"></path></svg>`);
        });

        function openOAuth(provider, svgIcon) {
            document.getElementById('oauthTitle').textContent = `Sign Up with ${provider}`;
            document.getElementById('oauthLogo').innerHTML = svgIcon;
            oauthModal.classList.remove('hidden');
            setTimeout(() => {
                oauthCard.classList.remove('scale-95', 'opacity-0');
                oauthCard.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function closeOAuth() {
            oauthCard.classList.remove('scale-100', 'opacity-100');
            oauthCard.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                oauthModal.classList.add('hidden');
            }, 300);
        }

        function chooseOAuthAccount(name, email) {
            closeOAuth();
            if (!email) {
                showToast('Feature coming soon!', 'info', 'text-blue-400');
                return;
            }
            
            showToast(`Authenticating as ${name}...`, 'hourglass_empty', 'text-yellow-500 animate-spin');

            setTimeout(() => {
                showToast('Authentication Successful!', 'check_circle', 'text-green-400');
                
                setTimeout(() => {
                    // Navigate to Dashboard / MFA
                    if (window.parent && typeof window.parent.App !== 'undefined') {
                        window.parent.App.navigate('student-dash');
                    } else {
                        window.location.href = 'mobile_f6816511fb8a498b9f32199700db9876_Weekly_Tests_Hub.html';
                    }
                }, 1000);
            }, 1500);
        }

        // Taptic feedback
        const interactiveElements = document.querySelectorAll('.spring-active');
        interactiveElements.forEach(el => {
            el.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });

        // Local Fallback Routing support
        document.getElementById('loginLink').addEventListener('click', (e) => {
            if (window.parent && typeof window.parent.App !== 'undefined') {
                e.preventDefault();
                window.parent.App.navigate('login');
            }
        });
    </script>
</body>
</html>
