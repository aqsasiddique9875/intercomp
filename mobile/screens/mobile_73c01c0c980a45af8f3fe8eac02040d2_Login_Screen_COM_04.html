<style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #DCE4F7;
            overflow: hidden;
            margin: 0;
            padding: 0;
            height: 100vh;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }

        .input-glass {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .input-glass:focus-within {
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 0 0 3px rgba(163, 76, 190, 0.2);
            border-color: #a34cbe;
        }

        .floating-label-input:focus ~ label,
        .floating-label-input:not(:placeholder-shown) ~ label {
            transform: translateY(-24px) scale(0.85);
            color: #a34cbe;
            font-weight: 600;
        }

        .spring-active:active {
            transform: scale(0.96);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .social-btn {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(255, 255, 255, 0.8);
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .shimmer-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            animation: shimmer 2s infinite;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-mobile-margin">
<!-- Liquid Shader Background Container -->
<div class="fixed inset-0 z-0">

</div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[400px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-12 spring-active cursor-pointer">
<img alt="JobFlow Glassmorphic Logo" class="w-24 h-24 drop-shadow-xl" src="https://lh3.googleusercontent.com/aida/AP1WRLtHSlvHQm1XNZ4vaeue1GiJtF1j680ovYDsV1bz1IH37RWIQlHCDhIMbTh8QwjysUr_9axMNLFk7d5MtN1sRrdkCEgDdsjpU6S18_eICdCZ5ObBXpk8IMqmy52sfrJsOQaMvz7hk48gtvML_dmfwlaY-1QmOzz74jRWaBViW4SbLXgO-jIKC3LPueU0Wmini7A--bmI3LnC19bd8jueIoFhpwFhp4dCzG3gBDdCSwoekhL8nTJD3FWqr2Qs"/>
</div>
<!-- Floating Glass Login Card -->
<div class="glass-card w-full rounded-[32px] p-8 flex flex-col space-y-8 animate-in fade-in zoom-in duration-700">
<header class="text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">Welcome Back</h1>
<p class="text-on-surface-variant text-body-md-mobile opacity-80">Access your professional journey</p>
</header>
<!-- Form Container -->
<form class="space-y-6" id="loginForm" onsubmit="event.preventDefault()">
<!-- Email Input Group -->
<div class="relative flex flex-col">
<div class="input-glass h-14 w-full rounded-2xl relative flex items-center px-4">
<input class="floating-label-input w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md-mobile pt-2" id="email" name="email" placeholder=" " required="" type="email"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60 font-body-md-mobile pointer-events-none transition-all duration-300 origin-left" for="email">
                            Email Address
                        </label>
</div>
</div>
<!-- Password Input Group -->
<div class="relative flex flex-col">
<div class="input-glass h-14 w-full rounded-2xl relative flex items-center px-4">
<input class="floating-label-input w-full bg-transparent border-none focus:ring-0 text-on-surface font-body-md-mobile pt-2" id="password" name="password" placeholder=" " required="" type="password"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant opacity-60 font-body-md-mobile pointer-events-none transition-all duration-300 origin-left" for="password">
                            Password
                        </label>
<button class="text-primary opacity-60 hover:opacity-100 transition-opacity" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end mt-2">
<a class="text-[13px] font-medium text-on-background opacity-60 hover:opacity-100 transition-opacity" href="#">
                            Forgot Password?
                        </a>
</div>
</div>
<!-- Login Button -->
<button class="w-full h-14 bg-primary text-on-primary font-bold text-[17px] rounded-full shadow-lg shadow-primary/20 spring-active flex items-center justify-center transition-all duration-300 hover:brightness-110 active:brightness-95 overflow-hidden relative" type="submit">
<span class="relative z-10">Login</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center space-x-4">
<div class="h-[0.5px] flex-1 bg-on-surface-variant opacity-20"></div>
<span class="text-[12px] font-semibold text-on-surface-variant opacity-40 uppercase tracking-widest">or continue with</span>
<div class="h-[0.5px] flex-1 bg-on-surface-variant opacity-20"></div>
</div>
<!-- Social Logins -->
<div class="flex justify-center space-x-6">
<!-- Apple -->

</svg>
</button>
<!-- Google -->

<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
</div>
<!-- Sign Up Footer -->
<footer class="text-center pt-2">
<p class="text-body-md-mobile text-on-surface-variant">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline" href="#">Join Now</a>
</p>
</footer>
</div>
<!-- Safe Area Spacer -->
<div class="h-safe-bottom"></div>
</main>
<script>
        // Micro-interactions and simple logic
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('loginForm');
            const button = form.querySelector('button[type="submit"]');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Visual feedback for interaction
                button.innerHTML = '<span class="material-symbols-outlined animate-spin">progress_activity</span>';
                button.classList.add('opacity-80', 'cursor-not-allowed');
                
                setTimeout(() => {
                    button.innerHTML = '<span class="material-symbols-outlined">check_circle</span>';
                    button.classList.add('bg-tertiary');
                    
                    // Trigger a mock navigation
                    setTimeout(() => {
                        console.log("Logged in successfully");
                        button.innerHTML = 'Login';
                        button.classList.remove('bg-tertiary', 'opacity-80', 'cursor-not-allowed');
                    }, 1000);
                }, 1500);
            });

            // Taptic-like feedback on touch devices
            const interactiveElements = document.querySelectorAll('.spring-active');
            interactiveElements.forEach(el => {
                el.addEventListener('touchstart', () => {
                    if (window.navigator.vibrate) window.navigator.vibrate(10);
                });
            });
        });
    </script>
</body></html>
