<style>
        body {
            background-color: #DCE4F7;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.1);
        }

        .liquid-bg-orb {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.6;
            animation: move 20s infinite alternate ease-in-out;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .ios-spring {
            transition: all 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .ios-press:active {
            transform: scale(0.96);
        }

        /* Custom Checkbox */
        .glass-checkbox {
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 6px;
            border: 1px solid rgba(71, 26, 112, 0.3);
            background: rgba(255, 255, 255, 0.2);
            position: relative;
            cursor: pointer;
            transition: 0.2s;
        }
        .glass-checkbox:checked {
            background: #8731a3;
            border-color: #8731a3;
        }
        .glass-checkbox:checked::after {
            content: 'check';
            font-family: 'Material Symbols Outlined';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body class="min-h-screen text-on-background">
<!-- Animated Background Orbs -->
<div class="liquid-bg-orb bg-primary-container" style="top: -100px; left: -100px;"></div>
<div class="liquid-bg-orb bg-secondary-container" style="bottom: -100px; right: -100px; animation-delay: -5s;"></div>
<!-- Top App Bar (Shared Component Implementation) -->

<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 hover:opacity-80 transition-opacity">

<!-- bottom nav elements -->

<script>
        // Simple Interaction logic
        const docImage = document.getElementById('doc-image');
        const rotateBtn = document.getElementById('rotate');
        const zoomInBtn = document.getElementById('zoom-in');
        
        let rotation = 0;
        let scale = 1;

        rotateBtn.addEventListener('click', () => {
            rotation += 90;
            updateTransform();
        });

        zoomInBtn.addEventListener('click', () => {
            scale = scale === 1 ? 1.5 : 1;
            updateTransform();
            zoomInBtn.querySelector('span').innerText = scale === 1.5 ? 'zoom_out' : 'zoom_in';
        });

        function updateTransform() {
            docImage.style.transform = `rotate(${rotation}deg) scale(${scale})`;
        }

        // Checklist completion feedback
        const checkboxes = document.querySelectorAll('.glass-checkbox');
        const approveBtn = document.querySelector('.bg-primary');

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', () => {
                const checkedCount = Array.from(checkboxes).filter(c => c.checked).length;
                if(checkedCount === checkboxes.length) {
                    approveBtn.classList.add('animate-bounce');
                    setTimeout(() => approveBtn.classList.remove('animate-bounce'), 1000);
                }
            });
        });
    </script>
