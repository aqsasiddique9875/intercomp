<!DOCTYPE html>

<html class="light" lang="en">

<head>
  <meta charset="utf-8" />
  <meta content="width=393, height=852, initial-scale=1.0, user-scalable=no" name="viewport" />
  <title>JobFlow Onboarding</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --apple-spring: cubic-bezier(0.25, 1, 0.5, 1);
    }

    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(120deg, #DCE4F7 0%, #E7EEFF 50%, #F5F7FF 100%) !important;
    }

    .carousel-container {
      display: flex;
      transition: transform 0.6s var(--apple-spring);
      width: 300%;
      height: 100%;
    }

    .slide {
      width: 100vw !important;
      height: 100% !important;
      flex-shrink: 0 !important;
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      justify-content: flex-start !important;
      padding-top: 70px !important;
      padding-bottom: 0 !important;
      padding-left: 44px !important;
      padding-right: 44px !important;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 0.5px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      height: 420px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
    }

    .active-pill {
      width: 24px !important;
      background-color: #A34CBE !important;
      box-shadow: 0 0 8px rgba(163, 76, 190, 0.4);
    }

    .btn-press:active {
      transform: scale(0.96);
    }

    /* Custom scroll suppression for onboarding */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    .illustration-crop {
      width: 240px;
      height: 160px;
      background-size: 300% 100%;
      background-repeat: no-repeat;
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#8731a3",
            "on-primary": "#ffffff",
            "background": "#f9f9ff",
            "on-background": "#471A70",
            "surface-variant": "#dbe3f6",
            "primary-container": "#a34cbe",
            "glass-fill": "rgba(255, 255, 255, 0.35)",
            "glass-thick": "rgba(255, 255, 255, 0.8)",
            "glass-border": "rgba(255, 255, 255, 0.6)"
          },
          spacing: {
            "mobile-margin": "20px",
            "safe-top": "44px",
            "safe-bottom": "34px"
          },
          fontFamily: {
            "headline-lg-mobile": ["Inter"],
            "body-md-mobile": ["Inter"]
          },
          fontSize: {
            "headline-lg-mobile": ["28px", { lineHeight: "1.3", letterSpacing: "-0.01em", fontWeight: "700" }],
            "body-md-mobile": ["15px", { lineHeight: "1.5", fontWeight: "400" }]
          }
        }
      }
    }
  </script>
</head>

<body class="relative text-on-background select-none">
  <!-- Background Animated Shader -->

  <!-- Top Navigation -->
  <header class="fixed top-0 left-0 w-full z-50 flex justify-end items-center px-mobile-margin h-safe-top pt-8">
    <button
      class="text-[rgba(71,26,112,0.6)] font-semibold text-sm tracking-tight btn-press transition-transform duration-[0.35s]">
      Skip
    </button>
  </header>
  <!-- Main Content Carousel -->
  <main class="relative z-10 w-full h-full overflow-hidden">
    <div class="carousel-container" id="carousel">
      <!-- Slide 1: Verified Assessments -->
      <section class="slide">
        <div class="glass-card flex flex-col items-center">
          <div class="illustration-crop mb-4"
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQSpbJ6-QTcr5eohChKeJMWDTZDA626mn89EMB92TiXbbFSiT9Rxp6dxzPupn9dqu1tPdIFCjDF25EpF4hXJH5QgDRX9ymSnYtGtpa3H7-bDh4nRtZX4yBXUpj9PQAugfEL5VC9eEoHXKgAzMOZrxdAsvhir9y1GatI7Ql1_JzJAkT4Y4MQGoXWMOtO3zrcCpLOzBLwHq06HcQhHu1qdRGWCu-OdVDiqvicBmY5YnASM12-OlTjJPf7y4cuNgxxGSIcH81CN9SLeXt'); background-position: 50% 0%;">
          </div>
          <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">Verified Assessments</h2>
          <p class="font-body-md-mobile text-body-md-mobile text-on-background/70 px-4">
            Showcase your true potential with industry-standard skills verification.
          </p>
        </div>
      </section>
      <!-- Slide 2: Secure Path -->
      <section class="slide">
        <div class="glass-card flex flex-col items-center">
          <div class="illustration-crop mb-4"
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQSpbJ6-QTcr5eohChKeJMWDTZDA626mn89EMB92TiXbbFSiT9Rxp6dxzPupn9dqu1tPdIFCjDF25EpF4hXJH5QgDRX9ymSnYtGtpa3H7-bDh4nRtZX4yBXUpj9PQAugfEL5VC9eEoHXKgAzMOZrxdAsvhir9y1GatI7Ql1_JzJAkT4Y4MQGoXWMOtO3zrcCpLOzBLwHq06HcQhHu1qdRGWCu-OdVDiqvicBmY5YnASM12-OlTjJPf7y4cuNgxxGSIcH81CN9SLeXt'); background-position: 0% 0%;">
          </div>
          <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">Secure Path</h2>
          <p class="font-body-md-mobile text-body-md-mobile text-on-background/70 px-4">
            Advanced anti-cheat protocols ensuring a fair and transparent hiring journey.
          </p>
        </div>
      </section>
      <!-- Slide 3: AI Matching -->
      <section class="slide">
        <div class="glass-card flex flex-col items-center">
          <div class="illustration-crop mb-4"
            style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQSpbJ6-QTcr5eohChKeJMWDTZDA626mn89EMB92TiXbbFSiT9Rxp6dxzPupn9dqu1tPdIFCjDF25EpF4hXJH5QgDRX9ymSnYtGtpa3H7-bDh4nRtZX4yBXUpj9PQAugfEL5VC9eEoHXKgAzMOZrxdAsvhir9y1GatI7Ql1_JzJAkT4Y4MQGoXWMOtO3zrcCpLOzBLwHq06HcQhHu1qdRGWCu-OdVDiqvicBmY5YnASM12-OlTjJPf7y4cuNgxxGSIcH81CN9SLeXt'); background-position: 100% 0%;">
          </div>
          <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">AI Matching</h2>
          <p class="font-body-md-mobile text-body-md-mobile text-on-background/70 px-4">
            Intelligent algorithms connecting your unique skills with perfect-fit opportunities.
          </p>
        </div>
      </section>
    </div>
  </main>
  <!-- Footer Controls -->
  <footer class="fixed left-0 w-full z-50 px-mobile-margin flex flex-col items-center gap-4" style="bottom: 120px !important;">
    <!-- Page Indicators -->
    <div class="flex gap-2">
      <div class="indicator w-2 h-2 rounded-full bg-on-background/10 transition-all duration-300 active-pill"
        data-index="0"></div>
      <div class="indicator w-2 h-2 rounded-full bg-on-background/10 transition-all duration-300" data-index="1"></div>
      <div class="indicator w-2 h-2 rounded-full bg-on-background/10 transition-all duration-300" data-index="2"></div>
    </div>
    <!-- Primary Action Button -->
    <button
      class="w-full h-[44px] bg-primary-container text-on-primary font-bold rounded-full shadow-[0_8px_24px_rgba(163,76,190,0.3)] btn-press transition-all duration-[0.35s] ease-[var(--apple-spring)] flex items-center justify-center"
      id="nextBtn">
      Next
    </button>
  </footer>
  <script>
    let currentSlide = 0;
    const carousel = document.getElementById('carousel');
    const nextBtn = document.getElementById('nextBtn');
    const indicators = document.querySelectorAll('.indicator');
    const totalSlides = 3;

    async function loadSlides() {
      try {
        const response = await fetch('http://localhost:8080/api/onboarding');
        if (!response.ok) throw new Error('API down');
        const data = await response.json();
        
        carousel.innerHTML = '';
        data.forEach(slide => {
          const section = document.createElement('section');
          section.className = 'slide';
          section.innerHTML = `
            <div class="glass-card flex flex-col items-center">
              <div class="illustration-crop mb-4"
                style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQSpbJ6-QTcr5eohChKeJMWDTZDA626mn89EMB92TiXbbFSiT9Rxp6dxzPupn9dqu1tPdIFCjDF25EpF4hXJH5QgDRX9ymSnYtGtpa3H7-bDh4nRtZX4yBXUpj9PQAugfEL5VC9eEoHXKgAzMOZrxdAsvhir9y1GatI7Ql1_JzJAkT4Y4MQGoXWMOtO3zrcCpLOzBLwHq06HcQhHu1qdRGWCu-OdVDiqvicBmY5YnASM12-OlTjJPf7y4cuNgxxGSIcH81CN9SLeXt'); background-position: ${slide.position};">
              </div>
              <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-2">${slide.title}</h2>
              <p class="font-body-md-mobile text-body-md-mobile text-on-background/70 px-4">
                ${slide.description}
              </p>
            </div>
          `;
          carousel.appendChild(section);
        });
      } catch (err) {
        console.warn("Could not load slides from remote config backend. Using static fallbacks. Error:", err);
      }
    }

    loadSlides();

    function updateCarousel() {
      carousel.style.transform = `translateX(-${currentSlide * 100}vw)`;

      indicators.forEach((ind, idx) => {
        if (idx === currentSlide) {
          ind.classList.add('active-pill');
        } else {
          ind.classList.remove('active-pill');
        }
      });

      if (currentSlide === totalSlides - 1) {
        nextBtn.innerText = 'Get Started';
      } else {
        nextBtn.innerText = 'Next';
      }
    }

    nextBtn.addEventListener('click', () => {
      if (currentSlide < totalSlides - 1) {
        currentSlide++;
        updateCarousel();
      } else {
        // Handle onboarding completion
        if (window.parent && window.parent.App && window.parent.App.navigate) {
          window.parent.App.navigate('role-selection');
        } else {
          window.location.href = 'mobile_ed5135a3e3674964b190166cbcbf1113_Role_Selection_COM-03.html';
        }
      }
    });

    // Wire up the skip button
    const skipBtn = document.querySelector('header button');
    if (skipBtn) {
      skipBtn.addEventListener('click', () => {
        if (window.parent && window.parent.App && window.parent.App.navigate) {
          window.parent.App.navigate('role-selection');
        } else {
          window.location.href = 'mobile_ed5135a3e3674964b190166cbcbf1113_Role_Selection_COM-03.html';
        }
      });
    }

    // Touch Handling for Swiping
    let startX = 0;
    carousel.addEventListener('touchstart', (e) => {
      startX = e.touches[0].clientX;
    });

    carousel.addEventListener('touchend', (e) => {
      let endX = e.changedTouches[0].clientX;
      let diff = startX - endX;

      if (Math.abs(diff) > 50) {
        if (diff > 0 && currentSlide < totalSlides - 1) {
          currentSlide++;
        } else if (diff < 0 && currentSlide > 0) {
          currentSlide--;
        }
        updateCarousel();
      }
    });
  </script>
</body>
</html>
