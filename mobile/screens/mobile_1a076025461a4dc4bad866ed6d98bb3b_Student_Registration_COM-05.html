<style>
        body {
            background-color: #DCE4F7;
            color: #471A70;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }

        .liquid-mercury-progress {
            height: 6px;
            background: rgba(0, 0, 0, 0.05);
            position: relative;
            overflow: hidden;
        }

        .liquid-mercury-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ade80, #22c55e);
            box-shadow: 0 0 15px rgba(34, 197, 94, 0.6);
            transition: width 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            position: relative;
        }

        .liquid-mercury-fill::after {
            content: '';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
        }

        .ios-spring {
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        
        .ios-spring:active {
            transform: scale(0.96);
        }

        .step-transition {
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-tag {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .glass-tag.active {
            background: #8731a3;
            color: white;
            border-color: #8731a3;
            box-shadow: 0 4px 12px rgba(135, 49, 163, 0.3);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Ambient Background Effect */
        .ambient-blob {
            position: fixed;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.4;
            border-radius: 50%;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="font-body-md-mobile text-body-md-mobile flex flex-col min-h-screen">
<!-- Ambient Accents -->
<div class="ambient-blob bg-primary w-96 h-96 -top-20 -left-20"></div>
<div class="ambient-blob bg-secondary w-80 h-80 top-1/2 -right-20"></div>
<!-- Top App Bar -->
<header class="fixed top-0 w-full z-50 backdrop-blur-2xl border-b border-glass-border shadow-sm bg-glass-fill flex justify-between items-center px-mobile-margin h-14">
<div class="flex items-center gap-3">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center text-white text-[10px] font-bold">JD</div>
<h1 class="font-display-xl-mobile text-display-xl-mobile font-bold text-primary">JobFlow</h1>
</div>
<button class="material-symbols-outlined text-primary p-2 rounded-full hover:bg-glass-thick/10 transition-colors duration-300 active:scale-95 transition-transform duration-[0.35s] ease-[cubic-bezier(0.17,0.67,0.41,1.08)]">tune</button>
</header>
<!-- Progress Bar (Mercury Style) -->
<div class="fixed top-14 left-0 w-full z-40 liquid-mercury-progress">
<div class="liquid-mercury-fill" id="progressFill" style="width: 33.33%;"></div>
</div>
<!-- Main Content Canvas -->
<main class="flex-grow pt-24 pb-32 px-mobile-margin">
<div class="max-w-md mx-auto relative overflow-hidden" id="wizardContainer">
<!-- Step 1: Basic Info -->
<section class="step-transition" id="step1">
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile mb-2">Kickstart your flow.</h2>
<p class="text-on-surface-variant">Let's start with the essentials to build your professional profile.</p>
</div>
<div class="glass-card rounded-3xl p-6 space-y-6">
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile uppercase text-on-surface-variant">Full Name</label>
<input class="w-full bg-glass-thick border border-glass-border rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="Alex Rivera" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile uppercase text-on-surface-variant">University Email</label>
<input class="w-full bg-glass-thick border border-glass-border rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all" placeholder="alex.r@edu.com" type="email"/>
</div>
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile uppercase text-on-surface-variant">Graduation Year</label>
<select class="w-full bg-glass-thick border border-glass-border rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all appearance-none">

</div>

<!-- Step 2: Interests (Hidden by default) -->

<div class="mb-8">

<p class="text-on-surface-variant">Select the career paths that align with your vibe.</p>
</div>
<div class="glass-card rounded-3xl p-6">

<button class="glass-tag px-4 py-2 rounded-full font-label-caps-mobile" onclick="this.classList.toggle('active')">Data Science</button>
<button class="glass-tag px-4 py-2 rounded-full font-label-caps-mobile" onclick="this.classList.toggle('active')">Fullstack Dev</button>
<button class="glass-tag px-4 py-2 rounded-full font-label-caps-mobile" onclick="this.classList.toggle('active')">Cybersecurity</button>
<button class="glass-tag px-4 py-2 rounded-full font-label-caps-mobile" onclick="this.classList.toggle('active')">Marketing Tech</button>
<button class="glass-tag px-4 py-2 rounded-full font-label-caps-mobile" onclick="this.classList.toggle('active')">Mobile Apps</button>

<div class="glass-card rounded-3xl p-6 space-y-6">

</div>
<div class="space-y-4">

<div class="flex items-center gap-3">

<nav class="fixed bottom-0 w-full z-50 pb-safe-bottom backdrop-blur-3xl rounded-t-xl bg-glass-thick border-t border-glass-border shadow-lg flex justify-around items-center h-16 px-mobile-gutter">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-[0.35s] ease-[cubic-bezier(0.17,0.67,0.41,1.08)]">
<span class="material-symbols-outlined">explore</span>
<span class="font-label-caps-mobile text-label-caps-mobile">Discover</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity active:scale-90 transition-transform duration-[0.35s] ease-[cubic-bezier(0.17,0.67,0.41,1.08)]">

</button>

</button>

<span class="material-symbols-outlined">person</span>
<span class="font-label-caps-mobile text-label-caps-mobile">Profile</span>
</button>

<script>
        let currentStep = 1;
        const totalSteps = 3;
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn = document.getElementById('prevBtn');
        const progressFill = document.getElementById('progressFill');

        function updateUI() {
            // Update Progress Bar
            const percentage = (currentStep / totalSteps) * 100;
            progressFill.style.width = `${percentage}%`;

            // Transition Steps
            for (let i = 1; i <= totalSteps; i++) {
                const step = document.getElementById(`step${i}`);
                if (i === currentStep) {
                    step.classList.remove('hidden', 'opacity-0', 'translate-x-12', '-translate-x-12');
                    step.classList.add('opacity-100', 'translate-x-0');
                } else {
                    step.classList.add('hidden', 'opacity-0');
                    if (i < currentStep) {
                        step.classList.add('-translate-x-12');
                    } else {
                        step.classList.add('translate-x-12');
                    }
                }
            }

            // Update Navigation Buttons
            if (currentStep === 1) {
                prevBtn.classList.add('opacity-0', 'pointer-events-none');
            } else {
                prevBtn.classList.remove('opacity-0', 'pointer-events-none');
            }

            if (currentStep === totalSteps) {
                nextBtn.innerHTML = 'Complete <span class="material-symbols-outlined">check_circle</span>';
                nextBtn.classList.replace('bg-primary', 'bg-tertiary-container');
            } else {
                nextBtn.innerHTML = 'Next Step <span class="material-symbols-outlined">east</span>';
                nextBtn.classList.replace('bg-tertiary-container', 'bg-primary');
            }
        }

        nextBtn.addEventListener('click', () => {
            if (currentStep < totalSteps) {
                currentStep++;
                updateUI();
            } else {
                // Final Submission Logic
                nextBtn.innerHTML = 'Processing...';
                setTimeout(() => {
                    alert('Registration Successful! Redirecting to Dashboard.');
                }, 1000);
            }
        });

        prevBtn.addEventListener('click', () => {
            if (currentStep > 1) {
                currentStep--;
                updateUI();
            }
        });

        // Initialize UI
        updateUI();
    </script>
</body></html>
