<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}]

          },

<style>
        body {
            background-color: #DCE4F7;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .glass-input.active {
            border-color: #54a3ff;
            box-shadow: 0 0 15px rgba(84, 163, 255, 0.4);
            animation: pulse-blue 2s infinite;
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(84, 163, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(84, 163, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(84, 163, 255, 0); }
        }

        .keypad-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.6);
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(120deg, #DCE4F7 0%, #E7EEFF 50%, #F5F7FF 100%);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

  </head>
<body class="flex flex-col h-screen max-h-screen">
<!-- Notification Toast -->
<div id="email-notification" class="fixed top-4 left-4 right-4 bg-slate-900/95 backdrop-blur-md text-white p-4 rounded-2xl shadow-2xl border border-white/10 z-50 transform -translate-y-32 transition-transform duration-500 flex items-start gap-3">
  <div class="p-2 bg-primary/20 rounded-xl text-primary flex items-center justify-center">
    <span class="material-symbols-outlined text-primary">mail</span>
  </div>
  <div class="flex-1">
    <div class="flex justify-between items-center">
      <span class="text-xs font-bold text-slate-400 tracking-wider">EMAIL CLIENT</span>
      <span class="text-[10px] text-slate-500">Just now</span>
    </div>
    <p class="text-sm font-semibold text-slate-200 mt-1">Verification Code</p>
    <p class="text-xs text-slate-400 mt-0.5">Your 6-digit EliteHire security code is <strong class="text-primary-fixed-dim text-sm tracking-wider font-bold" id="mfa-code-display">123456</strong>.</p>
  </div>
</div>

<div class="liquid-bg"></div>
<!-- Top App Bar (Shared Component Logic) -->
<header class="flex items-center px-mobile-margin h-14 w-full top-0 z-10">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200 ease-out">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</button>
<h1 class="ml-4 font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-background">Security Check</h1>
</header>
<main class="flex-1 overflow-y-auto px-mobile-margin flex flex-col items-center pt-2 pb-64">
<!-- 3D Glassmorphic Icon Placeholder -->
<div class="relative w-20 h-20 mb-4 flex items-center justify-center">
<div class="absolute inset-0 bg-primary/10 blur-3xl rounded-full"></div>
<div class="glass-card w-16 h-16 rounded-xl flex items-center justify-center transform rotate-12 transition-transform hover:rotate-0 duration-500">
<span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
<!-- Decorative "Liquid" Glass bubbles -->
<div class="absolute -top-1 -right-1 w-6 h-6 rounded-full glass-card opacity-60"></div>
<div class="absolute -bottom-2 -left-1 w-8 h-8 rounded-full glass-card opacity-40"></div>
</div>
<!-- Content -->
<div class="text-center mb-4 w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-on-background mb-1">Verify Your Identity</h2>
<p class="font-body-md-mobile text-body-md-mobile text-on-surface-variant px-4" id="mfa-desc">Enter the 6-digit code sent to your email.</p>
</div>
<!-- Code Inputs -->
<div class="grid grid-cols-6 gap-2 w-full max-w-sm mb-2" id="otp-container">
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background active" data-index="0"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="1"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="2"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="3"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="4"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="5"></div>
</div>
<!-- Error Message -->
<p id="error-message" class="text-error text-sm font-bold mb-4 h-5 opacity-0 transition-opacity duration-300">Invalid verification code. Please try again.</p>
<!-- Links -->
<div class="flex flex-col items-center gap-2">
<button class="font-label-caps-mobile text-label-caps-mobile text-primary font-bold hover:opacity-70 transition-opacity">RESEND CODE</button>
<button id="try-another-btn" class="font-label-caps-mobile text-label-caps-mobile text-outline font-bold hover:opacity-70 transition-opacity">SEND CODE TO PHONE NUMBER</button>
</div>
</main>
<!-- Glass Numeric Keypad -->
<div class="fixed bottom-0 left-0 w-full z-20 px-4 pb-safe-bottom">
<div class="glass-card rounded-t-3xl p-3 grid grid-cols-3 gap-2 border-b-0">
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('1')">1</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('2')">2</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('3')">3</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('4')">4</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('5')">5</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('6')">6</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('7')">7</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('8')">8</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('9')">9</button>
<div class="h-14"></div>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-xl font-bold text-on-background transition-all" onclick="handleKey('0')">0</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-on-background transition-all" onclick="handleKey('back')">
<span class="material-symbols-outlined text-2xl">backspace</span>
</button>
</div>
</div>
<script>
        let currentCode = "";
        const maxLen = 6;
        const inputs = document.querySelectorAll('.glass-input');
        let targetCode = "";
        let currentMethod = "email";
        
        function generateCode() {
            targetCode = Math.floor(100000 + Math.random() * 900000).toString();
            
            const notification = document.getElementById('email-notification');
            const iconSpan = notification.querySelector('.material-symbols-outlined');
            const senderSpan = notification.querySelector('.tracking-wider');
            const titleP = notification.querySelector('.font-semibold');
            const descP = notification.querySelector('.text-xs');
            
            if (currentMethod === "email") {
                iconSpan.textContent = "mail";
                senderSpan.textContent = "EMAIL CLIENT";
                titleP.textContent = "Verification Code";
                descP.innerHTML = `Your 6-digit EliteHire security code is <strong class="text-primary-fixed-dim text-sm tracking-wider font-bold" id="mfa-code-display">${targetCode}</strong>.`;
            } else {
                iconSpan.textContent = "sms";
                senderSpan.textContent = "SMS MESSAGE";
                titleP.textContent = "SMS Security Code";
                descP.innerHTML = `Your SMS security verification code is <strong class="text-primary-fixed-dim text-sm tracking-wider font-bold" id="mfa-code-display">${targetCode}</strong>.`;
            }
            
            notification.classList.remove('-translate-y-32');
            notification.classList.add('translate-y-0');
            
            // Forward to parent device frame's Dynamic Island
            if (window.parent && window.parent !== window) {
                window.parent.postMessage({
                    type: 'OTP_RECEIVED',
                    code: targetCode,
                    method: currentMethod
                }, '*');
            }
            
            // Hide notification after 8 seconds
            setTimeout(() => {
                notification.classList.remove('translate-y-0');
                notification.classList.add('-translate-y-32');
            }, 8000);
        }

        // Generate on load
        window.addEventListener('load', () => {
            setTimeout(generateCode, 500);
        });

        // Wire Resend Code button
        const resendBtn = document.querySelector('button[onclick="generateCode()"]') || 
                          document.evaluate("//button[contains(., 'RESEND')]", document, null, XPathResult.ANY_TYPE, null).iterateNext();
        if (resendBtn) {
            resendBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentCode = "";
                updateDisplay();
                generateCode();
            });
        }

        // Wire Try Another Method button
        const tryAnotherBtn = document.getElementById('try-another-btn');
        if (tryAnotherBtn) {
            tryAnotherBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                currentCode = "";
                updateDisplay();
                currentMethod = currentMethod === "email" ? "sms" : "email";
                
                const desc = document.getElementById('mfa-desc');
                if (currentMethod === "email") {
                    desc.textContent = "Enter the 6-digit code sent to your email.";
                    tryAnotherBtn.textContent = "SEND CODE TO PHONE NUMBER";
                } else {
                    desc.textContent = "Enter the 6-digit code sent to your phone (+1 *** ***-**92).";
                    tryAnotherBtn.textContent = "SEND CODE TO EMAIL";
                }
                generateCode();
            });
        }

        // Back button navigation hook
        const backBtn = document.querySelector('header button');
        if (backBtn) {
            backBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                if (window.parent && window.parent.App && window.parent.App.navigate) {
                    window.parent.App.navigate('login');
                } else {
                    window.location.href = 'mobile_73c01c0c980a45af8f3fe8eac02040d2_Login_Screen_COM-04.html';
                }
            });
        }

        function handleKey(key) {
            if (key === 'back') {
                if (currentCode.length > 0) {
                    currentCode = currentCode.slice(0, -1);
                }
            } else if (currentCode.length < maxLen) {
                currentCode += key;
            }

            updateDisplay();

            if (currentCode.length === maxLen) {
                if (currentCode === targetCode) {
                    // Success
                    setTimeout(() => {
                        inputs.forEach(input => {
                            input.classList.remove('active');
                            input.classList.add('border-tertiary', 'text-tertiary');
                        });
                        setTimeout(() => {
                            let nextView = 'student-dash';
                            try {
                                const storedUser = localStorage.getItem('currentUser');
                                if (storedUser) {
                                    const userObj = JSON.parse(storedUser);
                                    if (userObj.role === 'recruiter') {
                                        nextView = 'company-dash';
                                    } else if (userObj.role === 'admin') {
                                        window.top.location.href = '/admin/index.html';
                                        return;
                                    }
                                }
                            } catch (e) {}

                            if (window.parent && window.parent.App && window.parent.App.navigate) {
                                window.parent.App.navigate(nextView);
                            } else {
                                if (nextView === 'company-dash') {
                                    window.location.href = 'mobile_e52141a0e71046c5b2161e0532141b7b_Company_Dashboard_COM_10_iOS_Liquid_Glass.html';
                                } else {
                                    window.location.href = 'mobile_f6816511fb8a498b9f32199700db9876_Weekly_Tests_Hub.html';
                                }
                            }
                        }, 500);
                    }, 100);
                } else {
                    // Error
                    setTimeout(() => {
                        inputs.forEach(input => {
                            input.classList.add('border-error', 'text-error');
                        });
                        document.getElementById('error-message').classList.remove('opacity-0');
                        document.getElementById('error-message').classList.add('opacity-100');
                        
                        setTimeout(() => {
                            currentCode = "";
                            inputs.forEach(input => {
                                input.classList.remove('border-error', 'text-error');
                            });
                            document.getElementById('error-message').classList.remove('opacity-100');
                            document.getElementById('error-message').classList.add('opacity-0');
                            updateDisplay();
                        }, 1500);
                    }, 100);
                }
            }
        }

        function updateDisplay() {
            inputs.forEach((input, index) => {
                input.textContent = currentCode[index] || "";
                input.classList.remove('active');
                if (index === currentCode.length || (index === maxLen - 1 && currentCode.length === maxLen)) {
                    input.classList.add('active');
                }
            });
        }

        // Simple tactile feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
</body></html>
