<style>
        body {
            -webkit-tap-highlight-color: transparent;
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #DCE4F7 0%, #f9f9ff 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }
        .spring-bounce {
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .spring-bounce:active {
            transform: scale(0.96);
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<div class="absolute -bottom-1 -right-1 bg-tertiary-container text-white px-2 py-0.5 rounded-full flex items-center gap-1 shadow-sm">
<span class="material-symbols-outlined text-[12px]" style="font-variation-settings: 'FILL' 1;">star</span>
<span class="text-[10px] font-bold">5.0</span>
</div>
</div>
<div>
<h2 class="text-headline-lg-mobile font-bold text-on-surface leading-tight">Sarah Jenkins</h2>
<p class="text-body-md-mobile text-on-surface-variant">Senior Product Designer</p>
</div>
</div>
<p class="text-body-md-mobile text-on-surface leading-relaxed italic opacity-90">
                "Helping designers master digital materiality and craft high-fidelity interfaces."
            </p>
</section>
<!-- Date Selection Carousel -->

</button>

<span class="material-symbols-outlined" data-icon="person">person</span>

</button>

<script>
        // Simple Interaction logic for slot selection
        document.querySelectorAll('.grid button:not(.cursor-not-allowed)').forEach(btn => {
            btn.addEventListener('click', function() {
                // Remove active states from siblings or all other buttons in grid
                document.querySelectorAll('.grid button').forEach(b => b.classList.remove('border-primary', 'border-2'));
                // Add active state to clicked
                this.classList.add('border-primary', 'border-2');
            });
        });

        // Simple interaction for date selection
        document.querySelectorAll('.hide-scrollbar button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.hide-scrollbar button').forEach(b => {
                    b.classList.remove('bg-primary', 'text-white', 'shadow-lg');
                    b.classList.add('glass-card', 'text-on-surface-variant');
                });
                this.classList.remove('glass-card', 'text-on-surface-variant');
                this.classList.add('bg-primary', 'text-white', 'shadow-lg');
            });
        });
    </script>
