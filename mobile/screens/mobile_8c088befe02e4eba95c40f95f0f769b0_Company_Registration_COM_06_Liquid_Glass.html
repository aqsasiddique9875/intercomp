<!DOCTYPE html>

<style>
        body {
            background: linear-gradient(135deg, #DCE4F7 0%, #f9f9ff 100%);
            min-height: 100vh;
            color: #471A70;
            overflow-x: hidden;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.3s cubic-bezier(0.35, 0, 0.2, 1);
        }
        .glass-input:focus {
            outline: none;
            border-color: #8731a3;
            box-shadow: 0 0 0 3px rgba(135, 49, 163, 0.1);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #4D9EFA 0%, #BF7DF5 100%);
            box-shadow: 0 8px 30px rgba(77, 158, 250, 0.3);
        }
        .safe-pb {
            padding-bottom: calc(env(safe-area-inset-bottom) + 34px);
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }
    </style>
</head>
<body class="flex flex-col font-body-md-mobile text-body-md-mobile">
<!-- TopAppBar -->
<header class="fixed top-0 w-full pt-safe-top z-50 backdrop-blur-[28px] border-b border-glass-border bg-glass-fill h-[88px] flex items-center shadow-[0_12px_40px_0_rgba(71,26,112,0.15)]">
<div class="flex items-center px-mobile-margin h-full w-full justify-between">
<div class="flex items-center gap-4">
<button class="active:scale-[0.96] transition-transform duration-[350ms] ease-[cubic-bezier(0.35,0,0.2,1)] hover:opacity-80 transition-opacity text-primary">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back_ios</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-surface">Company Registration</h1>
</div>
</div>
</header>
<!-- Content Area -->
<main class="flex-1 mt-[88px] px-mobile-margin pb-[120px]">
<!-- Welcome Text -->
<section class="mt-8 mb-10">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background opacity-90">Let's verify your business</h2>
<p class="text-on-surface-variant mt-2">Enter your details to begin the professional verification process.</p>
</section>
<!-- Form Fields -->
<form class="space-y-6">
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-background pl-1">COMPANY NAME</label>
<input class="glass-input w-full h-[56px] rounded-xl px-4 text-on-surface placeholder:text-on-surface-variant/40" placeholder="e.g. Acme Corporation" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-background pl-1">WEBSITE URL</label>
<input class="glass-input w-full h-[56px] rounded-xl px-4 text-on-surface placeholder:text-on-surface-variant/40" placeholder="https://www.acme.com" type="url"/>
</div>
<div class="space-y-2 relative">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-background pl-1">SELECT INDUSTRY</label>
<div class="relative">
<select class="glass-input w-full h-[56px] rounded-xl px-4 appearance-none text-on-surface bg-transparent focus:ring-0">
<option disabled="" selected="" value="">Select your sector</option>
<option value="tech">Technology</option>
<option value="finance">Finance</option>
<option value="healthcare">Healthcare</option>
<option value="retail">Retail &amp; E-commerce</option>
<option value="other">Other</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none">
<span class="material-symbols-outlined text-primary">expand_more</span>
</div>
</div>
</div>
<!-- Upload Zone -->
<div class="pt-4">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-background pl-1 mb-2 block">VERIFICATION DOCUMENTS</label>
<div class="glass-card w-full rounded-xxl p-8 flex flex-col items-center justify-center text-center border-dashed border-2 border-primary/20 relative group active:scale-[0.98] transition-transform duration-300">
<div class="animate-float mb-4">
<img alt="Upload Icon" class="w-24 h-24 object-contain" src="https://lh3.googleusercontent.com/aida/AP1WRLufCPufXPgJQQ973RUxU-wQkWShRvWh3G_jbgY9rWJnqKEspLd5Jc0Ndv187iCzwVn1bmOrFCkXgt_oOYi9YixeyC8vMwFniZFjBLsz5kNyF7t26BvG2MNYcdS2WJ1vz0MJvfzSNm3wgS56IdnPm6UX2m3asUQmCQrFDOj6db-WZTWLQOR11iXE2pFiWHn9aoAZQ8dAKUAhugR4741GwifHv_0W8B1I6y2x14LEu9YTL-pGxRCUX6cIxrBq"/>
</div>
<h3 class="font-semibold text-on-background text-[17px] mb-1">Drop Documents Here</h3>
<p class="text-sm text-on-surface-variant opacity-60">PDF, JPG, or PNG (Max 10MB)</p>
<!-- Decorative corner accents -->
<div class="absolute top-4 left-4 w-4 h-4 border-t-2 border-l-2 border-primary/30 rounded-tl-sm"></div>
<div class="absolute top-4 right-4 w-4 h-4 border-t-2 border-r-2 border-primary/30 rounded-tr-sm"></div>
<div class="absolute bottom-4 left-4 w-4 h-4 border-b-2 border-l-2 border-primary/30 rounded-bl-sm"></div>
<div class="absolute bottom-4 right-4 w-4 h-4 border-b-2 border-r-2 border-primary/30 rounded-br-sm"></div>
</div>
</div>
</form>
<!-- Informational Prompt -->
<div class="mt-8 p-4 glass-card rounded-xl flex gap-4 items-start">
<span class="material-symbols-outlined text-primary">info</span>
<p class="text-[13px] leading-snug text-on-surface-variant">
                Verification usually takes <span class="text-primary font-semibold">24-48 hours</span>. We will notify you via the registered business email.
            </p>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full z-50 bg-glass-thick backdrop-blur-[32px] border-t border-glass-border safe-pb pt-4">
<div class="px-mobile-margin">
<button class="primary-gradient w-full h-[56px] rounded-full text-white font-bold text-[17px] active:scale-[0.96] transition-all duration-[350ms] shadow-lg flex items-center justify-center gap-2">
                Submit Registration for Verification
                <span class="material-symbols-outlined" style="font-size: 20px;">verified</span>
</button>
</div>
</div>
<!-- Background Decoration (Light Effect) -->
<div class="fixed top-[-10%] right-[-10%] w-[300px] h-[300px] bg-[#BF7DF5] blur-[100px] opacity-20 pointer-events-none -z-10"></div>
<div class="fixed bottom-[-10%] left-[-10%] w-[400px] h-[400px] bg-[#4D9EFA] blur-[120px] opacity-15 pointer-events-none -z-10"></div>
<script>
        // Micro-interaction for form inputs
        const inputs = document.querySelectorAll('.glass-input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
                input.parentElement.style.transition = 'transform 0.3s ease';
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple upload simulation
        const uploadZone = document.querySelector('.glass-card');
        uploadZone.addEventListener('click', () => {
            uploadZone.classList.add('bg-primary/10');
            setTimeout(() => {
                uploadZone.classList.remove('bg-primary/10');
                alert('File selection interface would open here.');
            }, 200);
        });
    </script>
</body></html>
