<script>
        // Micro-interaction for HUD sliding
        const hud = document.getElementById('hud-panel');
        let startY = 0;
        let currentTranslateY = 0;

        hud.addEventListener('touchstart', (e) => {
            startY = e.touches[0].clientY;
        });

        hud.addEventListener('touchmove', (e) => {
            const deltaY = e.touches[0].clientY - startY;
            if (deltaY > 0) { // Only allow sliding down
                hud.style.transform = `translateY(${deltaY}px)`;
            }
        });

        hud.addEventListener('touchend', (e) => {
            const deltaY = e.changedTouches[0].clientY - startY;
            if (deltaY > 100) {
                // Minimize if swiped down significantly
                hud.style.transform = `translateY(75%)`;
            } else {
                // Reset to default
                hud.style.transform = `translateY(0)`;
            }
        });

        // Click to toggle
        hud.addEventListener('click', (e) => {
            if (hud.style.transform === 'translateY(75%)') {
                hud.style.transform = 'translateY(0)';
            }
        });

        // Simple pulse effect for the location marker
        const marker = document.querySelector('circle:last-child');
        let scale = 1;
        let growing = true;
        
        function animateMarker() {
            if (growing) {
                scale += 0.01;
                if (scale >= 1.5) growing = false;
            } else {
                scale -= 0.01;
                if (scale <= 1) growing = true;
            }
            marker.setAttribute('r', 16 * scale);
            requestAnimationFrame(animateMarker);
        }
        animateMarker();
    </script>
