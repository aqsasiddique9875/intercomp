<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Question Wizard - Screen 42</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            background-color: #DCE4F7; /* Specific Lavender-Blue from prompt */
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8); /* glass-thick */
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
        }

        .active-scale:active {
            transform: scale(0.96);
            transition: transform 0.2s cubic-bezier(0.35, 0, 0.25, 1);
        }

        /* Material Symbols weight settings */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        .material-fill {
            font-variation-settings: 'FILL' 1;
        }

        /* Hide scrollbars for the horizontal type selector */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed-dim": "#a3c9ff",
                        "surface-tint": "#8d37a9",
                        "gold": "#FFD60A",
                        "on-tertiary-container": "#e6ffe0",
                        "surface-container": "#e7eeff",
                        "surface-bright": "#f9f9ff",
                        "primary-container": "#a34cbe",
                        "glass-thick": "rgba(255, 255, 255, 0.8)",
                        "orange": "#FF9F0A",
                        "secondary-container": "#54a3ff",
                        "on-primary-container": "#fff5fb",
                        "surface-dim": "#d2daed",
                        "on-secondary-container": "#003868",
                        "surface-variant": "#dbe3f6",
                        "glass-border": "rgba(255, 255, 255, 0.6)",
                        "primary-fixed": "#fbd7ff",
                        "on-secondary-fixed": "#001c39",
                        "on-tertiary-fixed-variant": "#00531a",
                        "tertiary": "#006823",
                        "outline": "#817381",
                        "secondary-fixed": "#d3e3ff",
                        "on-primary-fixed-variant": "#72188f",
                        "on-error-container": "#93000a",
                        "on-secondary-fixed-variant": "#004883",
                        "primary": "#8731a3",
                        "on-background": "#471A70",
                        "on-primary": "#ffffff",
                        "surface-container-low": "#f0f3ff",
                        "error": "#FF453A",
                        "on-tertiary": "#ffffff",
                        "on-surface": "#141c29",
                        "on-error": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "secondary": "#0060ab",
                        "card-gradient": "linear-gradient(135deg, #4D9EFA 0%, #BF7DF5 100%)",
                        "surface": "#f9f9ff",
                        "tertiary-container": "#00842f",
                        "on-primary-fixed": "#330044",
                        "inverse-surface": "#29313f",
                        "primary-fixed-dim": "#f0b0ff",
                        "tertiary-fixed-dim": "#47e266",
                        "inverse-on-surface": "#ecf1ff",
                        "glass-fill": "rgba(255, 255, 255, 0.35)",
                        "on-tertiary-fixed": "#002106",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#d2c1d2",
                        "surface-container-high": "#e0e8fb",
                        "inverse-primary": "#f0b0ff",
                        "surface-container-highest": "#dbe3f6",
                        "error-container": "#ffdad6",
                        "tertiary-fixed": "#6cff82",
                        "background": "#f9f9ff",
                        "on-surface-variant": "#4f4350"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "safe-bottom": "34px",
                        "max-width": "1280px",
                        "mobile-gutter": "16px",
                        "base": "8px",
                        "mobile-margin": "20px",
                        "safe-top": "44px",
                        "desktop-margin": "64px",
                        "desktop-gutter": "24px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Inter"],
                        "body-md-mobile": ["Inter"],
                        "label-caps-mobile": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                        "body-md-mobile": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "label-caps-mobile": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                }
            }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen text-on-background pb-32">
<!-- Atmospheric Liquid Background -->
<div class="liquid-bg">

</div>
<!-- Top App Bar (Shared Component Strategy) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-mobile-margin h-safe-top bg-glass-fill backdrop-blur-md border-b border-glass-border shadow-[0_12px_40px_0_rgba(71,26,112,0.15)]">
<button class="active:scale-95 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary">close</span>
</button>
<h1 class="font-headline-lg-mobile text-[20px] font-bold text-on-background">Question Wizard</h1>
<button class="active:scale-95 transition-opacity duration-200">
<span class="material-symbols-outlined text-primary">help_outline</span>
</button>
</header>
<!-- Main Scrollable Canvas -->
<main class="pt-[80px] px-mobile-margin space-y-8 pb-32">
<!-- Step Indicator -->
<div class="space-y-3">
<div class="flex justify-between items-end">
<span class="font-label-caps-mobile text-label-caps-mobile text-primary tracking-widest uppercase">Step 2 of 4</span>
<span class="font-body-md-mobile text-sm font-semibold text-on-background">Question Content</span>
</div>
<div class="h-1.5 w-full bg-white/30 rounded-full overflow-hidden">
<div class="h-full w-1/2 bg-primary-container rounded-full"></div>
</div>
</div>
<!-- Section 1: Question Type Selector -->
<section class="space-y-4">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant font-bold">QUESTION TYPE</label>
<div class="flex space-x-4 overflow-x-auto no-scrollbar pb-2">
<!-- Multiple Choice (Selected) -->
<div class="flex-shrink-0 flex flex-col items-center justify-center w-28 h-28 glass-card rounded-3xl ring-2 ring-primary-container bg-primary-container/20">
<span class="material-symbols-outlined text-primary mb-2 text-3xl material-fill">radio_button_checked</span>
<span class="font-label-caps-mobile text-[11px] text-primary">Multiple Choice</span>
</div>
<!-- Coding -->
<div class="flex-shrink-0 flex flex-col items-center justify-center w-28 h-28 glass-card rounded-3xl hover:bg-white/40 active-scale transition-all">
<span class="material-symbols-outlined text-on-surface-variant mb-2 text-3xl">terminal</span>
<span class="font-label-caps-mobile text-[11px] text-on-surface-variant">Coding</span>
</div>
<!-- Essay -->
<div class="flex-shrink-0 flex flex-col items-center justify-center w-28 h-28 glass-card rounded-3xl hover:bg-white/40 active-scale transition-all">
<span class="material-symbols-outlined text-on-surface-variant mb-2 text-3xl">description</span>
<span class="font-label-caps-mobile text-[11px] text-on-surface-variant">Essay</span>
</div>
</div>
</section>
<!-- Section 2: Question Text Input -->
<section class="space-y-4">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant font-bold">QUESTION TEXT</label>
<div class="glass-card rounded-2xl p-4 min-h-[140px]">
<textarea class="w-full h-full bg-transparent border-none focus:ring-0 text-on-background font-body-md-mobile placeholder-on-surface-variant/50 resize-none" placeholder="Enter your question here..."></textarea>
</div>
</section>
<!-- Section 3: Options Manager -->
<section class="space-y-4">
<div class="flex justify-between items-center">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant font-bold">OPTIONS</label>
<span class="font-label-caps-mobile text-[10px] text-tertiary-container flex items-center gap-1">
<span class="material-symbols-outlined text-xs material-fill">verified</span> Correct Answer marked
                </span>
</div>
<div class="space-y-3">
<!-- Option 1 (Correct) -->
<div class="glass-input flex items-center p-3 rounded-2xl border-l-4 border-l-tertiary shadow-sm">
<div class="w-6 h-6 rounded-full border-2 border-tertiary flex items-center justify-center mr-3 bg-tertiary/10">
<div class="w-3 h-3 bg-tertiary rounded-full"></div>
</div>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background font-body-md-mobile" type="text" value="Design Thinking"/>
<span class="material-symbols-outlined text-tertiary ml-2">check_circle</span>
</div>
<!-- Option 2 -->
<div class="glass-input flex items-center p-3 rounded-2xl shadow-sm">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant mr-3"></div>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background font-body-md-mobile" placeholder="Add an option..." type="text" value="Agile Workflow"/>
<button class="material-symbols-outlined text-on-surface-variant/40 ml-2">close</button>
</div>
<!-- Option 3 -->
<div class="glass-input flex items-center p-3 rounded-2xl shadow-sm">
<div class="w-6 h-6 rounded-full border-2 border-outline-variant mr-3"></div>
<input class="bg-transparent border-none focus:ring-0 w-full text-on-background font-body-md-mobile" placeholder="Add an option..." type="text" value="Waterfall Model"/>
<button class="material-symbols-outlined text-on-surface-variant/40 ml-2">close</button>
</div>
<!-- Add Option Button -->
<button class="w-full flex items-center justify-center py-4 rounded-2xl border-2 border-dashed border-white/60 bg-white/10 text-primary active-scale">
<span class="material-symbols-outlined mr-2">add_circle</span>
<span class="font-label-caps-mobile text-sm">Add Option</span>
</button>
</div>
</section>
<!-- Section 4: Metadata (Skill Tags) -->
<section class="space-y-4">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant font-bold">SKILL TAGS</label>
<div class="flex flex-wrap gap-2">
<div class="bg-secondary-container/20 text-secondary border border-glass-border backdrop-blur-sm px-4 py-2 rounded-full font-label-caps-mobile text-[11px] flex items-center gap-2">
                    UI Design <span class="material-symbols-outlined text-[14px]">close</span>
</div>
<div class="bg-secondary-container/20 text-secondary border border-glass-border backdrop-blur-sm px-4 py-2 rounded-full font-label-caps-mobile text-[11px] flex items-center gap-2">
                    Prototyping <span class="material-symbols-outlined text-[14px]">close</span>
</div>
<button class="bg-white/40 text-primary border border-glass-border backdrop-blur-sm px-4 py-2 rounded-full font-label-caps-mobile text-[11px] flex items-center gap-1 active-scale">
<span class="material-symbols-outlined text-[16px]">add</span> Add Tag
                </button>
</div>
</section>
<!-- Spacer for footer -->
<div class="h-10"></div>
</main>
<!-- Footer: Navigation Buttons -->
<footer class="fixed bottom-0 left-0 w-full px-mobile-margin pb-safe-bottom bg-glass-thick backdrop-blur-2xl border-t border-glass-border flex items-center gap-4 h-24 z-50">
<button class="flex-1 h-12 rounded-full bg-white/50 border border-glass-border font-label-caps-mobile text-on-surface-variant active-scale">
            Previous
        </button>
<button class="flex-[2] h-12 rounded-full bg-primary-container text-white font-headline-lg-mobile text-[16px] shadow-lg shadow-primary-container/30 active-scale flex items-center justify-center gap-2">
            Save &amp; Next
            <span class="material-symbols-outlined">arrow_forward</span>
</button>
</footer>
<!-- Micro-interaction JS -->
<script>
        document.querySelectorAll('.active-scale').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('touchend', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Simple tag removal simulation
        document.querySelectorAll('.bg-secondary-container\\/20').forEach(tag => {
            tag.querySelector('.material-symbols-outlined').addEventListener('click', () => {
                tag.style.opacity = '0';
                setTimeout(() => tag.remove(), 200);
            });
        });
    </script>
</body></html>
