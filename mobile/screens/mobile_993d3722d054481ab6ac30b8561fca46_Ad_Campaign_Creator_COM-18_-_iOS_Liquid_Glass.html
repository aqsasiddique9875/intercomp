<style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at 0% 0%, #F9F9FF 0%, #E7EEFF 100%);
            -webkit-tap-highlight-color: transparent;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-input:focus {
            background: #ffffff;
            border-color: #8731a3;
            box-shadow: 0 0 0 4px rgba(135, 49, 163, 0.1);
            outline: none;
        }

        .primary-gradient-btn {
            background: linear-gradient(135deg, #a34cbe 0%, #8731a3 100%);
            box-shadow: 0 8px 24px rgba(135, 49, 163, 0.3);
        }

        .primary-gradient-btn:active {
            transform: scale(0.96);
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #8731a3;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            border: 4px solid white;
            margin-top: -10px;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #d2c1d2;
            border-radius: 2px;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        .phone-container {
            width: 260px;
            height: 520px;
            border: 10px solid #29313f;
            border-radius: 36px;
            background: #f0f3ff;
            overflow: hidden;
            position: relative;
        }

        .phone-island {
            width: 80px;
            height: 20px;
            background: #29313f;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 12px;
            border-bottom-right-radius: 12px;
            z-index: 10;
        }

        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .shimmer::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            transform: translateX(-100%);
            animation: shimmer 2s infinite;
        }
    </style>
</head>

<script>
        // Simple slider value update
        const slider = document.querySelector('input[type="range"]');
        const budgetDisplay = document.querySelector('.text-primary.font-bold');
        
        slider.addEventListener('input', (e) => {
            budgetDisplay.textContent = `$${parseFloat(e.target.value).toFixed(2)}`;
