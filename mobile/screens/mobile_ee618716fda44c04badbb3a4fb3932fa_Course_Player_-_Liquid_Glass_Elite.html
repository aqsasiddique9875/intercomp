<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
    <title>Course Player - SkillsBooster Academy</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
              "primary": "#8731a3",
              "primary-container": "#a34cbe",
              "on-surface": "#141c29",
              "on-surface-variant": "#4f4350",
              "outline": "#817381",
              "background": "#DCE4F7",
            },
            "fontFamily": {
              "body-md-mobile": ["Inter"],
            },
            "spacing": {
              "safe-bottom": "34px",
              "base": "8px",
              "mobile-gutter": "16px",
              "safe-top": "44px",
              "mobile-margin": "20px",
            }
          },
        },
      }
    </script>
    <style>
        body {
            background-color: #DCE4F7;
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            min-height: max(884px, 100dvh);
            font-family: 'Inter', sans-serif;
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            filter: blur(80px);
            opacity: 0.8;
        }

        .blob-1 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: #BF7DF5;
            border-radius: 50%;
            top: -20%;
            left: -20%;
            opacity: 0.6;
        }

        .blob-2 {
            position: absolute;
            width: 600px;
            height: 600px;
            background: #4D9EFA;
            border-radius: 50%;
            bottom: -20%;
            right: -20%;
            opacity: 0.5;
        }

        .lecture-card {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px 0 rgba(71, 26, 112, 0.05);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .lecture-card.active {
            background: rgba(135, 49, 163, 0.12);
            border-color: rgba(135, 49, 163, 0.35);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .video-gradient-overlay {
            background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 40%);
        }
        
        .active-tab {
            color: #8731a3 !important;
            border-bottom: 2px solid #8731a3;
            font-weight: 700;
        }
    </style>
</head>
<body class="font-body-md-mobile text-on-background antialiased flex flex-col h-screen">

<!-- Atmospheric Liquid Background -->
<div class="liquid-bg">
    <div class="blob-1"></div>
    <div class="blob-2"></div>
</div>

<!-- Header -->
<header class="w-full flex items-center gap-4 px-mobile-margin py-4 pt-10 bg-transparent shrink-0">
    <button onclick="goBack()" class="w-10 h-10 rounded-full bg-white/40 backdrop-blur-md border border-white/60 flex items-center justify-center flex-shrink-0 shadow-sm active:scale-90 transition-transform">
        <span class="material-symbols-outlined text-[#8731a3]">arrow_back</span>
    </button>
    <h1 id="currentCourseTitle" class="text-[#471A70] font-bold text-[16px] leading-tight flex-1 truncate pr-4">Mastering Google Antigravity: From Setup to Deployment</h1>
</header>

<!-- Theater-style Video Window -->
<section class="relative w-full aspect-video overflow-hidden shadow-2xl z-10 bg-black shrink-0 group">
    <video id="courseVideo" class="w-full h-full object-cover cursor-pointer" src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" autoplay></video>
    
    <!-- Image Viewer -->
    <div id="imageViewer" class="absolute inset-0 bg-gray-900 flex items-center justify-center hidden z-10">
      <img class="max-h-full max-w-full object-contain" src="" alt="Image Viewer"/>
    </div>

    <!-- Document Viewer -->
    <div id="documentViewer" class="absolute inset-0 bg-[#f8f9fa] flex flex-col items-center justify-center p-6 hidden z-10">
      <div id="docMetaView" class="flex flex-col items-center justify-center">
        <span class="material-symbols-outlined text-[#8731a3] text-5xl mb-2">description</span>
        <p class="doc-title text-sm font-bold text-[#471A70] text-center max-w-[200px] truncate">Document Name</p>
        <p class="doc-size text-[11px] text-[#726580] mt-0.5">1.2 MB</p>
        <button id="readDocBtn" onclick="readDocument()" class="mt-4 px-4 py-1.5 rounded-full bg-[#8731a3] text-white text-xs font-bold shadow-md">Read Document</button>
      </div>
      <!-- Scrollable docx text preview -->
      <div id="docxContentView" class="hidden w-full h-full text-left bg-white p-4 rounded-xl overflow-y-auto border border-gray-200 text-xs text-gray-700 leading-relaxed relative">
        <button onclick="closeDocReader()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-900 transition-colors p-1 hover:bg-gray-100 rounded-full flex items-center justify-center">
          <span class="material-symbols-outlined text-[16px]">close</span>
        </button>
        <div id="docxParsedHtml" class="pt-6 pr-4"></div>
      </div>
    </div>

    <!-- Custom Video Player Controls Overlay -->
    <div id="videoCustomControls" class="absolute bottom-2 left-2 right-2 bg-black/65 backdrop-blur-md rounded-2xl p-2.5 flex flex-col gap-2 border border-white/10 opacity-0 group-hover:opacity-100 transition-opacity duration-300 z-20">
      <!-- Timeline -->
      <div class="flex items-center gap-2 w-full group/timeline">
        <div id="videoTimeline" class="flex-grow h-1.5 bg-white/20 rounded-full cursor-pointer relative" onclick="seekVideo(event)">
          <div id="videoProgress" class="absolute top-0 left-0 h-full bg-primary rounded-full" style="width: 0%"></div>
        </div>
      </div>
      
      <!-- Buttons -->
      <div class="flex items-center justify-between text-white text-xs select-none">
        <div class="flex items-center gap-3">
          <button onclick="togglePlayPause(event)" class="hover:scale-115 active:scale-95 transition-transform flex items-center justify-center focus:outline-none">
            <span id="playIcon" class="material-symbols-outlined text-[18px] pointer-events-none">pause</span>
          </button>
          <button onclick="skipVideo(event, -10)" class="hover:scale-115 active:scale-95 transition-transform flex items-center justify-center focus:outline-none">
            <span class="material-symbols-outlined text-[18px] pointer-events-none">replay_10</span>
          </button>
          <span class="font-medium font-mono text-[10px]"><span id="currentTime">0:00</span> / <span id="durationTime">0:00</span></span>
          <button onclick="skipVideo(event, 10)" class="hover:scale-115 active:scale-95 transition-transform flex items-center justify-center focus:outline-none">
            <span class="material-symbols-outlined text-[18px] pointer-events-none">forward_10</span>
          </button>
        </div>
        
        <div class="flex items-center gap-3 text-gray-200">
          <button id="speedBtn" onclick="cycleSpeed(event)" class="hover:text-white font-extrabold text-[10px] border border-white/20 rounded-lg px-2 py-0.5 focus:outline-none bg-white/10">1x</button>
          <button onclick="toggleMute(event)" class="hover:scale-115 active:scale-95 transition-transform flex items-center justify-center focus:outline-none">
            <span id="volumeIcon" class="material-symbols-outlined text-[18px] pointer-events-none">volume_up</span>
          </button>
          <button onclick="toggleAspect(event)" class="hover:scale-115 active:scale-95 transition-transform flex items-center justify-center focus:outline-none">
            <span id="aspectIcon" class="material-symbols-outlined text-[18px] pointer-events-none">open_in_full</span>
          </button>
          <button onclick="toggleFullscreen(event)" class="hover:scale-115 active:scale-95 transition-transform flex items-center justify-center focus:outline-none">
            <span class="material-symbols-outlined text-[18px] pointer-events-none">fullscreen</span>
          </button>
        </div>
      </div>
    </div>
    

</section>

<!-- AI Copilot Assistant Accordion -->
<div class="px-mobile-margin mt-4">
    <div class="border border-[#8731a3]/20 bg-[#8731a3]/5 rounded-2xl overflow-hidden">
      <div class="p-3.5 flex items-center justify-between cursor-pointer select-none hover:bg-[#8731a3]/10" id="aiAccordionHeader">
        <div class="flex items-center gap-2 text-[#471A70] font-bold text-xs">
          <span class="material-symbols-outlined text-primary text-[18px]">auto_awesome</span>
          <span>Dive deeper on this topic</span>
        </div>
        <span class="material-symbols-outlined text-primary text-[18px]" id="aiAccordionIcon">expand_more</span>
      </div>
      
      <!-- Accordion Content -->
      <div class="p-3.5 pt-0 flex flex-wrap gap-2 border-t border-[#8731a3]/10 hidden" id="aiAccordionContent">
        <button onclick="askMockAI('practice')" class="border border-[#8731a3]/20 bg-white/60 hover:bg-white text-[#471A70] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-sm">Give me practice questions</button>
        <button onclick="askMockAI('simple')" class="border border-[#8731a3]/20 bg-white/60 hover:bg-white text-[#471A70] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-sm">Explain this topic in simple terms</button>
        <button onclick="askMockAI('summary')" class="border border-[#8731a3]/20 bg-white/60 hover:bg-white text-[#471A70] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-sm">Give me a summary</button>
        <button onclick="askMockAI('examples')" class="border border-[#8731a3]/20 bg-white/60 hover:bg-white text-[#471A70] px-3 py-1.5 rounded-xl text-[11px] font-bold transition-all shadow-sm">Give me real-life examples</button>
      </div>
    </div>
</div>


<!-- Navigation Tabs -->
<div id="course-tabs" class="flex px-mobile-margin mt-6 gap-6 border-b border-white/40 overflow-x-auto hide-scrollbar shrink-0">
    <button onclick="switchTab(this)" class="pb-3 font-bold text-sm whitespace-nowrap active-tab">Dashboard</button>
    <button onclick="switchTab(this)" class="pb-3 text-[#726580] font-medium text-sm whitespace-nowrap">Grades</button>
    <button onclick="switchTab(this)" class="pb-3 text-[#726580] font-medium text-sm whitespace-nowrap">Forums</button>
    <button onclick="switchTab(this)" class="pb-3 text-[#726580] font-medium text-sm whitespace-nowrap">Notes</button>
    <button onclick="switchTab(this)" class="pb-3 text-[#726580] font-medium text-sm whitespace-nowrap">Resources</button>
    <button onclick="switchTab(this)" class="pb-3 text-[#726580] font-medium text-sm whitespace-nowrap">Info</button>
</div>

<!-- Content Area: Dynamic List -->
<main class="flex-grow overflow-y-auto pb-safe-bottom">
    <div id="lectureList" class="px-mobile-margin mt-6 space-y-4 pb-12">
        <!-- Cards will be dynamically injected here -->
    </div>
</main>

<script>
    // Course-specific syllabus, notes, and info database
    const courseData = {
      'ux': {
        title: "Advanced UI/UX Liquid Design Patterns",
        modules: [
          {
            name: "Module 1: Introduction",
            description: "Understand the core fundamentals and setup guidelines.",
            items: [
              { id: "ux1", name: "Introduction to Liquid Glass Aesthetics", type: "video", duration: "3 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
              { id: "ux2", name: "Designing Pastel Color Palettes", type: "video", duration: "5 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
              { id: "ux3", name: "Implementing Backdrop Blurs in CSS", type: "video", duration: "8 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
              { id: "ux4", name: "Micro-interactions & Spring Physics", type: "video", duration: "6 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" },
              { id: "ux5", name: "Final Case Study Submission", type: "video", duration: "12 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4" }
            ]
          },
          {
            name: "module 1",
            items: [],
            locked: true
          },
          {
            name: "module 2",
            items: [],
            locked: true
          }
        ],
        notes: [
          "Glassmorphism requires `backdrop-filter: blur(20px)` and a thin semi-transparent border for maximum elegance.",
          "Soft lavender (#DCE4F7) background with floating blurred organic shapes creates a modern premium depth.",
          "Micro-animations should use spring curves (cubic-bezier) to feel responsive and alive."
        ],
        resources: [
          { name: "Liquid Glass UI Kit.fig", size: "24 MB" },
          { name: "CSS Backdrop Blur Cheat Sheet.pdf", size: "1.8 MB" }
        ],
        info: "Learn how to build premium, state-of-the-art user interfaces with glassmorphic elements, soft pastel gradients, and dynamic micro-animations. Taught by Sarah Jenkins."
      },
      'antigravity': {
        title: "Mastering Google Antigravity: From Setup to Deployment",
        modules: [
          {
            name: "Module 1: Introduction",
            description: "Understand the core fundamentals and setup guidelines.",
            items: [
              { id: "ag1", name: "Course Requirements", type: "video", duration: "58 sec", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
              { id: "ag2", name: "Install & Setup Google Antigravity", type: "video", duration: "3 min 12 sec", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
              { id: "ag3", name: "Core Principles of Anti-Mass", type: "video", duration: "5 min 45 sec", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" },
              { id: "ag4", name: "Building Your First Float Container", type: "video", duration: "8 min 20 sec", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4" }
            ]
          },
          {
            name: "module 1",
            items: [],
            locked: true
          },
          {
            name: "module 2",
            items: [],
            locked: true
          }
        ],
        notes: [
          "Antigravity is a powerful tool to build and run local sandboxed instances.",
          "Ensure your Cwd is within the user's workspace before executing shell commands.",
          "Always verify API endpoints using test scripts on localhost:8080."
        ],
        resources: [
          { name: "Antigravity Documentation.pdf", size: "4.5 MB" },
          { name: "Workspace Setup Guide.txt", size: "12 KB" }
        ],
        info: "Master Google Antigravity from scratch. Learn installation, environment configuration, command execution, and deployment pipeline workflows."
      }
    };

    // Determine current course dynamically
    let currentCourse = {
      title: "Loading...",
      lectures: [{ id: "loading", title: "Loading Lectures...", duration: "", videoUrl: "" }],
      notes: [],
      resources: [],
      info: "Loading..."
    };
    let lectures = currentCourse.lectures;
    let currentLectureId = lectures[0].id;
    let activeTab = 'dashboard';

    function loadCourseData() {
      let selected = null;
      try {
        selected = JSON.parse(localStorage.getItem('selectedCourse')) || (parent && parent.localStorage && JSON.parse(parent.localStorage.getItem('selectedCourse')));
      } catch (e) {}
      
      const courseId = selected ? selected.id : 'ux-research';
      const apiBase = 'http://localhost:8080';
      
      console.log("loadCourseData [Mobile] - selectedCourse:", selected);
      console.log("loadCourseData [Mobile] - courseId:", courseId);
      console.log("loadCourseData [Mobile] - apiBase:", apiBase);

      const sendDebug = (msg, data = {}) => {
        fetch('http://localhost:8080/api/debug-log', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ msg, courseId, data })
        }).catch(() => {});
      };

      sendDebug("Loading course player dynamic data", { selected });

      fetch(apiBase + '/api/courses')
        .then(res => {
          sendDebug("Courses fetch response status received", { status: res.status });
          return res.json();
        })
        .then(courses => {
          sendDebug("Courses fetched successfully", { coursesCount: courses.length, coursesList: courses.map(c => ({ id: c.id, title: c.title })) });
          const match = courses.find(c => String(c.id) === String(courseId) || String(c.title).toLowerCase() === String(courseId).toLowerCase());
          sendDebug("Course match result", { found: !!match, matchId: match ? match.id : null, matchTitle: match ? match.title : null });
          if (match) {
            currentCourse = {
              title: match.title,
              info: match.description || `Comprehensive training course on ${match.title}. Explore advanced methodologies, practical exercises, and industry best practices.`,
              modules: match.modules || [],
              lectures: [],
              notes: [],
              resources: []
            };
            
            // Map modules and items
            const fallbackVideos = [
              "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
              "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4",
              "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4",
              "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerEscapes.mp4",
              "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerFun.mp4"
            ];
            
            let videoIdx = 0;
             const modules = match.modules || [];
             modules.forEach(mod => {
               const items = mod.items || [];
               items.forEach(item => {
                 let itemUrl = item.url || '';
                 if (itemUrl && !itemUrl.startsWith('http') && !itemUrl.startsWith('/') && !itemUrl.startsWith('blob:')) {
                   itemUrl = '/website/uploads/' + itemUrl;
                 }
                 
                 // Dynamic fallbacks
                 if (!itemUrl || itemUrl.endsWith('Intro_Video.mp4') || itemUrl.endsWith('Design Systems.mp4') || itemUrl.endsWith('Figma Basics.mp4') || itemUrl.startsWith('blob:')) {
                   if (item.type === 'image') {
                     itemUrl = itemUrl.startsWith('blob:') ? 'https://images.unsplash.com/photo-1531403009284-440f080d1e12?q=80&w=800' : itemUrl;
                   } else if (item.type === 'document' || item.type === 'pdf') {
                     itemUrl = itemUrl.startsWith('blob:') ? '#' : itemUrl;
                   } else {
                     itemUrl = fallbackVideos[videoIdx % fallbackVideos.length];
                     videoIdx++;
                   }
                 }

                 currentCourse.lectures.push({
                   id: item.id || `dyn-item-${Math.random()}`,
                   title: item.name,
                   type: item.type || 'video',
                   duration: item.duration || item.sizeLabel || "5 min",
                   videoUrl: itemUrl,
                   size: item.sizeLabel || "1.2 MB",
                   desc: item.desc || ''
                 });

                 // Keep resources list updated for resources tab compatibility
                 if (item.type !== 'video') {
                   currentCourse.resources.push({
                     name: item.name,
                     size: item.sizeLabel || "1.2 MB",
                     url: itemUrl
                   });
                 }
                
                if (item.desc) {
                  currentCourse.notes.push(item.desc);
                }
              });
            });
            
            if (currentCourse.lectures.length === 0) {
              currentCourse.lectures.push({
                id: "default-vid",
                title: "Introduction & Getting Started",
                duration: "4 min",
                videoUrl: fallbackVideos[0]
              });
            }
            if (currentCourse.notes.length === 0) {
              currentCourse.notes = [
                "Review the syllabus and program materials before starting.",
                "Practice assignments and run files locally to understand the code.",
                "Post in the discussion forums if you encounter any setup issues."
              ];
            }
            if (currentCourse.resources.length === 0) {
              currentCourse.resources = [
                { name: "Course Syllabus.pdf", size: "1.2 MB", url: "#" }
              ];
            }
            
            document.getElementById("currentCourseTitle").textContent = currentCourse.title;
            lectures = currentCourse.lectures;
            currentLectureId = lectures[0] ? lectures[0].id : null;
            
            if (currentLectureId) {
              selectLecture(currentLectureId);
            } else {
              renderContent();
            }
          } else {
            sendDebug("Course match failed - not found in API list", { available: courses.map(c => ({ id: c.id, title: c.title })) });
            const errorMsg = document.createElement('div');
            errorMsg.className = 'p-4 bg-yellow-100 text-yellow-800 text-xs rounded-2xl mb-4 font-mono text-left border border-yellow-300';
            errorMsg.innerHTML = `<strong>Diagnostic Warning:</strong> Course not found in API.<br/>courseId: "${courseId}"<br/>Available courses: [${courses.map(c => `'${c.id}' ('${c.title}')`).join(', ')}]`;
            const container = document.getElementById("lectureList");
            if (container) container.prepend(errorMsg);
            useFallbackCourse();
          }
        })
        .catch(err => {
          console.error("Error loading course:", err);
          sendDebug("Courses load caught JS error", { error: err.message, stack: err.stack });
          const errorMsg = document.createElement('div');
          errorMsg.className = 'p-4 bg-red-100 text-red-800 text-xs rounded-2xl mb-4 font-mono text-left border border-red-300';
          errorMsg.innerHTML = `<strong>Diagnostic Error:</strong> ${err.message}<br/>Stack: ${err.stack}`;
          const container = document.getElementById("lectureList");
          if (container) container.prepend(errorMsg);
          useFallbackCourse();
        });
    }

    function useFallbackCourse() {
      let selected = null;
      try {
        selected = JSON.parse(localStorage.getItem('selectedCourse'));
      } catch (e) {}
      
      let fallback = courseData.antigravity;
      if (selected) {
        const titleLower = selected.title.toLowerCase();
        if (titleLower.includes('ux') || titleLower.includes('design') || titleLower.includes('pattern')) {
          fallback = courseData.ux;
        } else {
          fallback = {
            title: selected.title,
            modules: [
              {
                name: "Module 1: Introduction",
                description: "Understand the core fundamentals and setup guidelines.",
                items: [
                  { id: "dyn1", name: "Introduction to " + selected.title, type: "video", duration: "4 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4" },
                  { id: "dyn2", name: "Core Concepts & Fundamentals", type: "video", duration: "10 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ElephantsDream.mp4" },
                  { id: "dyn3", name: "Practical Implementation", type: "video", duration: "15 min", url: "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" }
                ]
              },
              {
                name: "module 1",
                items: [],
                locked: true
              },
              {
                name: "module 2",
                items: [],
                locked: true
              }
            ],
            notes: [
              "Review the course syllabus for prerequisite materials.",
              "Complete all module assessments on time to maintain status."
            ],
            resources: [
              { name: "Course Syllabus.pdf", size: "1.2 MB", url: "#" }
            ],
            info: "Comprehensive training course on " + selected.title + ". Explore advanced methodologies, practical exercises, and industry best practices."
          };
        }
      }
      
      // Flatten fallback modules items into lectures array
      fallback.lectures = [];
      if (fallback.modules) {
        fallback.modules.forEach(mod => {
          if (mod.items) {
            mod.items.forEach(item => {
              fallback.lectures.push({
                id: item.id || `dyn-item-${Math.random()}`,
                title: item.name,
                type: item.type || 'video',
                duration: item.duration || "5 min",
                videoUrl: item.url,
                size: item.sizeLabel || "1.2 MB",
                desc: item.desc || ''
              });
            });
          }
        });
      }
      
      currentCourse = fallback;

    function selectLecture(id) {
      currentLectureId = id;
      const lecture = lectures.find(l => String(l.id) === String(id));
      if (lecture) {
        const video = document.getElementById("courseVideo");
        const imgViewer = document.getElementById("imageViewer");
        const docViewer = document.getElementById("documentViewer");

        // Save active document state
        window.activeDocUrl = lecture.videoUrl;
        window.activeDocName = lecture.title;

        // Reset document sub-views inside documentViewer
        const docMetaView = document.getElementById("docMetaView");
        const docxContentView = document.getElementById("docxContentView");
        if (docMetaView) docMetaView.classList.remove("hidden");
        if (docxContentView) docxContentView.classList.add("hidden");

        if (lecture.type === 'video') {
          if (video) {
            video.classList.remove("hidden");
            video.src = lecture.videoUrl;
            const playPromise = video.play();
            if (playPromise !== undefined) {
              playPromise.catch(error => console.log("Play failed:", error));
            }
          }
          if (imgViewer) imgViewer.classList.add("hidden");
          if (docViewer) docViewer.classList.add("hidden");
          const playIcon = document.getElementById('playIcon');
          if (playIcon) playIcon.textContent = 'pause';

          const isDownloaded = localStorage.getItem('offline_downloaded_' + id) === 'true';
          if (isDownloaded && parent && parent.App && typeof parent.App.showToast === 'function') {
            parent.App.showToast("Playing downloaded offline video.", "success");
          }
        } 
        else if (lecture.type === 'image') {
          if (video) {
            video.classList.add("hidden");
            video.pause();
          }
          if (imgViewer) {
            imgViewer.classList.remove("hidden");
            imgViewer.querySelector("img").src = lecture.videoUrl;

          if (isDownloaded && parent && parent.App && typeof parent.App.showToast === 'function') {

    window.handleDownload = function(event, id, name) {
      if (event) {
        event.stopPropagation();
        event.preventDefault();
      }
      window.startDownload(name, id);
    };

    window.startDownload = function(name, id) {
      let fileUrl = '';
      const lecture = lectures.find(l => String(l.id) === String(id));
      if (lecture) {
        fileUrl = lecture.videoUrl;
      } else if (currentCourse && currentCourse.resources) {
        const res = currentCourse.resources.find(r => r.name.replace(/\s+/g, '_') === id);
        if (res) {
          fileUrl = res.url;
        }
      }

      if (!fileUrl) {
        fileUrl = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
      }

      const modal = document.getElementById('downloadProgressModal');
      const fileNameEl = document.getElementById('downloadFileName');
      const bar = document.getElementById('downloadProgressBar');
      const pctEl = document.getElementById('downloadPercentage');
      if (!modal || !fileNameEl || !bar || !pctEl) return;

      fileNameEl.textContent = name;
      bar.style.width = '0%';
      pctEl.textContent = '0%';
      modal.classList.remove('hidden');

      let progress = 0;
      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 15) + 5;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          bar.style.width = '100%';
          pctEl.textContent = '100%';
          
          setTimeout(() => {
            modal.classList.add('hidden');
            localStorage.setItem('offline_downloaded_' + id, 'true');
            
            try {
              const a = document.createElement('a');
              a.href = fileUrl;
              a.download = name;
              a.target = '_blank';
              document.body.appendChild(a);
              a.click();
              document.body.removeChild(a);
            } catch(err) {
              console.warn("Browser trigger download failed:", err);
            }

            if (parent && parent.App && typeof parent.App.showToast === 'function') {
              parent.App.showToast(`${name} saved offline!`, "success");
            } else {
              alert(`${name} saved offline successfully!`);
            }
            renderContent();
          }, 400);
        } else {
          bar.style.width = progress + '%';
          pctEl.textContent = progress + '%';
        }
      }, 150);
    };

        fetch(apiBase + `/api/parse-docx?url=${encodeURIComponent(window.activeDocUrl)}`)
          .then(res => res.json())
          .then(data => {
            if (data.success) {
              docxParsedHtml.innerHTML = data.html || '<p class="text-xs text-gray-500 italic text-center py-4">Document is empty.</p>';
            } else {
              docxParsedHtml.innerHTML = `<p class="text-xs text-red-500 italic text-center py-4">Could not parse document: ${data.error}</p>`;

          .catch(err => {
            console.error(err);
            docxParsedHtml.innerHTML = '<p class="text-xs text-red-500 italic text-center py-4">Failed to load document content.</p>';
          });
      } else {
        if (parent && parent.App && typeof parent.App.showToast === 'function') {
          parent.App.showToast("Detailed preview for this file format is not supported.", "info");

      const video = document.getElementById("courseVideo");
      if (video) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log("Play failed:", error);
          });
        }
      }
    };

    window.postForumQuestion = function() {
      const titleInput = document.getElementById('forum-input-title');
      const bodyInput = document.getElementById('forum-input-body');
      if (!titleInput || !bodyInput) return;

      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();

      if (!title || !body) {
        alert("Please enter both a title and details for your question.");
        return;
      }

      if (!window.forumThreads) window.forumThreads = [];

      window.forumThreads.unshift({
        id: Date.now(),
        title: title,
        author: "You (Student)",
        date: "Just now",
        replies: 0,
        votes: 1,
        content: body
      });

      titleInput.value = '';
      bodyInput.value = '';
      
      if (parent && parent.App && typeof parent.App.showToast === 'function') {
        parent.App.showToast("Question posted to forum!", "success");
      } else {
        alert("Question posted to forum successfully!");
      }

      renderContent();
    };

    // Custom Video controls handlers
    window.togglePlayPause = function(event) {
      if (event) event.stopPropagation();
      const video = document.getElementById('courseVideo');
      const playIcon = document.getElementById('playIcon');
      if (!video || !playIcon) return;
      if (video.paused) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(error => {
            console.log("Play failed:", error);
          });
        }
        playIcon.textContent = 'pause';
      } else {
        video.pause();
        playIcon.textContent = 'play_arrow';
      }
    };

    window.skipVideo = function(event, secs) {
      if (event) event.stopPropagation();
      const video = document.getElementById('courseVideo');
      if (!video) return;
      video.currentTime = Math.max(0, Math.min(video.duration || 0, video.currentTime + secs));
    };

    const speeds = [1, 1.25, 1.5, 2];
    let currentSpeedIdx = 0;
    window.cycleSpeed = function(event) {
      if (event) event.stopPropagation();
      const video = document.getElementById('courseVideo');
      const btn = document.getElementById('speedBtn');
      if (!video || !btn) return;
      currentSpeedIdx = (currentSpeedIdx + 1) % speeds.length;
      const speed = speeds[currentSpeedIdx];
      video.playbackRate = speed;
      btn.textContent = speed + 'x';
    };

    window.toggleMute = function(event) {
      if (event) event.stopPropagation();
      const video = document.getElementById('courseVideo');
      const volIcon = document.getElementById('volumeIcon');
      if (!video || !volIcon) return;
      video.muted = !video.muted;
      volIcon.textContent = video.muted ? 'volume_off' : 'volume_up';
    };

    window.toggleAspect = function(event) {
      if (event) event.stopPropagation();
      const video = document.getElementById('courseVideo');
      const icon = document.getElementById('aspectIcon');
      if (!video || !icon) return;
      if (video.classList.contains('object-cover')) {
        video.classList.remove('object-cover');
        video.classList.add('object-contain');
        icon.textContent = 'aspect_ratio';
      } else {
        video.classList.remove('object-contain');
        video.classList.add('object-cover');
        icon.textContent = 'open_in_full';
      }
    };

    window.toggleFullscreen = function(event) {
      if (event) event.stopPropagation();
      const video = document.getElementById('courseVideo');
      if (!video) return;
      if (video.requestFullscreen) {
        video.requestFullscreen();
      } else if (video.webkitRequestFullscreen) {
        video.webkitRequestFullscreen();
      } else if (video.msRequestFullscreen) {
        video.msRequestFullscreen();
      }
    };

    window.seekVideo = function(event) {
      if (event) event.stopPropagation();
      const timeline = document.getElementById('videoTimeline');
      const video = document.getElementById('courseVideo');
      if (!timeline || !video || !video.duration) return;
      const rect = timeline.getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const percentage = clickX / width;
      video.currentTime = percentage * video.duration;
    };

    function formatTime(seconds) {
      const min = Math.floor(seconds / 60);
      const sec = Math.floor(seconds % 60);
      return `${min}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Attach Video Event Listeners
    document.addEventListener('DOMContentLoaded', () => {
      const video = document.getElementById('courseVideo');
      const progress = document.getElementById('videoProgress');
      const currentTimeLbl = document.getElementById('currentTime');
      const durationTimeLbl = document.getElementById('durationTime');
      const controls = document.getElementById('videoCustomControls');

      if (video) {
        // Toggle controls on touch/click
        video.addEventListener('click', (e) => {
          e.stopPropagation();
          if (controls) {
            const isHidden = window.getComputedStyle(controls).opacity === '0';
            controls.style.opacity = isHidden ? '1' : '0';
            controls.style.pointerEvents = isHidden ? 'auto' : 'none';
          }
        });

        // Prevent controls auto-hide when clicking controls directly
        if (controls) {
          controls.addEventListener('click', (e) => {
            e.stopPropagation();
          });
        }

        video.addEventListener('timeupdate', () => {
          if (video.duration) {
            const pct = (video.currentTime / video.duration) * 100;
            if (progress) progress.style.width = pct + '%';
            
            if (currentTimeLbl) currentTimeLbl.textContent = formatTime(video.currentTime);
            if (durationTimeLbl) durationTimeLbl.textContent = formatTime(video.duration);
          }
        });

        video.addEventListener('loadedmetadata', () => {
          if (durationTimeLbl && video.duration) {
            durationTimeLbl.textContent = formatTime(video.duration);
          }
        });
        
        video.addEventListener('play', () => {
          const playIcon = document.getElementById('playIcon');
          if (playIcon) playIcon.textContent = 'pause';
        });

        video.addEventListener('pause', () => {
          const playIcon = document.getElementById('playIcon');
          if (playIcon) playIcon.textContent = 'play_arrow';
        });

        video.addEventListener('ended', () => {
          const playIcon = document.getElementById('playIcon');
          if (playIcon) playIcon.textContent = 'play_arrow';
        });
      }

      // Hook up AI accordion toggle
      const aiAccordionHeader = document.getElementById('aiAccordionHeader');
      const aiAccordionContent = document.getElementById('aiAccordionContent');
      const aiAccordionIcon = document.getElementById('aiAccordionIcon');
      if (aiAccordionHeader && aiAccordionContent) {
        aiAccordionHeader.addEventListener('click', () => {
          const isHidden = aiAccordionContent.classList.contains('hidden');
          aiAccordionContent.classList.toggle('hidden', !isHidden);
          if (aiAccordionIcon) {
            aiAccordionIcon.textContent = isHidden ? 'expand_less' : 'expand_more';
          }
        });
      }
    });

    // Initial Render - Dynamic
    loadCourseData();
</script>
