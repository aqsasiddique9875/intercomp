<style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-width 0.35s cubic-bezier(0.25, 1, 0.5, 1),
                        box-shadow 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-card:active {
            transform: scale(1.03);
            border-width: 1.5px;
            box-shadow: 0 20px 60px 0 rgba(71, 26, 112, 0.25), 0 0 15px 2px rgba(163, 76, 190, 0.3);
        }

        .gradient-mesh-candidate {
            background-image: radial-gradient(at 0% 0%, hsla(282, 48%, 52%, 0.15) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, hsla(282, 48%, 52%, 0.15) 0px, transparent 50%);
        }

        .gradient-mesh-recruiter {
            background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 50%, 0.1) 0px, transparent 50%),
                              radial-gradient(at 100% 100%, hsla(210, 100%, 50%, 0.1) 0px, transparent 50%);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Custom glow for candidate card icon area */
        .glow-purple {
            filter: drop-shadow(0 0 8px rgba(163, 76, 190, 0.4));
        }

        /* Custom glow for recruiter card icon area */
        .glow-blue {
            filter: drop-shadow(0 0 8px rgba(0, 96, 171, 0.4));
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .float-anim {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
