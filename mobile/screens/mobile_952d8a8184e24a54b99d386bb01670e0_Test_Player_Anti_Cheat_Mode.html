<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        :root {
            --glass-blur: blur(28px);
            --apple-spring: cubic-bezier(0.35, 0, 0.15, 1);
        }
        body {
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overflow: hidden; /* Lock scroll for focused test environment */
        }
        .glass-card {
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
        }
        .pulse-red {
            animation: pulse-red 2s infinite;
        }
        @keyframes pulse-red {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(255, 69, 58, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(255, 69, 58, 0); }
        }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 3s infinite linear;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                "on-tertiary-fixed": "#002106",
                "gold": "#FFD60A",
                "on-primary-fixed-variant": "#72188f",
                "glass-border": "rgba(255, 255, 255, 0.6)",
                "on-secondary-container": "#003868",
                "background": "#DCE4F7", /* Explicit Lavender Blue as per prompt */
                "on-tertiary-fixed-variant": "#00531a",
                "tertiary-fixed": "#6cff82",
                "surface-container-high": "#e0e8fb",
                "on-primary": "#ffffff",
                "on-background": "#471A70", /* Prompt deep purple */
                "surface-bright": "#f9f9ff",
                "secondary-fixed": "#d3e3ff",
                "on-surface-variant": "#4f4350",
                "surface-container-lowest": "#ffffff",
                "on-error-container": "#93000a",
                "error-container": "#ffdad6",
                "on-secondary-fixed-variant": "#004883",
                "surface": "#f9f9ff",
                "surface-tint": "#8d37a9",
                "tertiary-container": "#00842f",
                "on-primary-fixed": "#330044",
                "surface-variant": "#dbe3f6",
                "on-surface": "#471A70",
                "glass-thick": "rgba(255, 255, 255, 0.8)",
                "orange": "#FF9F0A",
                "primary-fixed": "#fbd7ff",
                "glass-fill": "rgba(255, 255, 255, 0.35)",
                "on-primary-container": "#fff5fb",
                "on-secondary": "#ffffff",
                "inverse-on-surface": "#ecf1ff",
                "error": "#FF453A",
                "surface-container-low": "#f0f3ff",
                "on-tertiary": "#ffffff",
                "surface-container-highest": "#dbe3f6",
                "outline-variant": "#d2c1d2",
                "tertiary-fixed-dim": "#47e266",
                "tertiary": "#006823",
                "primary": "#8731a3",
                "inverse-primary": "#f0b0ff",
                "secondary-container": "#54a3ff",
                "primary-container": "#a34cbe",
                "secondary-fixed-dim": "#a3c9ff",
                "inverse-surface": "#29313f",
                "outline": "#817381",
                "surface-container": "#e7eeff",
                "on-tertiary-container": "#e6ffe0",
                "primary-fixed-dim": "#f0b0ff",
                "on-secondary-fixed": "#001c39",
                "secondary": "#0060ab",
                "card-gradient": "linear-gradient(135deg, #4D9EFA 0%, #BF7DF5 100%)",
                "on-error": "#ffffff",
                "surface-dim": "#d2daed"
              },
              "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "16px",
                "full": "9999px"
              },
              "spacing": {
                "mobile-gutter": "16px",
                "desktop-margin": "64px",
                "safe-top": "44px",
                "safe-bottom": "34px",
                "max-width": "1280px",
                "desktop-gutter": "24px",
                "base": "8px",
                "mobile-margin": "20px"
              },
              "fontFamily": {
                "label-caps": ["Inter"],
                "display-xl-mobile": ["Inter"],
                "label-caps-mobile": ["Inter"],
                "headline-lg-mobile": ["Inter"],
                "body-md-mobile": ["Inter"]
              },
              "fontSize": {
                "label-caps": ["13px", {"lineHeight": "1.0", "letterSpacing": "0.03em", "fontWeight": "600"}],
                "display-xl-mobile": ["34px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                "label-caps-mobile": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600"}],
                "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                "body-md-mobile": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}]
              }
            },
          },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen text-on-surface">
<!-- Top Bar Component -->
<header class="fixed top-0 w-full z-50 bg-glass-fill backdrop-blur-2xl border-b border-glass-border shadow-[0_12px_40px_0_rgba(71,26,112,0.15)] flex flex-col pt-safe-top">

<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full overflow-hidden border border-glass-border">

</div>
<span class="font-label-caps-mobile text-label-caps-mobile opacity-70">Student Profile</span>
</div>
<div class="flex flex-col items-center">
<span class="font-headline-lg-mobile text-[20px] font-bold text-primary tracking-tighter" id="timer">34:12</span>
<span class="text-[10px] font-bold uppercase tracking-widest opacity-50">Remaining</span>
</div>
<div class="flex items-center justify-center bg-error/10 px-3 py-1.5 rounded-full border border-error/20 gap-2">
<span class="w-2 h-2 rounded-full bg-error pulse-red"></span>
<span class="font-label-caps-mobile text-[10px] text-error font-bold tracking-tight">ANTI-CHEAT ACTIVE</span>
</div>
</div>
<!-- Linear Progress Bar -->
<div class="px-mobile-margin pb-3">
<div class="w-full h-1.5 bg-on-surface/5 rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-700 ease-out" style="width: 13.33%;"></div>
</div>
<div class="flex justify-between mt-1 px-1">
<span class="font-label-caps-mobile text-[10px] opacity-60">Question 4 of 30</span>
<span class="font-label-caps-mobile text-[10px] opacity-60">13% Complete</span>
</div>
</div>
</header>
<!-- Main Content Area -->
<main class="relative pt-[160px] pb-safe-bottom px-mobile-margin h-screen overflow-y-auto">
<!-- Webcam Preview -->
<div class="fixed top-[160px] right-mobile-margin z-40">
<div class="w-24 h-32 glass-card bg-glass-thick rounded-xl border border-glass-border overflow-hidden shadow-xl active:scale-95 transition-transform duration-350 ease-[cubic-bezier(0.35,0,0.15,1)]">
<div class="absolute top-2 left-2 flex items-center gap-1 bg-black/40 backdrop-blur-md px-2 py-0.5 rounded-full">
<span class="w-1.5 h-1.5 rounded-full bg-error pulse-red"></span>
<span class="text-[8px] text-white font-bold tracking-widest uppercase">Live</span>
</div>
<img class="w-full h-full object-cover" data-alt="A grainy, slightly desaturated webcam view of a young woman looking intently at her computer screen. The lighting is natural, coming from the laptop screen, casting a soft glow on her face. The surrounding environment is blurred, suggesting a home office or quiet study space, maintaining the premium glassmorphic aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBy4bp-JXP52ggqmy1SeQY6PAELJ1q8xt__PKYbFw4Xm1-6EQrtajPUVYiqgbqH_zt4Kuf-Yy5g2JBxXHycD_ardbzoKnhalGRjxkNG62fvpYdVTqZeQNypcGjtU3iw4KetgHZviKd8AlS_yLVVlmx5WKSF5toprZTOO1kjWbkF8A5NVLlCFg3br2wdv6Nn4pnun0RWJd2V9_-24kYvkP2F_FKacLewD-FR00hKvCHiyGCy7M3sX3ZlT1to_CnDZzPlMVPIcFvNU1o8"/>
</div>
</div>
<div class="max-w-md mx-auto space-y-6">
<!-- Question Card -->
<div class="glass-card bg-glass-fill rounded-[32px] border border-glass-border p-8 shadow-[0_12px_40px_0_rgba(71,26,112,0.1)]">
<span class="font-label-caps-mobile text-primary/60 mb-4 block">MULTIPLE CHOICE</span>
<h1 class="font-headline-lg-mobile text-on-background leading-snug">
                    What is the primary function of a heuristic evaluation in UX design?
                </h1>
</div>
<!-- Options List -->
<div class="space-y-4">
<!-- Option 1 -->
<button class="w-full glass-card bg-glass-fill border border-glass-border rounded-2xl p-5 flex items-center gap-4 text-left hover:bg-glass-thick active:scale-[0.98] transition-all duration-350 ease-[var(--apple-spring)] group">
<div class="w-6 h-6 rounded-full border-2 border-primary/30 flex items-center justify-center group-hover:border-primary transition-colors">
<div class="w-3 h-3 rounded-full bg-primary scale-0 group-active:scale-100 transition-transform"></div>
</div>
<span class="font-body-md-mobile text-on-surface">To conduct quantitative A/B testing on live prototypes</span>
</button>
<!-- Option 2 (Selected State) -->
<button class="w-full glass-card bg-glass-thick border-2 border-primary rounded-2xl p-5 flex items-center gap-4 text-left shadow-[0_0_20px_rgba(135,49,163,0.15)] active:scale-[0.98] transition-all duration-350 ease-[var(--apple-spring)]">
<div class="w-6 h-6 rounded-full border-2 border-primary flex items-center justify-center">
<div class="w-3 h-3 rounded-full bg-primary"></div>
</div>
<span class="font-body-md-mobile text-on-surface font-semibold">To identify usability problems by comparing the UI to established principles</span>
</button>
<!-- Option 3 -->
<button class="w-full glass-card bg-glass-fill border border-glass-border rounded-2xl p-5 flex items-center gap-4 text-left hover:bg-glass-thick active:scale-[0.98] transition-all duration-350 ease-[var(--apple-spring)] group">
<div class="w-6 h-6 rounded-full border-2 border-primary/30 flex items-center justify-center group-hover:border-primary transition-colors">
<div class="w-3 h-3 rounded-full bg-primary scale-0 transition-transform"></div>
</div>
<span class="font-body-md-mobile text-on-surface">To record eye-tracking data from real users during a session</span>
</button>
<!-- Option 4 -->
<button class="w-full glass-card bg-glass-fill border border-glass-border rounded-2xl p-5 flex items-center gap-4 text-left hover:bg-glass-thick active:scale-[0.98] transition-all duration-350 ease-[var(--apple-spring)] group">
<div class="w-6 h-6 rounded-full border-2 border-primary/30 flex items-center justify-center group-hover:border-primary transition-colors">
<div class="w-3 h-3 rounded-full bg-primary scale-0 transition-transform"></div>
</div>
<span class="font-body-md-mobile text-on-surface">To generate automated CSS and HTML code from design mockups</span>
</button>
</div>
</div>
</main>
<!-- Bottom Navigation Component (Action Bar) -->
<footer class="fixed bottom-0 w-full z-50 bg-glass-thick backdrop-blur-2xl border-t border-glass-border rounded-t-[32px] shadow-[0_-8px_30px_0_rgba(71,26,112,0.1)]">
<div class="flex justify-between items-center pt-4 pb-safe-bottom px-mobile-margin gap-4 h-24">
<button class="flex-1 glass-card bg-glass-fill border border-glass-border h-14 rounded-2xl flex items-center justify-center gap-2 text-on-surface-variant font-label-caps-mobile active:scale-95 transition-all">
<span class="material-symbols-outlined">chevron_left</span>
                Previous
            </button>
<button class="flex-[2] bg-primary text-on-primary h-14 rounded-2xl flex items-center justify-center gap-2 font-headline-lg-mobile text-[16px] shadow-lg active:scale-95 transition-all relative overflow-hidden group">
<div class="absolute inset-0 shimmer opacity-20 pointer-events-none"></div>
                Save &amp; Next
                <span class="material-symbols-outlined">chevron_right</span>
</button>
</div>
</footer>
<!-- Background Elements -->
<div class="fixed inset-0 -z-10 bg-[#DCE4F7]">
<div class="absolute top-[-10%] left-[-20%] w-[80%] h-[60%] rounded-full bg-primary/10 blur-[120px]"></div>
<div class="absolute bottom-[-10%] right-[-20%] w-[80%] h-[60%] rounded-full bg-secondary-container/20 blur-[120px]"></div>
</div>
<script>
        // Simple Countdown Timer Logic
        let time = 34 * 60 + 12;
        const timerElement = document.getElementById('timer');

        function updateTimer() {
            const minutes = Math.floor(time / 60);
            const seconds = time % 60;
            timerElement.textContent = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
            if (time > 0) time--;
        }

        setInterval(updateTimer, 1000);

        // Haptic-like interaction for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('touchstart', () => {
                if ('vibrate' in navigator) {
                    navigator.vibrate(5);
                }
            });
        });
    </script>
</body></html>
