<style>
        body {
            background-color: #DCE4F7;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.1);
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        .glass-input.active {
            border-color: #54a3ff;
            box-shadow: 0 0 15px rgba(84, 163, 255, 0.4);
            animation: pulse-blue 2s infinite;
        }

        @keyframes pulse-blue {
            0% { box-shadow: 0 0 0 0 rgba(84, 163, 255, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(84, 163, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(84, 163, 255, 0); }
        }

        .keypad-btn:active {
            transform: scale(0.92);
            background: rgba(255, 255, 255, 0.6);
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(120deg, #DCE4F7 0%, #E7EEFF 50%, #F5F7FF 100%);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="flex flex-col h-screen max-h-screen">
<div class="liquid-bg"></div>
<!-- Top App Bar (Shared Component Logic) -->
<header class="flex items-center px-mobile-margin h-14 w-full top-0 z-10">
<button class="hover:opacity-80 transition-opacity active:scale-95 duration-200 ease-out">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</button>
<h1 class="ml-4 font-headline-lg-mobile text-headline-lg-mobile font-bold text-on-background">Security Check</h1>
</header>
<main class="flex-1 overflow-y-auto px-mobile-margin flex flex-col items-center pt-8 pb-32">
<!-- 3D Glassmorphic Icon Placeholder -->
<div class="relative w-32 h-32 mb-8 flex items-center justify-center">
<div class="absolute inset-0 bg-primary/10 blur-3xl rounded-full"></div>
<div class="glass-card w-24 h-24 rounded-2xl flex items-center justify-center transform rotate-12 transition-transform hover:rotate-0 duration-500">
<span class="material-symbols-outlined text-6xl text-primary" style="font-variation-settings: 'FILL' 1;">shield_with_heart</span>
</div>
<!-- Decorative "Liquid" Glass bubbles -->
<div class="absolute -top-2 -right-2 w-8 h-8 rounded-full glass-card opacity-60"></div>
<div class="absolute -bottom-4 -left-2 w-12 h-12 rounded-full glass-card opacity-40"></div>
</div>
<!-- Content -->
<div class="text-center mb-10 w-full">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile font-extrabold text-on-background mb-2">Verify Your Identity</h2>
<p class="font-body-md-mobile text-body-md-mobile text-on-surface-variant px-4">Enter the 6-digit code sent to your email.</p>
</div>
<!-- Code Inputs -->
<div class="grid grid-cols-6 gap-2 w-full max-w-sm mb-12" id="otp-container">
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background active" data-index="0"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="1"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="2"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="3"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="4"></div>
<div class="h-16 glass-input rounded-xl flex items-center justify-center text-2xl font-bold text-on-background" data-index="5"></div>
</div>
<!-- Links -->
<div class="flex flex-col items-center gap-4">
<button class="font-label-caps-mobile text-label-caps-mobile text-primary font-bold hover:opacity-70 transition-opacity">RESEND CODE</button>
<button class="font-label-caps-mobile text-label-caps-mobile text-outline font-medium hover:opacity-70 transition-opacity">TRY ANOTHER METHOD</button>
</div>
</main>
<!-- Glass Numeric Keypad -->
<div class="fixed bottom-0 left-0 w-full z-20 px-4 pb-safe-bottom">
<div class="glass-card rounded-t-3xl p-6 grid grid-cols-3 gap-4 border-b-0">
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('1')">1</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('2')">2</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('3')">3</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('4')">4</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('5')">5</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('6')">6</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('7')">7</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('8')">8</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('9')">9</button>
<div class="h-14"></div>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-2xl font-bold text-on-background transition-all" onclick="handleKey('0')">0</button>
<button class="keypad-btn h-14 rounded-xl flex items-center justify-center text-on-background transition-all" onclick="handleKey('back')">
<span class="material-symbols-outlined text-3xl">backspace</span>
</button>
</div>
</div>
<script>
        let currentCode = "";
        const maxLen = 6;
        const inputs = document.querySelectorAll('.glass-input');

        function handleKey(key) {
            if (key === 'back') {
                if (currentCode.length > 0) {
                    currentCode = currentCode.slice(0, -1);
                }
            } else if (currentCode.length < maxLen) {
                currentCode += key;
            }

            updateDisplay();

            if (currentCode.length === maxLen) {
                // Simulate success
                setTimeout(() => {
                    inputs.forEach(input => {
                        input.classList.remove('active');
                        input.classList.add('border-tertiary', 'text-tertiary');
                    });
                }, 100);
            }
        }

        function updateDisplay() {
            inputs.forEach((input, index) => {
                input.textContent = currentCode[index] || "";
                input.classList.remove('active');
                if (index === currentCode.length || (index === maxLen - 1 && currentCode.length === maxLen)) {
                    input.classList.add('active');
                }
            });
        }

        // Simple tactile feedback simulation
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => {
                if (window.navigator.vibrate) window.navigator.vibrate(10);
            });
        });
    </script>
</body></html>
