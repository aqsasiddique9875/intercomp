<style>
        body {
            background-color: #DCE4F7;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .ambient-orb {
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(135, 49, 163, 0.45) 0%, rgba(135, 49, 163, 0) 70%);
            filter: blur(40px);
            z-index: 0;
            pointer-events: none;
            animation: pulse-orb 8s infinite alternate ease-in-out;
        }

        @keyframes pulse-orb {
            0% { transform: scale(1) translate(-10%, -10%); opacity: 0.6; }
            100% { transform: scale(1.3) translate(5%, 5%); opacity: 0.9; }
        }

        .glass-card {
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }

        .input-focus-ring:focus-within {
            box-shadow: 0 0 0 2px rgba(135, 49, 163, 0.2);
            border-color: rgba(135, 49, 163, 0.5);
        }

        .ios-spring-active:active {
            transform: scale(0.96);
            transition: transform 0.35s cubic-bezier(0.17, 0.67, 0.41, 1.08);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="flex items-center justify-center min-h-screen p-mobile-margin font-body-md-mobile">
<!-- Ambient Background Elements -->
<div class="ambient-orb top-1/4 left-1/2 -translate-x-1/2"></div>
<div class="absolute inset-0 z-0 opacity-30 pointer-events-none">
<div class="absolute top-[-10%] right-[-10%] w-96 h-96 bg-primary-container blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-5%] left-[-5%] w-80 h-80 bg-secondary-container blur-[100px] rounded-full"></div>
</div>
<!-- Main Content Container -->
<main class="relative z-10 w-full max-w-[400px] flex flex-col items-center">
<!-- Brand / Identity -->
<div class="mb-12 text-center">
<h1 class="font-display-xl-mobile text-display-xl-mobile text-on-background mb-2">JobFlow</h1>
<p class="font-body-md-mobile text-on-surface-variant max-w-[280px] mx-auto">
                Enter your email to receive a secure password reset link.
            </p>
</div>
<!-- Glassmorphic Card -->
<div class="glass-card w-full p-8 rounded-[32px] flex flex-col gap-8">
<!-- Form -->
<form action="#" class="flex flex-col gap-6" method="POST">
<!-- Email Input Field -->
<div class="flex flex-col gap-2">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant ml-1" for="email">Work Email</label>
<div class="relative group input-focus-ring flex items-center bg-white/60 border border-glass-border rounded-2xl h-14 transition-all duration-300 overflow-hidden">
<span class="material-symbols-outlined ml-4 text-primary opacity-60 group-focus-within:opacity-100 transition-opacity" data-icon="mail">mail</span>
<input class="w-full h-full bg-transparent border-none focus:ring-0 px-3 text-on-surface placeholder:text-outline/50 font-body-md-mobile" id="email" name="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="ios-spring-active w-full h-14 bg-primary text-white font-label-caps-mobile text-[16px] rounded-full flex items-center justify-center gap-2 shadow-lg hover:bg-primary-container transition-all" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Bottom Navigation Link -->
<div class="flex justify-center pt-2">
<a class="ios-spring-active group flex items-center gap-2 font-label-caps-mobile text-primary font-bold" href="/login">
<span class="material-symbols-outlined text-[18px] group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                    Back to Login
                </a>
</div>
</div>
<!-- Footer Visual Hint -->
<div class="mt-12 opacity-40">
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-primary/40"></div>
<div class="w-2 h-2 rounded-full bg-primary"></div>
<div class="w-2 h-2 rounded-full bg-primary/40"></div>
</div>
</div>
</main>
<!-- Micro-interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.querySelector('form');
            const button = form.querySelector('button');
            const input = document.getElementById('email');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                // Subtle visual feedback for success
                button.innerHTML = '<span class="material-symbols-outlined animate-spin" data-icon="progress_activity">progress_activity</span> Sending...';
                button.classList.add('opacity-80');
                button.disabled = true;

                setTimeout(() => {
                    button.innerHTML = '<span class="material-symbols-outlined" data-icon="check_circle">check_circle</span> Check your Inbox';
                    button.classList.remove('bg-primary');
                    button.classList.add('bg-tertiary-container');
                    
                    // Simple alert for demo purposes
                    console.log('Reset link requested for: ' + input.value);
                }, 1500);
            });

            // Smooth background tracking for the "orb" based on movement (Mobile Gyro / Mouse)
            document.addEventListener('mousemove', (e) => {
                const orb = document.querySelector('.ambient-orb');
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                
                orb.style.transform = `translate(${x * 40}px, ${y * 40}px)`;
            });
        });
    </script>
