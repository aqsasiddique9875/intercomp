<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-secondary": "#ffffff",
                    "secondary-fixed": "#d3e3ff",
                    "primary-container": "#a34cbe",
                    "gold": "#FFD60A",
                    "glass-thick": "rgba(255, 255, 255, 0.8)",
                    "secondary-container": "#54a3ff",
                    "on-secondary-fixed": "#001c39",
                    "primary-fixed": "#fbd7ff",
                    "inverse-on-surface": "#ecf1ff",
                    "glass-border": "rgba(255, 255, 255, 0.6)",
                    "on-tertiary-fixed": "#002106",
                    "on-primary-fixed-variant": "#72188f",
                    "surface-container-high": "#e0e8fb",
                    "secondary-fixed-dim": "#a3c9ff",
                    "glass-fill": "rgba(255, 255, 255, 0.35)",
                    "on-background": "#141c29",
                    "on-secondary-fixed-variant": "#004883",
                    "surface-container-highest": "#dbe3f6",
                    "surface-tint": "#8d37a9",
                    "surface-bright": "#f9f9ff",
                    "on-surface-variant": "#4f4350",
                    "on-primary-container": "#fff5fb",
                    "card-gradient": "linear-gradient(135deg, #4D9EFA 0%, #BF7DF5 100%)",
                    "tertiary-fixed-dim": "#47e266",
                    "surface-container-lowest": "#ffffff",
                    "secondary": "#0060ab",
                    "outline-variant": "#d2c1d2",
                    "on-error-container": "#93000a",
                    "surface-variant": "#dbe3f6",
                    "error-container": "#ffdad6",
                    "orange": "#FF9F0A",
                    "outline": "#817381",
                    "on-secondary-container": "#003868",
                    "error": "#FF453A",
                    "tertiary-container": "#00842f",
                    "surface": "#f9f9ff",
                    "surface-dim": "#d2daed",
                    "primary-fixed-dim": "#f0b0ff",
                    "on-tertiary-fixed-variant": "#00531a",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#330044",
                    "primary": "#8731a3",
                    "inverse-surface": "#29313f",
                    "on-surface": "#141c29",
                    "background": "#f9f9ff",
                    "tertiary": "#006823",
                    "tertiary-fixed": "#6cff82",
                    "inverse-primary": "#f0b0ff",
                    "surface-container": "#e7eeff",
                    "on-tertiary": "#ffffff",
                    "surface-container-low": "#f0f3ff",
                    "on-tertiary-container": "#e6ffe0",
                    "on-primary": "#ffffff",
                    "deep-purple": "#471A70"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px",
                    "card": "24px",
                    "input": "16px"
            },
            "spacing": {
                    "safe-bottom": "34px",
                    "base": "8px",
                    "mobile-margin": "20px",
                    "safe-top": "44px",
                    "mobile-gutter": "16px",
                    "max-width": "1280px",
                    "desktop-margin": "64px",
                    "desktop-gutter": "24px"
            },
            "fontFamily": {
                    "headline-lg-mobile": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-md-mobile": ["Inter"],
                    "label-caps-mobile": ["Inter"],
                    "display-xl": ["Inter"],
                    "body-md": ["Inter"],
                    "display-xl-mobile": ["Inter"],
                    "headline-lg": ["Inter"]
            },
            "fontSize": {
                    "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-caps": ["13px", {"lineHeight": "1.0", "letterSpacing": "0.03em", "fontWeight": "600"}],
                    "body-md-mobile": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "label-caps-mobile": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "display-xl": ["56px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "display-xl-mobile": ["34px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "headline-lg": ["34px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            background: linear-gradient(180deg, #DCE4F7 0%, #FFFFFF 100%);
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }
        .active-press:active {
            transform: scale(0.96);
            transition: transform 0.2s cubic-bezier(0.35, 0, 0.15, 1);
        }
        .custom-scroll::-webkit-scrollbar {
            display: none;
        }
        .floating-label-input:focus-within label {
            transform: translateY(-20px) scale(0.85);
            color: #8731a3;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="font-body-md-mobile text-deep-purple custom-scroll pb-32">
<!-- TopAppBar -->
<nav class="fixed top-0 left-0 w-full z-50 flex items-center justify-between px-mobile-margin h-safe-top backdrop-blur-[28px] border-b border-glass-border bg-glass-fill shadow-[0_12px_40px_0_rgba(71,26,112,0.15)]">
<div class="flex items-center active-press">
<span class="material-symbols-outlined text-primary text-2xl" data-icon="arrow_back_ios">arrow_back_ios</span>
</div>
<h1 class="font-headline-lg-mobile text-[17px] font-bold text-primary">New Assignment</h1>
<button class="active-press font-semibold text-primary transition-opacity hover:opacity-80">
            Publish
        </button>
</nav>
<!-- Main Content Area -->
<main class="mt-[88px] px-mobile-margin space-y-6">
<!-- Card 1: Metadata -->
<section class="glass-card rounded-card p-6 space-y-5">
<div class="space-y-2">
<label class="block text-label-caps-mobile text-deep-purple/60 px-1">Assignment Title</label>
<input class="w-full h-11 px-4 rounded-input bg-glass-thick border-none focus:ring-2 focus:ring-primary/20 text-deep-purple placeholder:text-deep-purple/30" placeholder="e.g. Interactive Systems Final" type="text"/>
</div>
<div class="space-y-2">
<label class="block text-label-caps-mobile text-deep-purple/60 px-1">Deadline</label>
<div class="relative active-press">
<input class="w-full h-[48px] px-4 pr-12 rounded-input bg-glass-thick border-none text-deep-purple cursor-pointer" readonly="" type="text" value="Oct 24, 2024 • 11:59 PM"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary" data-icon="calendar_month">calendar_month</span>
</div>
</div>
<div class="space-y-2">
<label class="block text-label-caps-mobile text-deep-purple/60 px-1">Category</label>
<div class="relative">
<select class="w-full h-11 px-4 pr-10 rounded-input bg-glass-thick border-none appearance-none text-deep-purple focus:ring-2 focus:ring-primary/20">
<option>UI Design</option>
<option>Computer Science</option>
<option>Game Development</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-primary pointer-events-none" data-icon="expand_more">expand_more</span>
</div>
</div>
</section>
<!-- Card 2: Parameters -->
<section class="glass-card rounded-card p-6">
<div class="grid grid-cols-2 gap-4">
<div class="space-y-2">
<label class="block text-label-caps-mobile text-deep-purple/60 px-1">Max Points</label>
<input class="w-full h-11 px-4 rounded-input bg-glass-thick border-none focus:ring-2 focus:ring-primary/20 text-deep-purple" placeholder="100" type="number"/>
</div>
<div class="space-y-2">
<label class="block text-label-caps-mobile text-deep-purple/60 px-1">Passing Grade</label>
<div class="relative">
<input class="w-full h-11 px-4 rounded-input bg-glass-thick border-none focus:ring-2 focus:ring-primary/20 text-deep-purple" placeholder="60" type="number"/>
<span class="absolute right-4 top-1/2 -translate-y-1/2 text-deep-purple/40">%</span>
</div>
</div>
</div>
</section>
<!-- Card 3: Visual Assets/Files -->
<section class="glass-card rounded-card p-6">
<div class="border-2 border-dashed border-primary/30 rounded-input p-8 flex flex-col items-center justify-center space-y-4 bg-white/5 active-press cursor-pointer transition-colors hover:bg-white/10">
<div class="relative w-20 h-20">
<img alt="Cloud Upload" class="w-full h-full opacity-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA2IKHpX2gXPPmK8vPnZAb2bFOYwdS8tEZ-deTiGCjfcDQUvX6xBraypZSXqC1hUBT2cGHQzIhAeGKgR0v9yIsYa7fRTnuGW1a4eesuvX1MzjH-1ksZwTt9Rio45gVQtt-h2zlpqv5vpBin__uudQNLfwOjR2RPOx2q85w06QRlQv4LogB1LZlWjh-k3C1dP1qUDzn7DKwLHbjVJNjd9ETlx1ztC9G82lJabgUZUCyn3qInLmr60FI9JYCdHLDJZVMQJVTa7bflX17M"/>
<div class="absolute inset-0 flex items-center justify-center">
<span class="material-symbols-outlined text-5xl text-primary/80" data-icon="cloud_upload" style="font-variation-settings: 'FILL' 0, 'wght' 200;">cloud_upload</span>
</div>
<!-- Refers to https://lh3.googleusercontent.com/aida/AP1WRLufCPufXPgJQQ973RUxU-wQkWShRvWh3G_jbgY9rWJnqKEspLd5Jc0Ndv187iCzwVn1bmOrFCkXgt_oOYi9YixeyC8vMwFniZFjBLsz5kNyF7t26BvG2MNYcdS2WJ1vz0MJvfzSNm3wgS56IdnPm6UX2m3asUQmCQrFDOj6db-WZTWLQOR11iXE2pFiWHn9aoAZQ8dAKUAhugR4741GwifHv_0W8B1I6y2x14LEu9YTL-pGxRCUX6cIxrBq concept: 3D glass cloud -->
<div class="absolute inset-0 flex items-center justify-center pointer-events-none">
<div class="w-16 h-16 rounded-full bg-primary/10 blur-xl"></div>
</div>
</div>
<div class="text-center">
<p class="font-semibold text-deep-purple">Attach Assignment Brief</p>
<p class="text-xs text-deep-purple/50 mt-1">PDF, DOCX up to 10MB</p>
</div>
</div>
</section>
<!-- Card 4: Rubric Builder -->
<section class="glass-card rounded-card p-6 space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-label-caps text-deep-purple font-bold">Grading Criteria</h2>
<span class="text-[11px] text-primary bg-primary/10 px-2 py-0.5 rounded-full font-bold">40 TOTAL</span>
</div>
<div class="space-y-3" id="criteria-list">
<!-- Criterion 1 -->
<div class="flex items-center gap-3 bg-glass-thick/40 p-3 rounded-xl border border-glass-border">
<div class="flex-1">
<p class="text-[14px] font-semibold">Fidelity</p>
<p class="text-[11px] text-deep-purple/50">Visual execution quality</p>
</div>
<div class="w-12 text-center">
<span class="text-[14px] font-bold text-primary">20</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-error/60 active-press">
<span class="material-symbols-outlined text-xl" data-icon="delete">delete</span>
</button>
</div>
<!-- Criterion 2 -->
<div class="flex items-center gap-3 bg-glass-thick/40 p-3 rounded-xl border border-glass-border">
<div class="flex-1">
<p class="text-[14px] font-semibold">Usability</p>
<p class="text-[11px] text-deep-purple/50">Navigation logic</p>
</div>
<div class="w-12 text-center">
<span class="text-[14px] font-bold text-primary">20</span>
</div>
<button class="w-8 h-8 flex items-center justify-center text-error/60 active-press">
<span class="material-symbols-outlined text-xl" data-icon="delete">delete</span>
</button>
</div>
</div>
<button class="w-full h-12 flex items-center justify-center gap-2 rounded-full border-2 border-primary/30 text-primary font-bold active-press hover:bg-primary/5 transition-colors mt-4">
<span class="material-symbols-outlined" data-icon="add">add</span>
                Add Criteria
            </button>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-mobile-margin pb-safe-bottom h-20 bg-glass-thick backdrop-blur-[28px] border-t border-glass-border rounded-t-xl shadow-[0_-8px_30px_0_rgba(71,26,112,0.1)]">
<!-- Dashboard -->
<div class="flex flex-col items-center justify-center text-on-surface-variant transition-colors hover:bg-white/10 active-press">
<span class="material-symbols-outlined mb-1" data-icon="dashboard">dashboard</span>
<span class="text-label-caps-mobile font-label-caps-mobile">Dashboard</span>
</div>
<!-- Courses (Active - nearest match to "New Assignment" context of faculty/instructor flow) -->
<div class="flex flex-col items-center justify-center text-primary font-bold active-press">
<span class="material-symbols-outlined mb-1" data-icon="menu_book" style="font-variation-settings: 'FILL' 1;">menu_book</span>
<span class="text-label-caps-mobile font-label-caps-mobile">Courses</span>
</div>
<!-- Students -->
<div class="flex flex-col items-center justify-center text-on-surface-variant transition-colors hover:bg-white/10 active-press">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="text-label-caps-mobile font-label-caps-mobile">Students</span>
</div>
<!-- Settings -->
<div class="flex flex-col items-center justify-center text-on-surface-variant transition-colors hover:bg-white/10 active-press">
<span class="material-symbols-outlined mb-1" data-icon="settings">settings</span>
<span class="text-label-caps-mobile font-label-caps-mobile">Settings</span>
</div>
</nav>
<!-- Interaction Script -->
<script>
        document.querySelectorAll('.active-press').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.classList.add('scale-95');
            });
            button.addEventListener('touchend', () => {
                button.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
