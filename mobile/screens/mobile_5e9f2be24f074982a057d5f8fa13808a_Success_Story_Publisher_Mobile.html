<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Lumina - Success Story Publisher</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "secondary-fixed-dim": "#a3c9ff",
                    "on-tertiary": "#ffffff",
                    "gold": "#FFD60A",
                    "surface-container": "#e7eeff",
                    "on-secondary-fixed-variant": "#004883",
                    "inverse-primary": "#f0b0ff",
                    "surface-dim": "#d2daed",
                    "surface-bright": "#f9f9ff",
                    "on-primary-fixed-variant": "#72188f",
                    "primary": "#8731a3",
                    "tertiary": "#006823",
                    "outline": "#817381",
                    "on-tertiary-fixed-variant": "#00531a",
                    "on-primary-fixed": "#330044",
                    "secondary": "#0060ab",
                    "on-secondary-fixed": "#001c39",
                    "glass-thick": "rgba(255, 255, 255, 0.8)",
                    "inverse-surface": "#29313f",
                    "glass-border": "rgba(255, 255, 255, 0.6)",
                    "on-background": "#141c29",
                    "on-surface": "#141c29",
                    "primary-fixed-dim": "#f0b0ff",
                    "on-secondary-container": "#003868",
                    "error": "#FF453A",
                    "tertiary-container": "#00842f",
                    "on-primary-container": "#fff5fb",
                    "surface-container-high": "#e0e8fb",
                    "surface-container-highest": "#dbe3f6",
                    "secondary-fixed": "#d3e3ff",
                    "on-tertiary-container": "#e6ffe0",
                    "inverse-on-surface": "#ecf1ff",
                    "on-secondary": "#ffffff",
                    "surface-container-low": "#f0f3ff",
                    "secondary-container": "#54a3ff",
                    "glass-fill": "rgba(255, 255, 255, 0.35)",
                    "on-error-container": "#93000a",
                    "tertiary-fixed-dim": "#47e266",
                    "on-tertiary-fixed": "#002106",
                    "on-primary": "#ffffff",
                    "primary-container": "#a34cbe",
                    "surface-container-lowest": "#ffffff",
                    "error-container": "#ffdad6",
                    "tertiary-fixed": "#6cff82",
                    "primary-fixed": "#fbd7ff",
                    "background": "#DCE4F7",
                    "orange": "#FF9F0A",
                    "on-surface-variant": "#4f4350",
                    "surface-tint": "#8d37a9",
                    "surface": "#DCE4F7",
                    "surface-variant": "#dbe3f6",
                    "on-error": "#ffffff",
                    "card-gradient": "linear-gradient(135deg, #4D9EFA 0%, #BF7DF5 100%)",
                    "outline-variant": "#d2c1d2"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "safe-top": "44px",
                    "mobile-margin": "20px",
                    "mobile-gutter": "16px",
                    "max-width": "1280px",
                    "safe-bottom": "34px",
                    "desktop-gutter": "24px",
                    "base": "8px",
                    "desktop-margin": "64px"
            },
            "fontFamily": {
                    "display-xl-mobile": ["Inter"],
                    "body-md-mobile": ["Inter"],
                    "headline-lg-mobile": ["Inter"],
                    "label-caps": ["Inter"],
                    "body-md": ["Inter"],
                    "headline-lg": ["Inter"],
                    "display-xl": ["Inter"],
                    "label-caps-mobile": ["Inter"]
            },
            "fontSize": {
                    "display-xl-mobile": ["34px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                    "body-md-mobile": ["15px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "1.3", "letterSpacing": "-0.01em", "fontWeight": "700"}],
                    "label-caps": ["13px", {"lineHeight": "1.0", "letterSpacing": "0.03em", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                    "headline-lg": ["34px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "600"}],
                    "display-xl": ["56px", {"lineHeight": "1.1", "letterSpacing": "-0.03em", "fontWeight": "700"}],
                    "label-caps-mobile": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.05em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #DCE4F7;
            -webkit-tap-highlight-color: transparent;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-scale:active {
            transform: scale(0.96);
            transition: transform 0.3s cubic-bezier(0.35, 0, 0.15, 1);
        }
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen text-on-background flex flex-col overflow-x-hidden">
<!-- Top AppBar (Filtered from Shared Components for Task focus) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-mobile-margin h-safe-top bg-glass-fill backdrop-blur-[28px] border-b border-glass-border">
<div class="flex items-center gap-4">
<button class="active-scale text-primary">
<span class="material-symbols-outlined">arrow_back_ios</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary">Lumina</h1>
</div>
<button class="active-scale text-primary font-label-caps-mobile text-label-caps-mobile bg-primary-fixed-dim/30 px-4 py-2 rounded-full">
            Publish
        </button>
</header>
<!-- Main Content Area -->
<main class="flex-grow pt-[80px] pb-[120px] px-mobile-margin">
<!-- Welcome / Title -->
<div class="mb-8">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-[#471A70]">Success Story</h2>
<p class="font-body-md-mobile text-body-md-mobile text-on-surface-variant opacity-80">Draft your inspiring student journey</p>
</div>
<form class="space-y-6">
<!-- Section 1: Story Basics -->
<section class="glass-card rounded-[24px] p-6 space-y-4">
<h3 class="font-label-caps-mobile text-label-caps-mobile text-primary uppercase tracking-wider">Story Basics</h3>
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant ml-1">Student Name</label>
<input class="w-full h-[52px] bg-glass-thick border-none rounded-xl px-4 font-body-md-mobile focus:ring-2 focus:ring-primary-container outline-none transition-all placeholder:text-outline-variant" placeholder="e.g. Alex Rivera" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant ml-1">Story Title</label>
<input class="w-full h-[52px] bg-glass-thick border-none rounded-xl px-4 font-body-md-mobile focus:ring-2 focus:ring-primary-container outline-none transition-all placeholder:text-outline-variant" placeholder="e.g. From Bootcamp to Senior Dev" type="text"/>
</div>
</section>
<!-- Section 2: Media Assets -->
<section class="space-y-4">
<h3 class="font-label-caps-mobile text-label-caps-mobile text-primary uppercase tracking-wider ml-1">Media Assets</h3>
<div class="grid grid-cols-2 gap-mobile-gutter">
<!-- Student Photo Upload -->
<div class="aspect-square glass-card rounded-[24px] flex flex-col items-center justify-center p-4 text-center cursor-pointer active-scale group">
<div class="w-12 h-12 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center mb-3 group-hover:bg-primary-container transition-colors">
<span class="material-symbols-outlined text-primary group-hover:text-white">person_add</span>
</div>
<span class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant">Student Photo</span>
</div>
<!-- Company Logo Upload -->
<div class="aspect-square glass-card rounded-[24px] flex flex-col items-center justify-center p-4 text-center cursor-pointer active-scale group">
<div class="w-12 h-12 rounded-full bg-secondary-fixed-dim/20 flex items-center justify-center mb-3 group-hover:bg-secondary-container transition-colors">
<span class="material-symbols-outlined text-secondary group-hover:text-white">domain</span>
</div>
<span class="font-label-caps-mobile text-label-caps-mobile text-on-surface-variant">Company Logo</span>
</div>
</div>
</section>
<!-- Section 3: Success Narrative -->
<section class="glass-card rounded-[24px] p-6 space-y-4">
<h3 class="font-label-caps-mobile text-label-caps-mobile text-primary uppercase tracking-wider">Success Narrative</h3>
<div class="bg-glass-thick rounded-xl overflow-hidden border border-white/40">
<!-- Rich Text Toolbar -->
<div class="flex items-center gap-2 p-2 border-b border-outline-variant/20 bg-white/10">
<button class="p-2 rounded-lg hover:bg-primary-fixed-dim/20 text-on-surface-variant active-scale" type="button">
<span class="material-symbols-outlined">format_bold</span>
</button>
<button class="p-2 rounded-lg hover:bg-primary-fixed-dim/20 text-on-surface-variant active-scale" type="button">
<span class="material-symbols-outlined">format_italic</span>
</button>
<button class="p-2 rounded-lg hover:bg-primary-fixed-dim/20 text-on-surface-variant active-scale" type="button">
<span class="material-symbols-outlined">link</span>
</button>
<div class="h-6 w-px bg-outline-variant/30 mx-1"></div>
<button class="p-2 rounded-lg hover:bg-primary-fixed-dim/20 text-on-surface-variant active-scale" type="button">
<span class="material-symbols-outlined">format_list_bulleted</span>
</button>
</div>
<!-- Text Area -->
<textarea class="w-full bg-transparent border-none p-4 font-body-md-mobile focus:ring-0 outline-none resize-none placeholder:text-outline-variant" placeholder="Share the transformation journey..." rows="6"></textarea>
</div>
</section>
</form>
</main>
<!-- Bottom Action Button -->
<div class="fixed bottom-0 left-0 w-full p-mobile-margin pb-safe-bottom bg-gradient-to-t from-[#DCE4F7] to-transparent pointer-events-none">
<button class="pointer-events-auto w-full h-[64px] bg-primary rounded-full flex items-center justify-center gap-3 shadow-[0_12px_40px_0_rgba(163,76,190,0.3)] active-scale text-white">
<span class="font-headline-lg-mobile text-[18px] font-bold tracking-tight">Launch Story</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</button>
</div>
<!-- Background Decorative Elements (Liquid Gradients) -->
<div class="fixed top-[-10%] right-[-10%] w-[300px] h-[300px] bg-primary-container rounded-full blur-[100px] opacity-20 pointer-events-none -z-10 animate-pulse"></div>
<div class="fixed bottom-[10%] left-[-10%] w-[250px] h-[250px] bg-secondary-container rounded-full blur-[100px] opacity-20 pointer-events-none -z-10"></div>
<script>
        // Simple Interaction Feedback
        document.querySelectorAll('.active-scale').forEach(button => {
            button.addEventListener('touchstart', () => {
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('touchend', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Form placeholder logic (visual only)
        const inputs = document.querySelectorAll('input, textarea');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('ring-2', 'ring-primary-container');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('ring-2', 'ring-primary-container');
            });
        });
    </script>
</body></html>
