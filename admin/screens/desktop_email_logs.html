<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Email Section - Login Logs</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: transparent;
    }
  </style>
</head>
<body class="p-8">
  <input id="searchInput" type="text" class="hidden" />
  <div class="max-w-6xl mx-auto">
    <div class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800 tracking-tight">Login Activity</h1>
      <p class="text-gray-500 mt-2">View the list of all users who have logged into the system.</p>
    </div>

    <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-xl border border-white p-6">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="text-xs uppercase text-gray-500 border-b border-gray-200">
              <th class="py-4 px-4 font-semibold">User</th>
              <th class="py-4 px-4 font-semibold">Email</th>
              <th class="py-4 px-4 font-semibold">Role</th>
              <th class="py-4 px-4 font-semibold">Last Login</th>
              <th class="py-4 px-4 font-semibold text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y divide-gray-100">
            <tr>
              <td colspan="5" class="py-8 text-center text-gray-500">Loading user data...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    window.changeRole = async (userId, newRole, btn) => {
      try {
        const res = await fetch('http://localhost:8080/api/users/role', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: userId, role: newRole })
        });
        if (res.ok) {
          const row = btn.closest('tr');
          const badgeSpan = row.querySelector('td:nth-child(3) span');
          
          let roleBadgeColor = 'bg-gray-100 text-gray-800';
          if (newRole === 'student') roleBadgeColor = 'bg-blue-100 text-blue-800';
          else if (newRole === 'recruiter' || newRole === 'company') roleBadgeColor = 'bg-green-100 text-green-800';
          else if (newRole === 'admin') roleBadgeColor = 'bg-purple-100 text-purple-800';

          badgeSpan.className = `px-2.5 py-1 text-xs font-semibold rounded-full ${roleBadgeColor}`;
          badgeSpan.textContent = newRole.toUpperCase();
        } else {
          alert('Failed to update role');
        }
      } catch (err) {
        console.error(err);
        alert('Error updating role');
      }
    };

    let allUsers = [];
    let currentSearchTerm = '';

    async function loadUsers() {
      const tableBody = document.getElementById('userTableBody');
      try {
        const response = await fetch('http://localhost:8080/api/users');
        if (!response.ok) throw new Error('Failed to fetch');
        
        allUsers = await response.json();
        
        allUsers.sort((a, b) => {
          const timeA = a.lastLogin || 0;
          const timeB = b.lastLogin || 0;
          return timeB - timeA;
        });

        renderUsers();
      } catch (err) {
        if (tableBody && tableBody.innerHTML.includes('Loading')) {
          tableBody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-red-500">Failed to load user data.</td></tr>';
        }
        console.error(err);
      }
    }

    function renderUsers() {
      const tableBody = document.getElementById('userTableBody');
      if (!tableBody) return;

      const filtered = allUsers.filter(user => {
        const query = currentSearchTerm.toLowerCase().trim();
        if (!query) return true;
        const nameMatch = (user.username || '').toLowerCase().includes(query);
        const emailMatch = (user.email || '').toLowerCase().includes(query);
        const roleMatch = (user.role || '').toLowerCase().includes(query);
        return nameMatch || emailMatch || roleMatch;
      });

      if (filtered.length === 0) {
        tableBody.innerHTML = '<tr><td colspan="5" class="py-8 text-center text-gray-500">No users found.</td></tr>';
        return;
      }

      tableBody.innerHTML = '';
      
      filtered.forEach(user => {
        const row = document.createElement('tr');
        row.className = 'hover:bg-gray-50/50 transition-colors';
        
        let loginText = 'Never';
        if (user.lastLogin) {
          loginText = new Date(user.lastLogin).toLocaleString();
        }

        let roleBadgeColor = 'bg-gray-100 text-gray-800';
        if (user.role === 'student') roleBadgeColor = 'bg-blue-100 text-blue-800';
        else if (user.role === 'recruiter' || user.role === 'company') roleBadgeColor = 'bg-green-100 text-green-800';
        else if (user.role === 'admin') roleBadgeColor = 'bg-purple-100 text-purple-800';

        row.innerHTML = `
          <td class="py-4 px-4">
            <div class="font-medium text-gray-900">${user.username}</div>
          </td>
          <td class="py-4 px-4 text-gray-600">${user.email}</td>
          <td class="py-4 px-4">
            <span class="px-2.5 py-1 text-xs font-semibold rounded-full ${roleBadgeColor}">
              ${(user.role || 'Unknown').toUpperCase()}
            </span>
          </td>
          <td class="py-4 px-4 text-gray-600 text-sm">
            ${loginText}
          </td>
          <td class="py-4 px-4 text-right space-x-2">
            <button onclick="changeRole('${user.id}', 'admin', this)" class="px-3 py-1 bg-purple-600 text-white text-xs font-semibold rounded shadow hover:bg-purple-700 transition">Make Admin</button>
            <button onclick="changeRole('${user.id}', 'recruiter', this)" class="px-3 py-1 bg-green-600 text-white text-xs font-semibold rounded shadow hover:bg-green-700 transition">Make Client</button>
          </td>
        `;
        tableBody.appendChild(row);
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadUsers();
      // Poll for live data every 3 seconds
      setInterval(loadUsers, 3000);

      // Listen to search input
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('input', (e) => {
          currentSearchTerm = e.target.value;
          renderUsers();
        });
      }
    });
  </script>
</body>
</html>
