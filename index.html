<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Intercomp - Liquid Glass Platform</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #f4f5fc;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    .loading-screen {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: rgba(244, 245, 252, 0.45);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(135, 49, 163, 0.1);
      border-left-color: #8731a3;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
  </div>

  <iframe id="appFrame" src="about:blank"></iframe>

  <script>
    const BREAKPOINT = 768;
    const MOBILE_PATH = 'mobile/index.html';
    const WEBSITE_PATH = 'website/index.html';
    
    let currentLayout = null; // 'mobile' or 'website'
    const iframe = document.getElementById('appFrame');
    const loader = document.getElementById('loadingScreen');

    function getRequiredLayout() {
      return window.innerWidth < BREAKPOINT ? 'mobile' : 'website';
    }

    function updateLayout() {
      const requiredLayout = getRequiredLayout();
      if (currentLayout !== requiredLayout) {
        currentLayout = requiredLayout;
        loader.style.opacity = '1';
        loader.style.pointerEvents = 'auto';

        const targetSrc = requiredLayout === 'mobile' ? MOBILE_PATH : WEBSITE_PATH;
        iframe.src = targetSrc + window.location.hash;
      }
    }

    // Hide loader once the iframe has loaded the layout
    iframe.addEventListener('load', () => {
      if (iframe.src !== 'about:blank') {
        loader.style.opacity = '0';
        loader.style.pointerEvents = 'none';
      }
    });

    // Propagate parent window hash changes to the iframe
    window.addEventListener('hashchange', () => {
      try {
        const iframeWin = iframe.contentWindow;
        if (iframeWin && iframeWin.location && iframeWin.location.hash !== window.location.hash) {
          iframeWin.location.hash = window.location.hash;
        }
      } catch (e) {}
    });

    // Listen to resize events and swap layouts silently
    window.addEventListener('resize', debounce(updateLayout, 150));

    // Initial load
    updateLayout();

    // Helper debounce function
    function debounce(func, wait) {
      let timeout;
      return function(...args) {
        clearTimeout(timeout);
        timeout = setTimeout(() => func.apply(this, args), wait);
      };
    }
  </script>
</body>
</html>
