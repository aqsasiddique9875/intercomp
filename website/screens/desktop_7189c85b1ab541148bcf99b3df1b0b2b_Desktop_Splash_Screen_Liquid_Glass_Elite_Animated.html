<!-- STITCH_SHADER_START:ANIMATION_91 class="absolute inset-0 w-full h-full z-0" -->
<div class="absolute inset-0 w-full h-full z-0" style="display:block;">
<canvas id="shader-canvas-ANIMATION_91" style="display:block;width:100%;height:100%"></canvas>
<script>
(function() {
  const canvas = document.getElementById('shader-canvas-ANIMATION_91');

  // Sync the WebGL drawing-buffer size with the CSS-driven layout size.
  // This fires on initial layout and whenever the element is resized.
  function syncSize() {
    const w = canvas.clientWidth  || 1280;
    const h = canvas.clientHeight || 720;
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width  = w;
      canvas.height = h;
    }
  }
  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(syncSize).observe(canvas);
  }
  syncSize();

  const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
  if (!gl) return;
  const vs = `attribute vec2 a_position;
varying vec2 v_texCoord;
void main() {
  v_texCoord = a_position * 0.5 + 0.5;
  gl_Position = vec4(a_position, 0.0, 1.0);
}`;
  const fs = `precision highp float;
varying vec2 v_texCoord;
uniform float u_time;
uniform vec2 u_resolution;
uniform vec2 u_mouse;

void main() {
    vec2 uv = v_texCoord;
    vec2 mouse = u_mouse / u_resolution;
    
    // Background base color (DCE4F7 - soft pastel lavender-blue)
    vec3 baseColor = vec3(0.863, 0.894, 0.969);
    
    // Pulse logic for the neon blue glow (#0A84FF)
    float pulse = 0.5 + 0.5 * sin(u_time * 1.5);
    vec2 center = vec2(0.5, 0.5) + (mouse - 0.5) * 0.05; // Subtle parallax shift
    float dist = distance(uv, center);
    
    // Main neon blue glow
    vec3 glowColor = vec3(0.039, 0.518, 1.0); // #0A84FF
    float glowMask = smoothstep(0.4, 0.0, dist);
    vec3 color = mix(baseColor, glowColor, glowMask * (0.3 + 0.2 * pulse));
    
    // Subtle secondary purple accent to match design system
    vec3 secondaryColor = vec3(0.639, 0.298, 0.745); // #A34CBE
    float secondaryGlow = smoothstep(0.6, 0.1, distance(uv, vec2(0.5 + 0.2 * cos(u_time * 0.5), 0.5 + 0.2 * sin(u_time * 0.5))));
    color = mix(color, secondaryColor, secondaryGlow * 0.1);

    gl_FragColor = vec4(color, 1.0);
}`;
  function cs(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, cs(gl.VERTEX_SHADER, vs));
  gl.attachShader(prog, cs(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog);
  gl.useProgram(prog);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const pos = gl.getAttribLocation(prog, 'a_position');
  gl.enableVertexAttribArray(pos);
  gl.vertexAttribPointer(pos, 2, gl.FLOAT, false, 0, 0);
  const uTime = gl.getUniformLocation(prog, 'u_time');
  const uRes = gl.getUniformLocation(prog, 'u_resolution');
  const uMouse = gl.getUniformLocation(prog, 'u_mouse');

  // u_mouse is in pixel coordinates matching u_resolution (ShaderToy convention).
  // Shaders that need normalized coords should use: u_mouse / u_resolution.
  let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
  window.addEventListener('mousemove', (event) => {
    const rect = canvas.getBoundingClientRect();
    if (rect.width && rect.height) {
      const nx = (event.clientX - rect.left) / rect.width;
      const ny = 1.0 - (event.clientY - rect.top) / rect.height;
      mouse.x = nx * canvas.width;
      mouse.y = ny * canvas.height;
    }
  });

  function render(t) {
    if (typeof ResizeObserver === 'undefined') syncSize();
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (uTime) gl.uniform1f(uTime, t * 0.001);
    if (uRes) gl.uniform2f(uRes, canvas.width, canvas.height);
    if (uMouse) gl.uniform2f(uMouse, mouse.x, mouse.y);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    requestAnimationFrame(render);
  }
  render(0);
})();
</script>

<!-- Micro-interactions Script -->
<script>
    const card = document.getElementById('parallax-target');
    
    // Parallax Effect
    window.addEventListener('mousemove', (e) => {
        const x = (window.innerWidth / 2 - e.clientX) / 25;
        const y = (window.innerHeight / 2 - e.clientY) / 25;
        
        card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    // Touch Parallax (Gyroscope Simulation)
    window.addEventListener('touchmove', (e) => {
        const touch = e.touches[0];
        const x = (window.innerWidth / 2 - touch.clientX) / 15;
        const y = (window.innerHeight / 2 - touch.clientY) / 15;
        
        card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    // Reset on mouse leave
    window.addEventListener('mouseleave', () => {
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
    });

    // Soft entry animation
    document.addEventListener('DOMContentLoaded', () => {
        card.style.opacity = '0';
        card.style.transform = 'scale(0.9) translateY(20px)';
        
        setTimeout(() => {
            card.style.transition = 'opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
            card.style.opacity = '1';
            card.style.transform = 'scale(1) translateY(0)';
        }, 100);
    });
</script>
