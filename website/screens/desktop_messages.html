  <style>
    ::-webkit-scrollbar {
      display: none;
    }
    * {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    body {
      background-color: #DCE4F7;
      color: #471A70;
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.35);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
    }
    .liquid-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      filter: blur(80px);
      opacity: 0.6;
    }
    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(163, 76, 190, 0.4) 0%, rgba(84, 163, 255, 0.1) 70%);
      border-radius: 50%;
      animation: move 20s infinite alternate;
    }
    @keyframes move {
      from { transform: translate(-10%, -10%); }
      to { transform: translate(20%, 20%); }
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      vertical-align: middle;
    }
    .active-chat-item {
      background-color: rgba(135, 49, 163, 0.15);
      border-left: 4px solid #8731a3;
    }
    .typing-dots span {
      animation: blink 1.4s infinite both;
      height: 6px;
      width: 6px;
      background: currentColor;
      border-radius: 50%;
      display: inline-block;
      margin: 0 1px;
    }
    .typing-dots span:nth-child(2) { animation-delay: .2s; }
    .typing-dots span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink {
      0% { opacity: .2; }
      20% { opacity: 1; }
      100% { opacity: .2; }
    }
  </style>
</head>

    let activeChatId = "c1";

    // ============================================================
    // LOAD INTERVIEW NOTIFICATIONS FROM RECRUITER (localStorage)
    // ============================================================
    function loadInterviewNotifications() {
      var interviewMsgs = JSON.parse(localStorage.getItem('studentInterviewMessages') || '[]');
      if (interviewMsgs.length === 0) return;

      var unreadCount = interviewMsgs.filter(function(m){ return !m.isRead; }).length;

      // Check if HR conversation already exists
      var existing = conversations.find(function(c){ return c.id === 'hr-interviews'; });

      // Build messages thread from all interview notifications
      var msgs = interviewMsgs.map(function(iv) {
        var timeAgo = getTimeAgo(new Date(iv.sentAt));
        return {
          sender: 'HR Team',
          text: iv.message.replace(/\n/g, ' ').substring(0, 200),
          fullText: iv.message,
          time: timeAgo,
          me: false,
          isInterview: true,
          subject: iv.subject,
          dateLabel: iv.dateLabel,
          timeLabel: iv.timeLabel,
          duration: iv.duration,
          candidateName: iv.candidateName
        };
      });

      var hrConv = {
        id: 'hr-interviews',
        name: 'EliteRecruit HR Team',
        role: 'Interview Scheduling & Talent Acquisition',
        avatar: 'https://i.pravatar.cc/40?img=68',
        online: true,
        unread: unreadCount,
        messages: msgs,
        autoreply: 'Thank you for your response! Our HR team will get back to you shortly. If you have any questions about your interview, please call us at +92-300-ELITE.'
      };

      if (existing) {
        // Update existing
        var idx = conversations.indexOf(existing);
        conversations[idx] = hrConv;
      } else {
        // Insert at top
        conversations.unshift(hrConv);
      }

      // Mark all as read when loaded (will be marked on open)
    }

    function getTimeAgo(date) {
      var now = new Date();
      var diff = Math.floor((now - date) / 1000);
      if (diff < 60) return 'Just now';
      if (diff < 3600) return Math.floor(diff/60) + 'm ago';
      if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
      return Math.floor(diff/86400) + 'd ago';
    }

    // loadInterviewNotifications(); // Disabled EliteRecruit HR Team conversation


    function renderChats() {
      const container = document.getElementById('chatsContainer');
      if (!container) return;
      container.innerHTML = '';

      const term = document.getElementById('chatSearch').value.toLowerCase();

      conversations.forEach(c => {
        if (term && !c.name.toLowerCase().includes(term) && !c.role.toLowerCase().includes(term)) {
          return;
        }

        const lastMsgObj = c.messages[c.messages.length - 1];
        const lastMsgText = lastMsgObj ? lastMsgObj.text : '';
        const lastMsgTime = lastMsgObj ? lastMsgObj.time : '';

        const item = document.createElement('div');
        item.className = `p-4 flex items-center justify-between cursor-pointer hover:bg-white/10 transition-colors ${c.id === activeChatId ? 'active-chat-item' : ''}`;
        item.onclick = () => selectChat(c.id);

        item.innerHTML = `
          <div class="flex items-center gap-3 w-10/12">
            <div class="relative flex-shrink-0">
              <img src="${c.avatar}" class="w-10 h-10 rounded-full object-cover border border-glass-border bg-white" alt="" />
              ${c.online ? '<span class="absolute bottom-0 right-0 w-2.5 h-2.5 bg-green-500 border border-white rounded-full"></span>' : ''}
            </div>
            <div class="truncate flex-grow">
              <div class="flex justify-between items-center">
                <span class="text-xs font-bold text-deep-purple">${c.name}</span>
                <span class="text-[9px] text-deep-purple/40">${lastMsgTime}</span>
              </div>
              <p class="text-[10px] text-deep-purple/50 truncate font-body-md mt-0.5">${lastMsgText}</p>
            </div>
          </div>
          <div class="w-2/12 flex justify-end">
            ${c.unread > 0 ? `<span class="bg-primary text-white text-[8px] font-black px-1.5 py-0.5 rounded-full">${c.unread}</span>` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    }

    function renderMessages() {
      const history = document.getElementById('messagesHistory');
      if (!history) return;
      history.innerHTML = '';

      const chat = conversations.find(c => c.id === activeChatId);
      if (!chat) return;

      chat.messages.forEach(m => {
        const bubble = document.createElement('div');

        if (m.me) {
          bubble.className = "flex flex-col items-end space-y-1 w-9/12 ml-auto";
          bubble.innerHTML = `
            <div class="bg-primary text-white p-3 rounded-2xl rounded-tr-none text-xs leading-relaxed shadow-sm">
              ${m.text}
            </div>
            <span class="text-[9px] text-deep-purple/40 pr-1">${m.time}</span>
          `;
        } else if (m.isInterview) {
          // Special interview notification bubble
          bubble.className = "flex gap-3 w-11/12";
          bubble.innerHTML = `
            <img src="${chat.avatar}" class="w-8 h-8 rounded-full object-cover border border-glass-border flex-shrink-0 bg-white" alt="" />
            <div class="flex flex-col space-y-1 flex-1">
              <div class="bg-white/90 p-3 rounded-2xl rounded-tl-none text-xs text-deep-purple leading-relaxed shadow-sm border border-glass-border">
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:8px;padding:6px 10px;background:rgba(71,26,112,0.07);border-radius:8px;">
                  <span style="font-family:'Material Symbols Outlined';font-size:16px;color:#471A70;display:inline-block;">event_available</span>
                  <strong style="font-size:11px;color:#471A70;">${m.subject}</strong>
                </div>
                <div style="white-space:pre-line;color:#374151;line-height:1.6;">${m.fullText || m.text}</div>
                <div style="margin-top:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                  <div style="background:rgba(71,26,112,0.05);border-radius:8px;padding:8px;">
                    <div style="font-size:9px;font-weight:700;color:rgba(71,26,112,0.5);text-transform:uppercase;letter-spacing:0.05em;">Date & Time</div>
                    <div style="font-size:11px;font-weight:700;color:#1a0533;margin-top:2px;">${m.dateLabel} · ${m.timeLabel}</div>
                  </div>
                  <div style="background:rgba(71,26,112,0.05);border-radius:8px;padding:8px;">
                    <div style="font-size:9px;font-weight:700;color:rgba(71,26,112,0.5);text-transform:uppercase;letter-spacing:0.05em;">Duration</div>
                    <div style="font-size:11px;font-weight:700;color:#1a0533;margin-top:2px;">${m.duration} minutes</div>
                  </div>
                </div>
                <div style="margin-top:10px;display:flex;gap:8px;">
                  <button onclick="confirmInterview(this)" style="flex:1;padding:8px;background:#471A70;border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:11px;font-weight:700;color:#fff;cursor:pointer;">✓ Confirm Attendance</button>
                  <button onclick="declineInterview(this)" style="flex:1;padding:8px;background:rgba(192,41,90,0.1);border:none;border-radius:8px;font-family:'Inter',sans-serif;font-size:11px;font-weight:600;color:#c0295a;cursor:pointer;">✗ Reschedule</button>
                </div>
              </div>
              <span class="text-[9px] text-deep-purple/40 pl-1">${m.time}</span>
            </div>
          `;
        } else {

            <div class="flex flex-col space-y-1">
              <div class="bg-white/70 p-3 rounded-2xl rounded-tl-none text-xs text-deep-purple leading-relaxed shadow-sm border border-glass-border">
                ${m.text}
              </div>
              <span class="text-[9px] text-deep-purple/40 pl-1">${m.time}</span>
            </div>
          `;
        }
        history.appendChild(bubble);
      });


      // Auto scroll to bottom
      history.scrollTop = history.scrollHeight;
    }

    function selectChat(id) {
      activeChatId = id;
      const chat = conversations.find(c => c.id === id);
      if (chat) {
        chat.unread = 0;

        // Update header details
        document.getElementById('activeName').textContent = chat.name;
        document.getElementById('activeRole').textContent = chat.role;
        document.getElementById('activeAvatar').src = chat.avatar;
        document.getElementById('activeStatusBadge').className = `absolute bottom-0 right-0 w-2.5 h-2.5 border border-white rounded-full ${chat.online ? 'bg-green-500' : 'bg-gray-400'}`;

        renderChats();
        renderMessages();
      }
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const val = input.value.trim();
      if (!val) return;

      const chat = conversations.find(c => c.id === activeChatId);

      const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        sender: "Me",
        text: val,
        time: time,
        me: true
      });

      input.value = '';
      renderMessages();
      renderChats();

      // Trigger Simulated Mentor Reply
      showTypingIndicator(chat.name.split(' ')[0], true);
      setTimeout(async () => {
        showTypingIndicator('', false);

          const viewData = screenTopics[activeView] || { name: 'Current Screen', info: 'You are currently on the ' + activeView + ' screen.', keywords: [] };

          try {
            const response = await fetch('/api/ai-chat', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                message: val,
                activeScreen: activeView,
                screenName: viewData.name,
                screenInfo: viewData.info
              })
            });

            if (!response.ok) throw new Error("API request failed");
            const data = await response.json();
            if (data && data.success && data.reply) {
              replyText = data.reply;
            } else {
              throw new Error("Invalid response schema");
            }
          } catch (err) {
            console.warn("AI Chat API failed, using static fallback:", err);
            const isAskingAboutOtherScreen = Object.keys(screenTopics).some(key => {
              if (key === activeView) return false;
              const keywords = screenTopics[key].keywords;
              return keywords.some(kw => val.toLowerCase().includes(kw));
            });

            if (isAskingAboutOtherScreen) {
              replyText = `I apologize, but I am restricted to answering questions only about your currently active screen: **${viewData.name}**. I cannot provide details or answer questions regarding other sections of the portal. Please switch to that screen if you wish to ask questions about it!`;
            } else {
              const hasMatchedCurrentKeywords = viewData.keywords.some(kw => val.toLowerCase().includes(kw)) || val.toLowerCase().includes('help') || val.toLowerCase().includes('what') || val.toLowerCase().includes('page') || val.toLowerCase().includes('screen');
              
              if (hasMatchedCurrentKeywords) {
                replyText = `[AI Agent Response for ${viewData.name}]: Here is some information about your current screen:\n\n${viewData.info}\n\nFeel free to ask more specific questions about the features on this page!`;
              } else {
                replyText = `I am your screen-specific AI Agent. I see you are currently on the **${viewData.name}** screen. You can ask me anything about the features, metrics, or details of this page. (Please note that I am restricted and cannot answer questions about other screens of the portal).`;
              }
            }
          }
        }

        chat.messages.push({
          sender: chat.name.split(' ')[0],
          text: replyText,
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          me: false
        });
        renderMessages();
        renderChats();
      }, 2000);
    }

    function handleInputKeydown(e) {
      if (e.key === 'Enter') {
        sendMessage();
      }
    }

    function showTypingIndicator(name, show) {
      const indicator = document.getElementById('typingIndicator');
      if (show) {
        document.getElementById('typingName').textContent = name;
        indicator.classList.remove('hidden');
      } else {
        indicator.classList.add('hidden');
      }
      const history = document.getElementById('messagesHistory');
      history.scrollTop = history.scrollHeight;
    }

    function filterChats(term) {
      if (term !== undefined) {
        const input = document.getElementById('chatSearch');
        if (input) input.value = term;
      }
      renderChats();
    }
    window.filterChats = filterChats;

    function triggerCall(type) {
      if (window.parent && window.parent.App && typeof window.parent.App.showToast === 'function') {
        window.parent.App.showToast(`Connecting secure ${type} call to mentor...`, "warning");
      }
    }

    function confirmInterview(btn) {
      btn.textContent = '✓ Confirmed!';
      btn.style.background = '#059669';
      btn.disabled = true;
      var chat = conversations.find(c => c.id === activeChatId);
      if (chat) {
        var time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        chat.messages.push({ sender: 'Me', text: 'Thank you! I confirm my attendance for the interview. Looking forward to it!', time: time, me: true });
        setTimeout(function() {
          chat.messages.push({ sender: 'HR Team', text: '✓ Great! Your attendance is confirmed. You will receive a Google Meet link 30 minutes before the interview. All the best! 🎉', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), me: false });
          renderMessages(); renderChats();
        }, 1500);
        renderMessages(); renderChats();
      }
    }
    function declineInterview(btn) {
      btn.textContent = 'Reschedule Requested';
      btn.style.background = 'rgba(192,41,90,0.2)';
      btn.disabled = true;
      var chat = conversations.find(c => c.id === activeChatId);
      if (chat) {
        var time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        chat.messages.push({ sender: 'Me', text: 'I would like to request a reschedule for this interview. Please let me know available alternative slots.', time: time, me: true });
        setTimeout(function() {
          chat.messages.push({ sender: 'HR Team', text: 'Understood! Our HR team will contact you within 24 hours with alternative interview slots. Thank you for letting us know.', time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), me: false });
          renderMessages(); renderChats();
        }, 1500);
        renderMessages(); renderChats();
      }
    }

    // Initial load
    selectChat(conversations[0] && conversations[0].id === 'hr-interviews' ? 'hr-interviews' : 'c1');
