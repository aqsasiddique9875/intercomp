<style>
        body {
            margin: 0;
            padding: 0;
            background-color: #DCE4F7;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 24px 64px 0 rgba(71, 26, 112, 0.1);
        }

        .neon-glow {
            filter: blur(60px);
            background: radial-gradient(circle, #0A84FF 0%, rgba(10, 132, 255, 0) 70%);
            animation: pulse-glow 4s ease-in-out infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(1.1); }
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-top-color: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .parallax-container {
            transition: transform 0.1s ease-out;
            perspective: 1000px;
        }

        .parallax-inner {
            transform-style: preserve-3d;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<!-- Micro-interactions Script -->
<script>
        const card = document.getElementById('parallax-target');
        const inner = card.querySelector('.parallax-inner');
        
        // Parallax Effect
        window.addEventListener('mousemove', (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;
            
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        // Touch Parallax (Gyroscope Simulation)
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            const x = (window.innerWidth / 2 - touch.clientX) / 15;
            const y = (window.innerHeight / 2 - touch.clientY) / 15;
            
            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        // Reset on mouse leave
        window.addEventListener('mouseleave', () => {
            card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        });

        // Soft entry animation
        document.addEventListener('DOMContentLoaded', () => {
            card.style.opacity = '0';
            card.style.transform = 'scale(0.9) translateY(20px)';
            
            setTimeout(() => {
                card.style.transition = 'opacity 1.2s cubic-bezier(0.2, 0.8, 0.2, 1), transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1)';
                card.style.opacity = '1';
                card.style.transform = 'scale(1) translateY(0)';
            }, 100);
        });
    </script>
