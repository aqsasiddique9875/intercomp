<style>
        body {
            background: #DCE4F7;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .liquid-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 20% 30%, rgba(163, 76, 190, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 70%, rgba(10, 132, 255, 0.1) 0%, transparent 50%);
            filter: blur(80px);
        }

        .glass-modal {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 0.5px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }

        .floating-label-group {
            position: relative;
        }

        .floating-label {
            position: absolute;
            top: 50%;
            left: 16px;
            transform: translateY(-50%);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            color: #471A70;
            opacity: 0.6;
        }

        .glass-input:focus ~ .floating-label,
        .glass-input:not(:placeholder-shown) ~ .floating-label {
            top: 10px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            opacity: 1;
        }

        .glass-input {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            transition: background 0.3s ease;
        }

        .glass-input:focus {
            background: rgba(255, 255, 255, 0.4);
            ring: none;
            outline: none;
        }

        .btn-primary-gradient {
            background: linear-gradient(135deg, #0A84FF 0%, #0060AB 100%);
            box-shadow: 0 4px 15px rgba(10, 132, 255, 0.3);
            transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1);
        }

        .btn-primary-gradient:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 25px rgba(10, 132, 255, 0.4);
            filter: brightness(1.1);
        }

        .btn-primary-gradient:active {
            transform: scale(0.96);
        }

        .social-circle {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(10px);
            border: 0.5px solid rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }

        .social-circle:hover {
            background: rgba(255, 255, 255, 0.5);
            transform: scale(1.05);
        }

        .spring-in {
            animation: springIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes springIn {
            from { transform: translateY(30px) scale(0.95); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }
    </style>

<!-- Micro-interaction Scripts -->
<script>
        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            try {
                const res = await fetch('http://localhost:8080/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (res.ok) {
                    // Navigate to appropriate dashboard based on role
                    if (data.user.role === 'admin') {
                        window.top.location.hash = '#/admin/verify-queue'; 
                    } else if (data.user.role === 'recruiter' || data.user.role === 'company') {
                        window.top.location.hash = '#/company/dashboard';
                    } else {
                        window.top.location.hash = '#/student/dashboard';
                    }
                } else {
                    alert('Login failed: ' + data.error);
                }
            } catch (err) {
                console.error(err);
                alert('Connection error');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('.glass-input');
            
            inputs.forEach(input => {
                // Initial check for browser autofill
                setTimeout(() => {
                    if (input.value !== "") {
                        input.placeholder = " "; // Trigger the CSS selector
                    }
                }, 100);

                // Add subtle glow on focus via JS for more control
                input.addEventListener('focus', () => {
                    input.parentElement.style.boxShadow = '0 0 20px rgba(163, 76, 190, 0.1)';
                });

                input.addEventListener('blur', () => {
                    input.parentElement.style.boxShadow = 'none';
                });
            });

            // Smooth parallax effect for background
            document.addEventListener('mousemove', (e) => {
                const x = e.clientX / window.innerWidth;
                const y = e.clientY / window.innerHeight;
                
                const bg = document.querySelector('.liquid-bg');
                bg.style.transform = `translate(${x * 20}px, ${y * 20}px)`;
            });
        });
    </script>
