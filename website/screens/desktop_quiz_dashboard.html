<!DOCTYPE html>
<html class="light" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Quiz Studio | Dashboard & Drafts</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(135, 49, 163, 0.2);
            border-radius: 10px;
        }
        .liquid-bg {
            background: linear-gradient(135deg, #f9f9ff 0%, #DCE4F7 100%);
            position: fixed;
            inset: 0;
            z-index: -1;
        }
        .orb {
            position: absolute;
            filter: blur(80px);
            border-radius: 50%;
            z-index: -1;
            opacity: 0.5;
            animation: float 20s infinite alternate ease-in-out;
        }
        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }
    </style>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "primary": "#8731a3",
                        "surface-dim": "#d2daed",
                        "secondary-container": "#54a3ff",
                        "inverse-primary": "#f0b0ff",
                        "on-primary-fixed": "#330044",
                        "orange": "#FF9F0A",
                        "surface-container-lowest": "#ffffff",
                        "background": "#f9f9ff",
                        "on-primary": "#ffffff",
                        "on-background": "#141c29",
                        "surface-variant": "#dbe3f6",
                        "secondary": "#0060ab",
                        "on-surface": "#141c29",
                        "surface-container-high": "#e0e8fb",
                        "glass-thick": "rgba(255, 255, 255, 0.8)",
                        "primary-fixed": "#fbd7ff",
                        "on-primary-container": "#fff5fb",
                        "surface-bright": "#f9f9ff",
                        "surface-container-highest": "#dbe3f6",
                        "surface-container": "#e7eeff",
                        "glass-fill": "rgba(255, 255, 255, 0.35)",
                        "surface": "#f9f9ff",
                        "glass-border": "rgba(255, 255, 255, 0.6)",
                        "error": "#FF453A",
                        "on-secondary": "#ffffff",
                        "on-error": "#ffffff",
                        "surface-container-low": "#f0f3ff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "desktop-margin": "64px"
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-sans overflow-x-hidden min-h-screen relative pb-12">
    <div class="liquid-bg"></div>
    <div class="orb bg-primary-container w-[500px] h-[500px] -top-48 -left-24"></div>
    <div class="orb bg-secondary-container w-[400px] h-[400px] bottom-0 right-0"></div>

    <!-- TopNavBar -->
    <nav class="flex items-center justify-between px-desktop-margin w-full sticky top-0 z-50 bg-glass-thick backdrop-blur-xl border-b border-glass-border shadow-[0_12px_40px_0_rgba(71,26,112,0.15)] h-16">
        <div class="flex items-center gap-8">
            <span class="text-xl font-bold text-primary">QuizStudio</span>
            <div class="hidden md:flex gap-6">
                <a class="text-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Dashboard</a>
                <a class="text-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Question Bank</a>
                <a class="text-sm text-primary font-bold border-b-2 border-primary" href="#">Quiz Hub</a>
                <a class="text-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Assessments</a>
                <a class="text-sm text-on-surface-variant hover:text-primary transition-colors" href="#">Analytics</a>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <button class="material-symbols-outlined p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-all">notifications</button>
                <button class="material-symbols-outlined p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-all">help</button>
                <button class="material-symbols-outlined p-2 text-on-surface-variant hover:bg-surface-container rounded-full transition-all">settings</button>
            </div>
            <img alt="User profile avatar" class="w-10 h-10 rounded-full border-2 border-primary/20" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBD7CbR7h3zagvNbtBv-zu7Ezh8sVqBG6wQPJJfT79p63NqDxYTflFsApc7jS4OzW9Y7ZXfrPPwCpsFQiZRq9nEvoUiTipObKHmjC1dCt9hbOnk84j-kXtzObzLAybsuitsNl-gp_4bJwMT_0l5dFk3W8hNiuZbjoRFWmXBpqc6zxibzvigVdRtFd8zNSXJHA5JJ8s97wkjMu8JgJo5OQxkl0m5Wz3s6MYnMSW50yGAvjQnWLph1a7MKhYAwF8YPKcNHPedNeqVVarv"/>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="px-6 md:px-12 pt-8 max-w-7xl mx-auto">
        <!-- Main Header -->
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-8">
            <div>
                <div class="flex items-center gap-3">
                    <h1 class="text-3xl font-bold text-primary">Quiz Hub</h1>
                    <span id="tab-count-badge" class="px-3 py-1 bg-primary/10 text-primary rounded-full text-xs font-bold border border-primary/20">0</span>
                </div>
                <p class="text-on-surface-variant text-sm mt-1">Monitor published examinations and resume work on your saved quiz drafts.</p>
            </div>
            <button id="create-new-btn" class="bg-primary text-white font-semibold px-6 py-3 rounded-full hover:scale-105 active:scale-95 transition-all shadow-lg shadow-primary/20 flex items-center gap-2">
                <span class="material-symbols-outlined">add_circle</span>
                Create New Quiz
            </button>
        </header>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-glass-border mb-6 gap-6">
            <button id="tab-published" class="px-4 py-3 text-sm font-semibold border-b-2 border-primary text-primary transition-all flex items-center gap-2">
                <span class="material-symbols-outlined text-[20px]">public</span>
                Published Quizzes
            </button>
            <button id="tab-drafts" class="px-4 py-3 text-sm font-semibold text-on-surface-variant hover:text-primary transition-all flex items-center gap-2 border-b-2 border-transparent">
                <span class="material-symbols-outlined text-[20px]">edit_note</span>
                Saved Drafts
            </button>
        </div>

        <!-- Active Tab Content Area -->
        <main id="quiz-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Dynamic Cards Injected Here -->
        </main>

        <!-- Empty State Template -->
        <div id="empty-state" class="hidden glass-panel rounded-3xl p-12 text-center max-w-xl mx-auto border-dashed border-2 border-primary/20 my-12">
            <div class="mb-6 flex justify-center">
                <div class="w-24 h-24 rounded-full bg-primary/5 flex items-center justify-center border border-primary/10 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-transparent animate-pulse"></div>
                    <span class="material-symbols-outlined text-5xl text-primary/30" id="empty-state-icon">inbox</span>
                </div>
            </div>
            <h3 id="empty-state-title" class="text-xl font-bold text-on-surface mb-2">No quizzes available</h3>
            <p id="empty-state-desc" class="text-on-surface-variant text-sm mb-6 max-w-sm mx-auto">Click the button below to start creating new examination questions.</p>
            <button id="empty-action-btn" class="bg-primary text-white font-semibold px-6 py-2.5 rounded-full hover:scale-102 active:scale-98 transition-all shadow-md">
                Get Started
            </button>
        </div>
    </div>

    <!-- Expandable Questions Drawer / Modal Overlay -->
    <div id="questions-modal" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-[1000] hidden items-center justify-center p-4">
        <div class="glass-panel w-full max-w-2xl rounded-3xl shadow-2xl flex flex-col max-h-[85vh] overflow-hidden border border-white/60 animate-in fade-in zoom-in-95 duration-200">
            <div class="p-6 border-b border-glass-border flex justify-between items-center bg-white/30">
                <div>
                    <h3 class="text-lg font-bold text-primary" id="modal-quiz-title">Quiz Details</h3>
                    <p class="text-xs text-on-surface-variant mt-0.5" id="modal-quiz-meta">Duration: -- | Group: --</p>
                </div>
                <button id="close-modal-btn" class="material-symbols-outlined p-2 hover:bg-black/5 rounded-full transition-all text-on-surface-variant">close</button>
            </div>
            <div class="p-6 overflow-y-auto custom-scrollbar space-y-4 flex-1" id="modal-questions-container">
                <!-- Questions injected dynamically -->
            </div>
            <div class="p-6 border-t border-glass-border bg-white/20 flex justify-end">
                <button id="modal-confirm-btn" class="px-6 py-2.5 rounded-full bg-primary text-white font-semibold text-sm shadow-md hover:scale-102 transition-transform active:scale-98">
                    Done
                </button>
            </div>
        </div>
    </div>

    <script>
        // State
        let activeTab = 'published'; // 'published' or 'drafts'
        let publishedTests = [];
        let draftQuizzes = [];

        // Seeded / Fallback mock questions for default database tests
        const mockQuestionsFallback = {
            "default": [
                {
                    text: "What is the primary architectural pattern used in modern microservice applications?",
                    options: ["Monolithic Integration", "Event-Driven Architecture", "Shared Database Architecture", "Tight Coupling"],
                    correctIndex: 1,
                    difficulty: 3,
                    tags: ["Architecture", "System Design"]
                },
                {
                    text: "Which of the following database isolation levels guarantees that transactions will not read dirty data?",
                    options: ["Read Uncommitted", "Read Committed", "Repeatable Read", "Serializable"],
                    correctIndex: 1,
                    difficulty: 2,
                    tags: ["Databases", "Backend"]
                },
                {
                    text: "Which HTTP status code represents 'Internal Server Error'?",
                    options: ["400 Bad Request", "401 Unauthorized", "500 Internal Server Error", "502 Bad Gateway"],
                    correctIndex: 2,
                    difficulty: 1,
                    tags: ["HTTP", "Web Standards"]
                }
            ],
            "Quiz_104_A": [
                {
                    text: "How many planets in our solar system have rings?",
                    options: ["Two", "Four", "Eight", "Six"],
                    correctIndex: 0,
                    difficulty: 2,
                    tags: ["Astronomy", "Science"]
                }
            ],
            "Technical Assessment": [
                {
                    text: "What is the time complexity of searching in a balanced binary search tree?",
                    options: ["O(1)", "O(log n)", "O(n)", "O(n log n)"],
                    correctIndex: 1,
                    difficulty: 2,
                    tags: ["Data Structures", "Algorithms"]
                },
                {
                    text: "Which programming paradigm focuses on writing code that describes what to do rather than how to do it?",
                    options: ["Imperative", "Procedural", "Declarative", "Object-Oriented"],
                    correctIndex: 2,
                    difficulty: 2,
                    tags: ["Programming Paradigms"]
                },
                {
                    text: "What does SQL stand for?",
                    options: ["Structured Query Language", "Sequential Query Language", "Simple Query Linker", "System Query Ledger"],
                    correctIndex: 0,
                    difficulty: 1,
                    tags: ["SQL", "Databases"]
                }
            ],
            "Backend Architecture Quiz": [
                {
                    text: "What does the CAP theorem state about distributed databases?",
                    options: [
                        "It must guarantee Consistency, Availability, and Partition Tolerance simultaneously.",
                        "It can only provide two of Consistency, Availability, and Partition Tolerance.",
                        "Consistency is always prioritized over Partition Tolerance.",
                        "Availability is not affected by network partitions."
                    ],
                    correctIndex: 1,
                    difficulty: 4,
                    tags: ["Distributed Systems", "Architecture"]
                },
                {
                    text: "Which database index strategy is optimal for exact key-value match queries?",
                    options: ["B-Tree Index", "Hash Index", "GIN Index", "Bitmap Index"],
                    correctIndex: 1,
                    difficulty: 3,
                    tags: ["Databases", "Performance"]
                }
            ]
        };

        // Cache DOM elements
        const tabPublishedBtn = document.getElementById('tab-published');
        const tabDraftsBtn = document.getElementById('tab-drafts');
        const tabCountBadge = document.getElementById('tab-count-badge');
        const quizGrid = document.getElementById('quiz-grid');
        const emptyState = document.getElementById('empty-state');
        const createNewBtn = document.getElementById('create-new-btn');
        const emptyActionBtn = document.getElementById('empty-action-btn');

        // Modal elements
        const questionsModal = document.getElementById('questions-modal');
        const modalQuizTitle = document.getElementById('modal-quiz-title');
        const modalQuizMeta = document.getElementById('modal-quiz-meta');
        const modalQuestionsContainer = document.getElementById('modal-questions-container');
        const closeModalBtn = document.getElementById('close-modal-btn');
        const modalConfirmBtn = document.getElementById('modal-confirm-btn');

        // Initializer
        function initDashboard() {
            // Load drafts
            draftQuizzes = JSON.parse(localStorage.getItem('quizDrafts') || '[]');

            // Event Listeners
            tabPublishedBtn.addEventListener('click', () => switchTab('published'));
            tabDraftsBtn.addEventListener('click', () => switchTab('drafts'));
            
            createNewBtn.addEventListener('click', navigateToCreator);
            emptyActionBtn.addEventListener('click', navigateToCreator);

            closeModalBtn.addEventListener('click', hideModal);
            modalConfirmBtn.addEventListener('click', hideModal);
            questionsModal.addEventListener('click', (e) => {
                if (e.target === questionsModal) hideModal();
            });

            // Fetch published tests
            fetchPublishedTests();
        }

        function switchTab(tab) {
            activeTab = tab;
            if (tab === 'published') {
                tabPublishedBtn.className = "px-4 py-3 text-sm font-semibold border-b-2 border-primary text-primary transition-all flex items-center gap-2";
                tabDraftsBtn.className = "px-4 py-3 text-sm font-semibold text-on-surface-variant hover:text-primary transition-all flex items-center gap-2 border-b-2 border-transparent";
                renderPublished();
            } else {
                tabDraftsBtn.className = "px-4 py-3 text-sm font-semibold border-b-2 border-primary text-primary transition-all flex items-center gap-2";
                tabPublishedBtn.className = "px-4 py-3 text-sm font-semibold text-on-surface-variant hover:text-primary transition-all flex items-center gap-2 border-b-2 border-transparent";
                renderDrafts();
            }
        }

        function fetchPublishedTests() {
            fetch('/api/tests', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(res => res.json())
            .then(data => {
                publishedTests = data || [];
                if (activeTab === 'published') {
                    renderPublished();
                } else {
                    updateBadgeCount();
                }
            })
            .catch(err => {
                console.error("Error fetching published tests:", err);
                publishedTests = [];
                if (activeTab === 'published') renderPublished();
            });
        }

        function updateBadgeCount() {
            if (activeTab === 'published') {
                tabCountBadge.textContent = publishedTests.length;
            } else {
                tabCountBadge.textContent = draftQuizzes.length;
            }
        }

        function renderPublished() {
            updateBadgeCount();
            quizGrid.innerHTML = '';

            if (publishedTests.length === 0) {
                showEmptyState("public", "No Published Quizzes", "You have not published any tests to the server yet.", "Create Test");
                return;
            }

            emptyState.classList.add('hidden');
            quizGrid.classList.add('grid');

            publishedTests.forEach(test => {
                const card = document.createElement('div');
                card.className = "glass-panel rounded-3xl p-6 flex flex-col hover:shadow-xl transition-all duration-300 relative border border-white/50 group";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="px-3 py-1 bg-green-500/10 text-green-600 rounded-full text-xs font-semibold flex items-center gap-1 border border-green-500/20">
                            <span class="material-symbols-outlined text-xs">check_circle</span> Published
                        </div>
                        <span class="text-xs text-on-surface-variant/60 font-medium">ID: ${test.id}</span>
                    </div>
                    
                    <h3 class="text-lg font-bold text-primary mb-2 group-hover:text-primary-container transition-colors">${test.title}</h3>
                    
                    <div class="space-y-2 mb-6">
                        <div class="flex items-center gap-2 text-sm text-on-surface-variant">
                            <span class="material-symbols-outlined text-[18px]">timer</span>
                            <span>Duration: ${test.duration}</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-on-surface-variant">
                            <span class="material-symbols-outlined text-[18px]">groups</span>
                            <span>Target Group: ${test.group || 'Group A'}</span>
                        </div>
                        <div class="flex items-center gap-2 text-sm text-on-surface-variant">
                            <span class="material-symbols-outlined text-[18px]">list_alt</span>
                            <span>Total Questions: ${test.questions || 0}</span>
                        </div>
                    </div>

                    <div class="mt-auto pt-4 border-t border-glass-border flex gap-3">
                        <button class="w-full bg-primary text-white py-2.5 rounded-full text-xs font-bold hover:opacity-90 active:scale-95 transition-all shadow-md view-questions-btn" data-id="${test.id}" data-title="${test.title}" data-duration="${test.duration}" data-group="${test.group || 'Group A'}">
                            View Questions
                        </button>
                    </div>
                `;
                quizGrid.appendChild(card);
            });

            // Wire view questions buttons
            document.querySelectorAll('.view-questions-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const testId = this.dataset.id;
                    const title = this.dataset.title;
                    const duration = this.dataset.duration;
                    const group = this.dataset.group;
                    openQuestionsModal(testId, title, duration, group);
                });
            });
        }

        function renderDrafts() {
            updateBadgeCount();
            quizGrid.innerHTML = '';

            if (draftQuizzes.length === 0) {
                showEmptyState("edit_note", "No Saved Drafts", "There are no unfinished quiz drafts stored in your browser.", "Start Draft");
                return;
            }

            emptyState.classList.add('hidden');
            quizGrid.classList.add('grid');

            draftQuizzes.forEach((draft, index) => {
                const card = document.createElement('div');
                card.className = "glass-panel rounded-3xl p-6 flex flex-col hover:shadow-xl transition-all duration-300 relative border border-white/50 group";
                
                card.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <div class="px-3 py-1 bg-primary/10 text-primary rounded-full text-xs font-semibold flex items-center gap-1 border border-primary/20">
                            <span class="material-symbols-outlined text-xs">edit</span> Draft
                        </div>
                        <span class="text-xs text-on-surface-variant/60 font-medium">${draft.savedAt || 'Recently'}</span>
                    </div>
                    
                    <h3 class="text-lg font-bold text-primary mb-2 group-hover:text-primary-container transition-colors">${draft.title || 'Untitled Assessment'}</h3>
                    
                    <div class="space-y-2 mb-6">
                        <div class="flex items-center gap-2 text-sm text-on-surface-variant">
                            <span class="material-symbols-outlined text-[18px]">list_alt</span>
                            <span>Draft Questions: ${(draft.questions || []).length}</span>
                        </div>
                    </div>

                    <div class="mt-auto pt-4 border-t border-glass-border flex gap-3">
                        <button class="flex-grow bg-primary text-white py-2.5 rounded-full text-xs font-bold hover:opacity-90 active:scale-95 transition-all shadow-md resume-btn" data-idx="${index}">
                            Edit / Resume
                        </button>
                        <button class="px-3.5 py-2.5 border border-glass-border rounded-full text-on-surface-variant hover:bg-red-50 hover:text-red-600 hover:border-red-200 active:scale-95 transition-all delete-btn" data-idx="${index}">
                            <span class="material-symbols-outlined text-[18px]">delete</span>
                        </button>
                    </div>
                `;
                quizGrid.appendChild(card);
            });

            // Wire resume and delete buttons
            document.querySelectorAll('.resume-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = this.dataset.idx;
                    resumeDraft(idx);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const idx = parseInt(this.dataset.idx);
                    deleteDraft(idx);
                });
            });
        }

        function showEmptyState(icon, title, desc, actionText) {
            quizGrid.classList.remove('grid');
            quizGrid.innerHTML = '';
            emptyState.classList.remove('hidden');

            document.getElementById('empty-state-icon').textContent = icon;
            document.getElementById('empty-state-title').textContent = title;
            document.getElementById('empty-state-desc').textContent = desc;
            emptyActionBtn.textContent = actionText;
        }

        function navigateToCreator() {
            if (window.parent && window.parent.App && typeof window.parent.App.navigate === 'function') {
                window.parent.App.navigate('test-creator');
            } else {
                console.warn("IFrame Parent routing not detected.");
            }
        }

        function resumeDraft(idx) {
            if (window.parent && window.parent.App && typeof window.parent.App.navigate === 'function') {
                window.parent.App.navigate('test-creator', '?draft_idx=' + idx);
            } else {
                console.warn("IFrame Parent routing not detected.");
            }
        }

        function deleteDraft(idx) {
            if (confirm("Are you sure you want to delete this draft?")) {
                draftQuizzes.splice(idx, 1);
                localStorage.setItem('quizDrafts', JSON.stringify(draftQuizzes));
                renderDrafts();
                showToast("Draft deleted successfully.", "success");
            }
        }

        function openQuestionsModal(testId, title, duration, group) {
            modalQuizTitle.textContent = title;
            modalQuizMeta.textContent = `Duration: ${duration} | Target Group: ${group}`;

            // Fetch questions from localStorage
            let questions = null;
            
            // Try specific test ID first
            const localQuestions = localStorage.getItem(`questions_test_${testId}`);
            if (localQuestions) {
                questions = JSON.parse(localQuestions);
            } else {
                // Try from the global map
                const map = JSON.parse(localStorage.getItem('published_questions_map') || '{}');
                if (map[testId]) {
                    questions = map[testId];
                }
            }

            // Fallback to seeded mock questions matching title, or general default mock questions
            if (!questions) {
                questions = mockQuestionsFallback[title] || mockQuestionsFallback["default"];
            }

            modalQuestionsContainer.innerHTML = '';

            questions.forEach((q, idx) => {
                const qBlock = document.createElement('div');
                qBlock.className = "bg-white/40 border border-glass-border rounded-2xl p-4 space-y-3";

                let optionsHtml = '';
                q.options.forEach((opt, oIdx) => {
                    const label = String.fromCharCode(65 + oIdx);
                    const isCorrect = (oIdx === q.correctIndex);

                    optionsHtml += `
                        <div class="flex items-center gap-2.5 p-2 rounded-xl text-sm ${isCorrect ? 'bg-green-500/10 border border-green-500/25 text-green-700 font-semibold' : 'bg-white/40 text-on-surface-variant border border-transparent'}">
                            <span class="w-6 h-6 rounded-lg ${isCorrect ? 'bg-green-500 text-white' : 'bg-black/5'} flex items-center justify-center font-bold text-xs flex-shrink-0">${label}</span>
                            <span>${opt || "Option " + label}</span>
                            ${isCorrect ? '<span class="material-symbols-outlined text-green-600 text-md ml-auto" style="font-variation-settings: \'FILL\' 1;">check_circle</span>' : ''}
                        </div>
                    `;
                });

                let tagsHtml = (q.tags || []).map(t => `<span class="bg-primary/5 text-primary text-[10px] font-bold px-2 py-0.5 rounded-full border border-primary/10">${t}</span>`).join(' ');

                qBlock.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <h4 class="text-sm font-bold text-on-surface leading-tight">${idx + 1}. ${q.text}</h4>
                        <span class="text-[10px] font-bold uppercase tracking-wider text-primary bg-primary-container/10 px-2 py-0.5 rounded">${getDifficultyLabel(q.difficulty)}</span>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
                        ${optionsHtml}
                    </div>
                    ${tagsHtml ? `<div class="flex flex-wrap gap-1.5 pt-1">${tagsHtml}</div>` : ''}
                `;
                modalQuestionsContainer.appendChild(qBlock);
            });

            questionsModal.classList.remove('hidden');
            questionsModal.classList.add('flex');
            document.body.classList.add('overflow-hidden');
        }

        function getDifficultyLabel(val) {
            const difficulties = { 1: "Easy", 2: "Medium", 3: "Hard", 4: "Expert" };
            return difficulties[val] || "Medium";
        }

        function hideModal() {
            questionsModal.classList.add('hidden');
            questionsModal.classList.remove('flex');
            document.body.classList.remove('overflow-hidden');
        }

        function showToast(message, type = 'success') {
            if (window.parent && window.parent.App && typeof window.parent.App.showToast === 'function') {
                window.parent.App.showToast(message, type);
            } else {
                let container = document.getElementById('local-toast-container');
                if (!container) {
                    container = document.createElement('div');
                    container.id = 'local-toast-container';
                    container.className = 'fixed bottom-5 right-5 z-[5000] flex flex-col gap-3 pointer-events-none';
                    document.body.appendChild(container);
                }
                const toast = document.createElement('div');
                toast.className = `pointer-events-auto flex items-center gap-3 px-6 py-4 rounded-2xl shadow-xl transition-all duration-300 transform translate-y-10 opacity-0 ${
                    type === 'error' ? 'bg-red-500 text-white' : 'bg-primary text-white font-semibold'
                }`;
                toast.innerHTML = `<span class="material-symbols-outlined">${type === 'error' ? 'error' : 'check_circle'}</span><span class="text-sm font-semibold">${message}</span>`;
                container.appendChild(toast);
                toast.offsetHeight;
                toast.classList.remove('translate-y-10', 'opacity-0');
                setTimeout(() => {
                    toast.classList.add('translate-y-10', 'opacity-0');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }
        }

        // Run
        document.addEventListener('DOMContentLoaded', initDashboard);
    </script>
</body>
</html>
