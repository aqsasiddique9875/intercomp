<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {

                      "on-background": "#471A70",
                      "orange": "#FF9F0A",

                      "on-primary": "#ffffff",
                      "on-tertiary-fixed": "#002106",

                      "on-secondary-fixed": "#001c39",

                      "on-tertiary-fixed-variant": "#00531a",
                      "outline": "#817381",

                      "surface-container-high": "#e0e8fb",
                      "error": "#FF453A",
                      "tertiary-container": "#00842f",
                      "on-secondary-container": "#003868",
                      "primary-fixed-dim": "#f0b0ff",
                      "on-surface": "#141c29",
                      "inverse-surface": "#29313f",
                      "glass-border": "rgba(255, 255, 255, 0.6)",
                      "on-tertiary": "#ffffff",
                      "gold": "#FFD60A",

                      "tertiary": "#006823",
                      "primary": "#8731a3",
                      "surface-bright": "#f9f9ff",
                      "on-primary-fixed-variant": "#72188f",

<style>
        body {
            background-color: #DCE4F7;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.35);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
            transition: all 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .glass-card:hover {
            transform: scale(1.02);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 16px 45px 0 rgba(71, 26, 112, 0.2);
        }

        .glass-card:active {
            transform: scale(1.03);
            border: 2px solid rgba(255, 255, 255, 1);
            box-shadow: 0 20px 50px rgba(71, 26, 112, 0.25);
        }

        .animated-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background: linear-gradient(-45deg, #DCE4F7, #f0f3ff, #e7eeff, #f9f9ff);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glow-icon {
            filter: drop-shadow(0 0 15px rgba(135, 49, 163, 0.4));
        }

        .glow-icon-blue {
            filter: drop-shadow(0 0 15px rgba(0, 96, 171, 0.4));
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen">
<div class="animated-bg"></div>
<main class="w-full max-w-max-width px-desktop-margin flex flex-col items-center gap-16 relative z-10">
<!-- Header Section -->
<header class="flex flex-col items-center text-center space-y-6">
<h1 class="font-display-xl text-display-xl text-on-background max-w-2xl">
                Welcome to the Talent Ecosystem. Select your role.
            </h1>
</header>
<!-- Role Selection Grid -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-desktop-gutter w-full max-w-5xl">
<!-- Candidate Card -->
<button class="glass-card flex flex-col items-center p-12 rounded-[2rem] text-center group">
<div class="w-24 h-24 mb-8 flex items-center justify-center bg-primary/10 rounded-3xl glow-icon group-hover:scale-110 transition-transform duration-500">
<span class="material-symbols-outlined text-[48px] text-primary" style="font-variation-settings: 'FILL' 1;">
                        grid_view
                    </span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">I am a Candidate</h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    Find premium internships and jobs tailored to your verified skills.
                </p>
<div class="mt-8 px-6 py-3 bg-primary text-on-primary rounded-full font-label-caps transition-all duration-300">
                    GET STARTED
                </div>
</button>
<!-- Recruiter Card -->
<button class="glass-card flex flex-col items-center p-12 rounded-[2rem] text-center group">
<div class="w-24 h-24 mb-8 flex items-center justify-center bg-secondary/10 rounded-3xl glow-icon-blue group-hover:scale-110 transition-transform duration-500">
<span class="material-symbols-outlined text-[48px] text-secondary" style="font-variation-settings: 'FILL' 1;">
                        hub
                    </span>
</div>
<h2 class="font-headline-lg text-headline-lg text-on-surface mb-4">I am a Recruiter</h2>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
                    Source skill-verified talent and manage your assessment pipeline.
                </p>
<div class="mt-8 px-6 py-3 bg-secondary text-on-primary rounded-full font-label-caps transition-all duration-300">
                    ENTER CONSOLE
                </div>
</button>
</div>
<!-- Decorative Footer Elements -->
<footer class="mt-8 flex items-center gap-8 text-on-surface-variant/60 font-label-caps">
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm">lock</span>
                SECURE ACCESS
            </span>
<span class="w-1 h-1 bg-on-surface-variant/30 rounded-full"></span>
<span class="flex items-center gap-2">
<span class="material-symbols-outlined text-sm">verified_user</span>
                SKILL VERIFIED
            </span>
</footer>
</main>
<!-- Micro-interaction Script -->
<script>
        // Subtle parallax effect on mouse move
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.005;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.005;
            
            document.querySelectorAll('.glass-card').forEach(card => {
                card.style.transform = `translate(${moveX}px, ${moveY}px)`;
            });
        });

        // Click effects
        document.querySelectorAll('.glass-card').forEach(card => {
            card.addEventListener('mousedown', () => {
                card.style.transform = 'scale(1.03)';
            });
            card.addEventListener('mouseup', () => {
                card.style.transform = 'scale(1.02)';
            });
        });
    </script>
</body></html>
