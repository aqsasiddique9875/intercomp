    <script>
        document.addEventListener('mousemove', (e) => {
            const glow = document.getElementById('ambient-glow');
            const x = e.clientX - 300;
            const y = e.clientY - 300;
            glow.style.transform = `translate(${x}px, ${y}px)`;
        });
    
        window.handleQuickApply = function(event) {
            if (event) event.preventDefault();
            event.stopPropagation();
            const target = event.currentTarget || event.target;
            const link = target.getAttribute('data-link');
            
            const card = target.closest('.glass-card');
            let courseName = "Data Science Foundations";
            let coursePrice = "Rs. 199.00";
            if (card) {
                const titleEl = card.querySelector('h3');
                const priceEl = card.querySelector('span.text-headline-md, span.font-headline-md');
                if (titleEl) courseName = titleEl.innerText.trim();
                if (priceEl) coursePrice = priceEl.innerText.trim();
            }
            
            // Store selected course details
            localStorage.setItem('selectedCourse', JSON.stringify({ name: courseName, price: coursePrice }));

            if (window.parent && window.parent.App && typeof window.parent.App.handleQuickApply === 'function') {
                window.parent.App.handleQuickApply('course', link);
            } else {
                const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
                if (isLoggedIn) {
                    window.location.hash = '#/student/checkout';
                } else {
                    localStorage.setItem('pendingQuickApply', JSON.stringify({ type: 'course', link: link, view: 'courses-data' }));
                    window.location.hash = '#/student/login';
                }
            }
        };
</script>
