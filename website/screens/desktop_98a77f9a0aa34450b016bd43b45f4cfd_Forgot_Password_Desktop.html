<style>
        body {
            background-color: #DCE4F7;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }
        .liquid-bg {
            position: absolute;
            width: 800px;
            height: 800px;
            background: radial-gradient(circle, rgba(163, 76, 190, 0.4) 0%, rgba(163, 76, 190, 0) 70%);
            filter: blur(80px);
            z-index: 0;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulse 12s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            50% { transform: translate(-45%, -55%) scale(1.2); opacity: 0.8; }
        }
        .glass-card {
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            background: rgba(255, 255, 255, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 12px 40px 0 rgba(71, 26, 112, 0.15);
        }
        .input-glass {
            background: rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.17, 0.67, 0.41, 1.08);
        }
        .input-glass:focus {
            background: rgba(255, 255, 255, 0.8);
            border-color: #a34cbe;
            box-shadow: 0 0 0 4px rgba(163, 76, 190, 0.1);
            outline: none;
        }
        .btn-press:active {
            transform: scale(0.96);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

<body class="flex items-center justify-center min-h-screen">
<!-- Ambient Liquid Light Leak -->
<div class="liquid-bg"></div>
<!-- Main Content Canvas -->
<main class="relative z-10 w-full max-w-[1280px] px-desktop-margin flex justify-center items-center">
<!-- Glassmorphic Form Card -->
<div class="glass-card w-full max-w-md p-10 rounded-[32px] flex flex-col items-center">
<!-- Branding / Logo Anchor -->
<div class="mb-10 text-center">
<span class="font-display-xl text-display-xl font-bold text-primary tracking-tighter">JobFlow</span>
<p class="font-body-md text-body-md text-on-surface-variant mt-2">Secure recovery portal</p>
</div>
<!-- Form Header -->
<div class="w-full mb-8">
<h1 class="font-headline-lg text-headline-lg text-on-background mb-2">Forgot Password?</h1>
<p class="font-body-md text-body-md text-on-surface-variant">No worries, it happens. Enter your email below and we'll send you a secure reset link.</p>
</div>
<!-- Form Fields -->
<form action="#" class="w-full space-y-6" onsubmit="event.preventDefault();">
<div class="space-y-2">
<label class="font-label-caps text-label-caps text-on-background uppercase px-1" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline group-focus-within:text-primary transition-colors">
                            mail
                        </span>
<input class="input-glass w-full h-14 pl-12 pr-4 rounded-xl font-body-md text-body-md text-on-surface" id="email" placeholder="name@company.com" required="" type="email"/>
</div>
</div>
<!-- Submit Button -->
<button class="btn-press w-full h-14 bg-primary text-on-primary rounded-full font-label-caps text-label-caps flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-primary-container transition-all duration-300" type="submit">
                    Send Reset Link
                    <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Secondary Actions -->
<div class="mt-10 flex flex-col items-center gap-4">
<a class="flex items-center gap-2 font-label-caps text-label-caps text-primary hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined text-[18px]">arrow_back</span>
                    Back to login
                </a>
<div class="h-[1px] w-12 bg-outline-variant mt-2"></div>
<p class="font-body-md text-body-md text-on-surface-variant text-center">
                    Need help? <a class="text-primary font-semibold underline underline-offset-4" href="#">Contact Support</a>
</p>
</div>
</div>
</main>
<!-- Decorative Elements (Floater) -->
<div class="fixed top-20 right-20 w-32 h-32 glass-fill rounded-full blur-xl animate-bounce duration-[4000ms]"></div>
<div class="fixed bottom-20 left-20 w-48 h-48 glass-fill rounded-full blur-2xl opacity-50"></div>
<script>
        // Simple micro-interaction for button press effect using standard curve
        document.querySelectorAll('.btn-press').forEach(button => {
            button.addEventListener('mousedown', () => {
                button.style.transition = 'transform 0.1s cubic-bezier(0.17, 0.67, 0.41, 1.08)';
                button.style.transform = 'scale(0.96)';
            });
            button.addEventListener('mouseup', () => {
                button.style.transform = 'scale(1)';
            });
            button.addEventListener('mouseleave', () => {
                button.style.transform = 'scale(1)';
            });
        });

        // Atmospheric mouse track for the ambient light
        const liquidBg = document.querySelector('.liquid-bg');
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            const moveX = (x - centerX) / 25;
            const moveY = (y - centerY) / 25;
            
            liquidBg.style.transform = `translate(calc(-50% + ${moveX}px), calc(-50% + ${moveY}px)) scale(1.1)`;
        });
    </script>
</body></html>
